<html lang="en">
<head>
<meta charset="utf-8"/>

<title>FIG. 05 / TRUST — Supervised pilot → evidence gate → expansion · The Systems Lens</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap');
:root {
  --bg: #f5f3ed; --surface: #eeece5; --text: #092b3e; --text-dim: #52616a;
  --line: #d4d9d7; --accent: #124f6b; --figure-accent: #174bc5;
  --coral: #c75a42; --coral-soft: #f7ded7; --deep: #06283d;
  --font-display: "Newsreader", Georgia, serif;
  --font-body: "Inter", system-ui, sans-serif;
  --font-label: var(--font-body);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.65 var(--font-body); -webkit-font-smoothing: antialiased;
  padding: 28px 20px 48px;
}
.editorial-figure {
  --figure-accent: #174bc5;
  max-width: 880px; margin: 0 auto;
  padding: 28px 0 24px;
  border-block: 1px solid var(--line);
}
.plate-eyebrow {
  display: flex; justify-content: center; align-items: center; gap: 14px;
  margin: 0 0 17px;
  font: 500 11px/1.5 var(--font-label);
  letter-spacing: .16em; text-transform: uppercase; color: var(--figure-accent);
}
.plate-eyebrow:before, .plate-eyebrow:after {
  content: ""; width: 24px; height: 1px; flex: 0 0 24px;
  background: currentColor; opacity: .5;
}
.editorial-figure h3 {
  margin: 0 auto; max-width: 28ch; padding-inline: 12px;
  font: italic 400 clamp(28px, 3.5vw, 40px)/1.08 var(--font-display);
  letter-spacing: -.025em; color: var(--figure-accent);
  text-align: center; text-wrap: balance;
}
.diagram-stage { margin: 28px auto 0; max-width: 820px; }
.diagram-stage svg { display: block; width: 100%; height: auto; overflow: visible; }
.figure-replay {
  display: block; margin: 10px auto 0; padding: 8px 14px; min-height: 36px;
  color: var(--text-dim); background: transparent; border: 0; cursor: pointer;
  font: 12px/1.5 var(--font-body);
}
.figure-replay:hover { color: var(--figure-accent); text-decoration: underline; text-underline-offset: 4px; }
.editorial-figure figcaption {
  max-width: 58ch; margin: 18px auto 0; padding-inline: 12px;
  font: 15px/1.7 var(--font-body); color: var(--text-dim); text-wrap: pretty;
}
.figure-note {
  display: block; margin-top: 8px;
  font: 12px/1.6 var(--font-body); font-style: normal; color: var(--text-dim);
}
.vs-motion { animation-play-state: running; }
.diagram-stage:not(.is-visible) .vs-motion { animation-play-state: paused; }
.diagram-stage.is-resetting .vs-motion { animation: none !important; }
.sl-flow { stroke-dasharray: 1; stroke-dashoffset: 0; animation: sl-draw 2.6s ease both; }
.sl-reveal { animation: sl-reveal .95s ease both; transform-box: fill-box; transform-origin: center; }
.sl-pulse { animation: sl-pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.sl-trace { stroke-dasharray: 1; stroke-dashoffset: 0; animation: sl-draw 4.2s ease both; }
@keyframes sl-draw { 0% { stroke-dashoffset: 1 } 100% { stroke-dashoffset: 0 } }
@keyframes sl-reveal { 0% { opacity: .1; transform: translateY(8px) } 100% { opacity: 1; transform: translateY(0) } }
@keyframes sl-pulse { 0%,100% { opacity: .55; transform: scale(.98) } 45% { opacity: 1; transform: scale(1.04) } }
@media (prefers-reduced-motion: reduce) {
  .vs-motion, .sl-flow, .sl-reveal, .sl-pulse, .sl-trace { animation: none !important; }
  .figure-replay { display: none !important; }
}
</style>
</head>

nt-size="14" fill="var(--text, #092b3e)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">Evidence</text><text x="300" y="110" text-anchor="middle" font-size="13" fill="var(--text-dim, #52616a)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">packet</text></g><g class="vs-motion sl-reveal" style="animation-delay:1.15s"><rect x="520" y="60" width="100" height="70" fill="var(--bg, #f5f3ed)" stroke="var(--figure-accent, #174bc5)" stroke-width="1.5"/><text x="570" y="90" text-anchor="middle" font-size="14" fill="var(--text, #092b3e)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">Careful</text><text x="570" y="110" text-anchor="middle" font-size="13" fill="var(--text-dim, #52616a)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">expansion</text></g><g class="vs-motion sl-reveal" style="animation-delay:0.7s"><rect x="400" y="48" width="40" height="94" fill="var(--bg, #f5f3ed)" stroke="var(--figure-accent, #174bc5)" stroke-width="1.5"/><text x="420" y="40" text-anchor="middle" font-size="11" letter-spacing="1.4" fill="var(--figure-accent, #174bc5)" style="font-family:var(--font-label,Inter,Arial,sans-serif)">GATE</text><text x="420" y="100" text-anchor="middle" font-size="11" fill="var(--figure-accent, #174bc5)" font-weight="600" style="font-family:var(--font-body,Inter,Arial,sans-serif)">HOLD</text></g><g class="vs-motion sl-reveal" style="animation-delay:0.85s"><text x="420" y="160" text-anchor="middle" font-size="11" fill="var(--text-dim, #52616a)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">Evidence required</text></g><path d="M620 95 H665" fill="none" stroke="var(--line, #d4d9d7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M620 95 H665" fill="none" stroke="var(--coral, #c75a42)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:1.35s"/><g class="vs-motion sl-pulse"><circle cx="710" cy="95" r="34" fill="var(--bg, #f5f3ed)" stroke="var(--coral, #c75a42)" stroke-width="2"/><text x="710" y="92" text-anchor="middle" font-size="10" fill="var(--coral, #c75a42)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">OVERRIDE</text><text x="710" y="108" text-anchor="middle" font-size="10" fill="var(--text-dim, #52616a)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">always on</text></g><path d="M420 142 V200 H200" fill="none" stroke="var(--line, #d4d9d7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M420 142 V200 H200" fill="none" stroke="var(--coral, #c75a42)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:1.45s"/><g class="vs-motion sl-reveal" style="animation-delay:1.65s"><rect x="120" y="200" width="160" height="55" fill="var(--coral-soft, #f7ded7)" stroke="var(--coral, #c75a42)" stroke-width="1.5"/><text x="200" y="225" text-anchor="middle" font-size="14" fill="var(--coral, #c75a42)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">Stop / correct</text><text x="200" y="245" text-anchor="middle" font-size="11" fill="var(--coral, #c75a42)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">Failed the gate</text></g></svg>
    </div>
    <button class="figure-replay" type="button" aria-controls="fig-05-stage" aria-label="Replay Supervised pilot → evidence gate → expansion diagram">Replay diagram ↻</button>
  </div>
  <figcaption>Trust is built in cycles. Autonomy without evidence is just speed toward the wrong failure.<span class="figure-note">Conceptual control path, not a safety case or regulatory approval process. People retain the decision.</span></figcaption>
</figure>
<script>
(function () {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  const stage = document.querySelector('.diagram-stage');
  const btn = document.querySelector('.figure-replay');
  if (!stage || !btn) return;
  const show = () => { stage.classList.add('is-visible'); };
  // Start once in view (or immediately for file://)
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) if (e.isIntersecting) { show(); io.disconnect(); }
    }, { threshold: 0.15 });
    io.observe(stage);
  } else show();
  // Fallback: always visible after short delay for offline open
  setTimeout(show, 120);
  btn.hidden = reduce.matches;
  reduce.addEventListener('change', () => { btn.hidden = reduce.matches; });
  btn.addEventListener('click', () => {
    if (reduce.matches) return;
    stage.classList.add('is-visible', 'is-resetting');
    void stage.offsetWidth;
    stage.classList.remove('is-resetting');
  });
})();
</script>
