:root {
  --bg: #f5f3ed; --surface: #eeece5; --text: #092b3e; --text-dim: #52616a;
  --line: #d4d9d7; --accent: #124f6b; --figure-accent: #174bc5;
  --coral: #c75a42; --coral-soft: #f7ded7; --deep: #06283d;
  --font-display: "Newsreader", Georgia, serif;
  --font-body: "Inter", system-ui, sans-serif;
  --font-label: var(--font-body);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.65 var(--font-body); -webkit-font-smoothing: antialiased;
  padding: 28px 20px 48px;
}
.editorial-figure {
  --figure-accent: #174bc5;
  max-width: 880px; margin: 0 auto;
  padding: 28px 0 24px;
  border-block: 1px solid var(--line);
}
.plate-eyebrow {
  display: flex; justify-content: center; align-items: center; gap: 14px;
  margin: 0 0 17px;
  font: 500 11px/1.5 var(--font-label);
  letter-spacing: .16em; text-transform: uppercase; color: var(--figure-accent);
}
.plate-eyebrow:before, .plate-eyebrow:after {
  content: ""; width: 24px; height: 1px; flex: 0 0 24px;
  background: currentColor; opacity: .5;
}
.editorial-figure h3 {
  margin: 0 auto; max-width: 28ch; padding-inline: 12px;
  font: italic 400 clamp(28px, 3.5vw, 40px)/1.08 var(--font-display);
  letter-spacing: -.025em; color: var(--figure-accent);
  text-align: center; text-wrap: balance;
}
.diagram-stage { margin: 28px auto 0; max-width: 820px; }
.diagram-stage svg { display: block; width: 100%; height: auto; overflow: visible; }
.figure-replay {
  display: block; margin: 10px auto 0; padding: 8px 14px; min-height: 36px;
  color: var(--text-dim); background: transparent; border: 0; cursor: pointer;
  font: 12px/1.5 var(--font-body);
}
.figure-replay:hover { color: var(--figure-accent); text-decoration: underline; text-underline-offset: 4px; }
.editorial-figure figcaption {
  max-width: 58ch; margin: 18px auto 0; padding-inline: 12px;
  font: 15px/1.7 var(--font-body); color: var(--text-dim); text-wrap: pretty;
}
.figure-note {
  display: block; margin-top: 8px;
  font: 12px/1.6 var(--font-body); font-style: normal; color: var(--text-dim);
}
.vs-motion { animation-play-state: running; }
.diagram-stage:not(.is-visible) .vs-motion { animation-play-state: paused; }
.diagram-stage.is-resetting .vs-motion { animation: none !important; }
.sl-flow { stroke-dasharray: 1; stroke-dashoffset: 0; animation: sl-draw 2.6s ease both; }
.sl-reveal { animation: sl-reveal .95s ease both; transform-box: fill-box; transform-origin: center; }
.sl-pulse { animation: sl-pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.sl-trace { stroke-dasharray: 1; stroke-dashoffset: 0; animation: sl-draw 4.2s ease both; }
@keyframes sl-draw { 0% { stroke-dashoffset: 1 } 100% { stroke-dashoffset: 0 } }
@keyframes sl-reveal { 0% { opacity: .1; transform: translateY(8px) } 100% { opacity: 1; transform: translateY(0) } }
@keyframes sl-pulse { 0%,100% { opacity: .55; transform: scale(.98) } 45% { opacity: 1; transform: scale(1.04) } }
@media (prefers-reduced-motion: reduce) {
  .vs-motion, .sl-flow, .sl-reveal, .sl-pulse, .sl-trace { animation: none !important; }
  .figure-replay { display: none !important; }
}
</style>

</defs><title id="t">Pipe shop vs technology company</title><desc id="d">Left: civil shop and an unused dashboard. Right: one shared picture. NextEra footnote.</desc><text x="195" y="28" text-anchor="middle" font-size="11" letter-spacing="1.4" fill="var(--figure-accent, #174bc5)" style="font-family:var(--font-label,Inter,Arial,sans-serif)">01 / PIPE SHOP</text><g class="vs-motion sl-reveal" style="animation-delay:0s"><rect x="50" y="55" width="290" height="70" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)" stroke-width="1.5"/><text x="195" y="85" text-anchor="middle" font-size="17" fill="var(--text, #092b3e)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">Civil shop + help desk</text><text x="195" y="108" text-anchor="middle" font-size="13" fill="var(--text-dim, #52616a)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">Tools treated as support</text></g><path d="M195 125 V155" fill="none" stroke="var(--line, #d4d9d7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M195 125 V155" fill="none" stroke="var(--figure-accent, #174bc5)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0.2s"/><g class="vs-motion sl-reveal" style="animation-delay:0.5s"><rect x="80" y="160" width="230" height="64" fill="var(--coral-soft, #f7ded7)" stroke="var(--coral, #c75a42)" stroke-width="1.5"/><text x="195" y="198" text-anchor="middle" font-size="14" fill="var(--coral, #c75a42)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">Dashboard sitting unused</text></g><g class="vs-motion sl-reveal" style="animation-delay:0.9s"><text x="195" y="255" text-anchor="middle" font-size="14" fill="var(--text-dim, #52616a)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">Tools stay off to the side.</text></g><path d="M410 40 V270" fill="none" stroke="var(--line, #d4d9d7)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="615" y="28" text-anchor="middle" font-size="11" letter-spacing="1.4" fill="var(--figure-accent, #174bc5)" style="font-family:var(--font-label,Inter,Arial,sans-serif)">02 / ONE PICTURE</text><g class="vs-motion sl-reveal" style="animation-delay:0.2s"><rect x="470" y="55" width="290" height="70" fill="var(--bg, #f5f3ed)" stroke="var(--figure-accent, #174bc5)" stroke-width="1.5"/><text x="615" y="82" text-anchor="middle" font-size="16" fill="var(--text, #092b3e)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">Shared operational picture</text><text x="615" y="105" text-anchor="middle" font-size="13" fill="var(--text-dim, #52616a)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">Crews · control room · capital</text></g><path d="M615 125 V155" fill="none" stroke="var(--line, #d4d9d7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M615 125 V155" fill="none" stroke="var(--figure-accent, #174bc5)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0.4s"/><g class="vs-motion sl-reveal" style="animation-delay:0.7s"><rect x="470" y="160" width="290" height="70" fill="var(--bg, #f5f3ed)" stroke="var(--figure-accent, #174bc5)" stroke-width="1.5"/><text x="615" y="188" text-anchor="middle" font-size="16" fill="var(--figure-accent, #174bc5)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">Meaning owned in-house</text><text x="615" y="210" text-anchor="middle" font-size="13" fill="var(--text-dim, #52616a)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">SCADA · GIS · CMMS linked</text></g><g class="vs-motion sl-reveal" style="animation-delay:1.1s"><text x="615" y="255" text-anchor="middle" font-size="14" fill="var(--figure-accent, #174bc5)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">Same pipes. One shared picture.</text></g><g class="vs-motion sl-reveal" style="animation-delay:1.5s"><text x="410" y="300" text-anchor="middle" font-size="11" letter-spacing="1.4" fill="var(--figure-accent, #174bc5)" style="font-family:var(--font-label,Inter,Arial,sans-serif)">ASIDE</text><text x="410" y="328" text-anchor="middle" font-size="14" fill="var(--text-dim, #52616a)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">NextEra: a technology company that delivers electricity.</text><text x="410" y="350" text-anchor="middle" font-size="13" fill="var(--text-dim, #52616a)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">Transfer the identity lesson — not the scale.</text></g></svg>

  <figcaption>Left is a civil shop that treats software as support, so the dashboard sits unused. Right is the same pipes, with crews, the control room, and capital looking at one picture.<span class="figure-note">Conceptual framework, not a measured comparison of any utility or vendor. NextEra’s capital markets differ from municipal water; the transferable lesson is identity, not scale.</span></figcaption>
</figure>
<script>
(function () {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  const stage = document.querySelector('.diagram-stage');
  const btn = document.querySelector('.figure-replay');
  if (!stage || !btn) return;
  const show = () => { stage.classList.add('is-visible'); };
  // Start once in view (or immediately for file://)
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) if (e.isIntersecting) { show(); io.disconnect(); }
    }, { threshold: 0.15 });
    io.observe(stage);
  } else show();
  // Fallback: always visible after short delay for offline open
  setTimeout(show, 120);
  btn.hidden = reduce.matches;
  reduce.addEventListener('change', () => { btn.hidden = reduce.matches; });
  btn.addEventListener('click', () => {
    if (reduce.matches) return;
    stage.classList.add('is-visible', 'is-resetting');
    void stage.offsetWidth;
    stage.classList.remove('is-resetting');
  });
})();
</script>
