<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>FIG. 01 / TEAMMATE — Sense → act → measure → compare · The Systems Lens</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap');
:root {
  --bg: #f5f3ed; --surface: #eeece5; --text: #092b3e; --text-dim: #52616a;
  --line: #d4d9d7; --accent: #124f6b; --figure-accent: #174bc5;
  --coral: #c75a42; --coral-soft: #f7ded7; --deep: #06283d;
  --font-display: "Newsreader", Georgia, serif;
  --font-body: "Inter", system-ui, sans-serif;
  --font-label: var(--font-body);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.65 var(--font-body); -webkit-font-smoothing: antialiased;
  padding: 28px 20px 48px;
}
.editorial-figure {
  --figure-accent: #174bc5;
  max-width: 880px; margin: 0 auto;
  padding: 28px 0 24px;
  border-block: 1px solid var(--line);
}
.plate-eyebrow {
  display: flex; justify-content: center; align-items: center; gap: 14px;
  margin: 0 0 17px;
  font: 500 11px/1.5 var(--font-label);
  letter-spacing: .16em; text-transform: uppercase; color: var(--figure-accent);
}
.plate-eyebrow:before, .plate-eyebrow:after {
  content: ""; width: 24px; height: 1px; flex: 0 0 24px;
  background: currentColor; opacity: .5;
}
.editorial-figure h3 {
  margin: 0 auto; max-width: 28ch; padding-inline: 12px;
  font: italic 400 clamp(28px, 3.5vw, 40px)/1.08 var(--font-display);
  letter-spacing: -.025em; color: var(--figure-accent);
  text-align: center; text-wrap: balance;
}
.diagram-stage { margin: 28px auto 0; max-width: 820px; }
.diagram-stage svg { display: block; width: 100%; height: auto; overflow: visible; }
.figure-replay {
  display: block; margin: 10px auto 0; padding: 8px 14px; min-height: 36px;
  color: var(--text-dim); background: transparent; border: 0; cursor: pointer;
  font: 12px/1.5 var(--font-body);
}
.figure-replay:hover { color: var(--figure-accent); text-decoration: underline; text-underline-offset: 4px; }
.editorial-figure figcaption {
  max-width: 58ch; margin: 18px auto 0; padding-inline: 12px;
  font: 15px/1.7 var(--font-body); color: var(--text-dim); text-wrap: pretty;
}
.figure-note {
  display: block; margin-top: 8px;
  font: 12px/1.6 var(--font-body); font-style: normal; color: var(--text-dim);
}
.vs-motion { animation-play-state: running; }
.diagram-stage:not(.is-visible) .vs-motion { animation-play-state: paused; }
.diagram-stage.is-resetting .vs-motion { animation: none !important; }
.sl-flow { stroke-dasharray: 1; stroke-dashoffset: 0; animation: sl-draw 2.6s ease both; }
.sl-reveal { animation: sl-reveal .95s ease both; transform-box: fill-box; transform-origin: center; }
.sl-pulse { animation: sl-pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.sl-trace { stroke-dasharray: 1; stroke-dashoffset: 0; animation: sl-draw 4.2s ease both; }
@keyframes sl-draw { 0% { stroke-dashoffset: 1 } 100% { stroke-dashoffset: 0 } }
@keyframes sl-reveal { 0% { opacity: .1; transform: translateY(8px) } 100% { opacity: 1; transform: translateY(0) } }
@keyframes sl-pulse { 0%,100% { opacity: .55; transform: scale(.98) } 45% { opacity: 1; transform: scale(1.04) } }
@media (prefers-reduced-motion: reduce) {
  .vs-motion, .sl-flow, .sl-reveal, .sl-pulse, .sl-trace { animation: none !important; }
  .figure-replay { display: none !important; }
}
</style>
</head>
<body>
<figure class="editorial-figure" id="fig-01">
  <div class="plate-surface">
    <p class="plate-eyebrow"><span>FIG. 01 / TEAMMATE</span><span>The Systems Lens</span></p>

    <div class="diagram-stage is-visible" id="fig-01-stage">

  <marker id="m-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--coral, #c75a42)" stroke-width="1.5"/></marker>

</defs><title id="t">Sense → act → measure → compare</title><desc id="d">Responsibility loop with operator override always available.</desc><path d="M410 67 A118 118 0 1 1 409.9 67" fill="none" stroke="var(--figure-accent, #174bc5)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M410 67 A118 118 0 1 1 409.9 67" fill="none" stroke="var(--text, #092b3e)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="100" class="vs-motion sl-flow" style="animation-duration:4.2s"/><g class="vs-motion sl-reveal" style="animation-delay:0s"><rect x="338" y="39" width="144" height="56" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)" stroke-width="1.5"/><text x="410" y="63" text-anchor="middle" font-size="15" fill="var(--figure-accent, #174bc5)" font-weight="600" style="font-family:var(--font-body,Inter,Arial,sans-serif)">SENSE</text><text x="410" y="83" text-anchor="middle" font-size="12" fill="var(--text-dim, #52616a)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">SCADA signal</text></g><g class="vs-motion sl-reveal" style="animation-delay:0.35s"><rect x="464" y="157" width="144" height="56" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)" stroke-width="1.5"/><text x="536" y="181" text-anchor="middle" font-size="15" fill="var(--figure-accent, #174bc5)" font-weight="600" style="font-family:var(--font-body,Inter,Arial,sans-serif)">SUGGEST</text><text x="536" y="201" text-anchor="middle" font-size="12" fill="var(--text-dim, #52616a)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">AI teammate</text></g><g class="vs-motion sl-reveal" style="animation-delay:0.7s"><rect x="338" y="275" width="144" height="56" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)" stroke-width="1.5"/><text x="410" y="299" text-anchor="middle" font-size="15" fill="var(--figure-accent, #174bc5)" font-weight="600" style="font-family:var(--font-body,Inter,Arial,sans-serif)">DECIDE</text><text x="410" y="319" text-anchor="middle" font-size="12" fill="var(--text-dim, #52616a)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">Operator owns call</text></g><g class="vs-motion sl-reveal" style="animation-delay:1.05s"><rect x="212" y="157" width="144" height="56" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)" stroke-width="1.5"/><text x="284" y="181" text-anchor="middle" font-size="15" fill="var(--figure-accent, #174bc5)" font-weight="600" style="font-family:var(--font-body,Inter,Arial,sans-serif)">MEASURE</text><text x="284" y="201" text-anchor="middle" font-size="12" fill="var(--text-dim, #52616a)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">Compare baseline</text></g><g class="vs-motion sl-reveal" style="animation-delay:0.2s"><text x="410" y="177" text-anchor="middle" font-size="22" fill="var(--text, #092b3e)" style="font-family:var(--font-display,Newsreader,Georgia,serif)">Human stays</text><text x="410" y="203" text-anchor="middle" font-size="22" fill="var(--text, #092b3e)" style="font-family:var(--font-display,Newsreader,Georgia,serif)">in the loop.</text></g><g class="vs-motion sl-pulse"><circle cx="505" cy="295" r="24" fill="var(--bg, #f5f3ed)" stroke="var(--coral, #c75a42)" stroke-width="2"/><text x="505" y="299" text-anchor="middle" font-size="9" fill="var(--coral, #c75a42)" font-weight="400" style="font-family:var(--font-body,Inter,Arial,sans-serif)">OVERRIDE</text></g></svg>
    </div>
    <button class="figure-replay" type="button" aria-controls="fig-01-stage" aria-label="Replay Sense → act → measure → compare diagram">Replay diagram ↻</button>
  </div>
  <figcaption>Sense, suggest, decide, measure again. The human stays in the loop. Autonomy is earned, not purchased.<span class="figure-note">Conceptual loop, not a control narrative for any plant. Does not imply automatic causation or unmanned operation.</span></figcaption>
</figure>
<script>
(function () {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  const stage = document.querySelector('.diagram-stage');
  const btn = document.querySelector('.figure-replay');
  if (!stage || !btn) return;
  const show = () => { stage.classList.add('is-visible'); };
  // Start once in view (or immediately for file://)
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) if (e.isIntersecting) { show(); io.disconnect(); }
    }, { threshold: 0.15 });
    io.observe(stage);
  } else show();
  // Fallback: always visible after short delay for offline open
  setTimeout(show, 120);
  btn.hidden = reduce.matches;
  reduce.addEventListener('change', () => { btn.hidden = reduce.matches; });
  btn.addEventListener('click', () => {
    if (reduce.matches) return;
    stage.classList.add('is-visible', 'is-resetting');
    void stage.offsetWidth;
    stage.classList.remove('is-resetting');
  });
})();
</script>
</body>
</html>
