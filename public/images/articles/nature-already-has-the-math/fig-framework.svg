<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" role="img" aria-labelledby="fig5-title fig5-desc"><style>.node { fill: #d1d8e7; stroke: #d4d9d7; stroke-width: 1.5; }
.node-strong { fill: #e1e8f7; stroke: #174bc5; stroke-width: 2; }
.node-dark { fill: #06283d; }
.node-warm { fill: #fff4d6; stroke: #d7b453; stroke-width: 1.5; }
.node-risk { fill: #f7ded7; stroke: #c75a42; stroke-width: 1.5; }
.label { fill: #092b3e; font: 700 18px 'Inter', Arial, sans-serif; }
.small { fill: #52616a; font: 500 13px 'Inter', Arial, sans-serif; }
.tiny { fill: #52616a; font: 500 12px 'Inter', Arial, sans-serif; }
.on-dark { fill: #f5f3ed; }
.connector { fill: none; stroke: #174bc5; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
.connector-soft { fill: none; stroke: #d4d9d7; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-soft); }
.connector-risk { fill: none; stroke: #c75a42; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-risk); }
.water-band { fill: none; stroke: #91d0ea; stroke-width: 18; stroke-linecap: round; opacity: .38; }
.ring { fill: none; stroke: #174bc5; stroke-width: 2; stroke-dasharray: 7 7; opacity: .7; }</style><defs>
              <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#174bc5"/></marker>
              <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d4d9d7"/></marker>
              <marker id="arrow-risk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c75a42"/></marker>
            </defs>
            <title id="fig5-title">Systems Lens framework for utility AI</title>
            <desc id="fig5-desc">A layered loop connecting nature, physics, infrastructure, people, records, AI, accountable decisions, and public trust.</desc>
            <defs>
              <marker id="arrow5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#174bc5"/></marker>
            </defs>
            <rect class="node" x="78" y="62" width="210" height="78" rx="6" />
            <text class="label" x="183" y="92" text-anchor="middle">Nature moves</text>
            <text class="small" x="183" y="114" text-anchor="middle">rain, groundwater, rivers</text>

            <rect class="node" x="365" y="62" width="210" height="78" rx="6" />
            <text class="label" x="470" y="92" text-anchor="middle">Physics translates</text>
            <text class="small" x="470" y="114" text-anchor="middle">flow, pressure, decay</text>

            <rect class="node" x="652" y="62" width="210" height="78" rx="6" />
            <text class="label" x="757" y="92" text-anchor="middle">Assets intervene</text>
            <text class="small" x="757" y="114" text-anchor="middle">pipes, pumps, plants</text>

            <rect class="node" x="652" y="246" width="210" height="78" rx="6" />
            <text class="label" x="757" y="276" text-anchor="middle">People interpret</text>
            <text class="small" x="757" y="298" text-anchor="middle">operators, crews, engineers</text>

            <rect class="node" x="365" y="246" width="210" height="78" rx="6" />
            <text class="label" x="470" y="276" text-anchor="middle">Records connect</text>
            <text class="small" x="470" y="298" text-anchor="middle">SCADA, GIS, CMMS, lab</text>

            <rect class="node-strong" x="78" y="246" width="210" height="78" rx="6" />
            <text class="label" x="183" y="276" text-anchor="middle">AI must preserve</text>
            <text class="small" x="183" y="298" text-anchor="middle">source, context, consequence</text>

            <rect class="node-dark" x="220" y="430" width="230" height="86" rx="6" />
            <text class="label on-dark" x="335" y="462" text-anchor="middle">Accountable decisions</text>
            <text class="small on-dark" x="335" y="486" text-anchor="middle">repair, renew, respond, explain</text>

            <rect class="node-warm" x="490" y="430" width="230" height="86" rx="6" />
            <text class="label" x="605" y="462" text-anchor="middle">Public trust</text>
            <text class="small" x="605" y="486" text-anchor="middle">service, permits, rates, confidence</text>

            <path class="connector" style="marker-end:url(#arrow5)" d="M288 101 L365 101" />
            <path class="connector" style="marker-end:url(#arrow5)" d="M575 101 L652 101" />
            <path class="connector" style="marker-end:url(#arrow5)" d="M757 140 L757 246" />
            <path class="connector" style="marker-end:url(#arrow5)" d="M652 285 L575 285" />
            <path class="connector" style="marker-end:url(#arrow5)" d="M365 285 L288 285" />
            <path class="connector" style="marker-end:url(#arrow5)" d="M183 324 C200 386 250 418 302 430" />
            <path class="connector" style="marker-end:url(#arrow5)" d="M450 473 L490 473" />
            <path class="connector" style="marker-end:url(#arrow5)" d="M720 473 L900 473 L900 285 L862 285" />
            <text class="small" x="896" y="380" text-anchor="end">community feedback</text>
            <path class="connector" style="marker-end:url(#arrow5)" d="M220 473 L38 473 L38 101 L78 101" />
            <text class="small" x="59" y="395">human interventions</text>
            <text class="tiny" x="470" y="558" text-anchor="middle">The standard is not fluent answers. The standard is connected reasoning with evidence people can check.</text>
          </svg>