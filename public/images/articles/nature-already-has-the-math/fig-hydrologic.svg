            <path class="connector" d="M270 364 C310 392 346 414 382 426" />
            <path class="connector" d="M558 426 C612 408 650 382 674 350" />
            <path class="connector" d="M730 298 L730 232" />
            <text class="small" x="711" y="272" text-anchor="end">supply</text>
