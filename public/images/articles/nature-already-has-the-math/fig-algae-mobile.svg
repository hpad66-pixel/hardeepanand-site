<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 1190" role="img" aria-labelledby="nature-mobile-algae-title nature-mobile-algae-desc"><style>.node { fill: #d1d8e7; stroke: #d4d9d7; stroke-width: 1.5; }
.node-strong { fill: #e1e8f7; stroke: #174bc5; stroke-width: 2; }
.node-dark { fill: #06283d; }
.node-warm { fill: #fff4d6; stroke: #d7b453; stroke-width: 1.5; }
.node-risk { fill: #f7ded7; stroke: #c75a42; stroke-width: 1.5; }
.label { fill: #092b3e; font: 700 18px 'Inter', Arial, sans-serif; }
.small { fill: #52616a; font: 500 13px 'Inter', Arial, sans-serif; }
.tiny { fill: #52616a; font: 500 12px 'Inter', Arial, sans-serif; }
.on-dark { fill: #f5f3ed; }
.connector { fill: none; stroke: #174bc5; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
.connector-soft { fill: none; stroke: #d4d9d7; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-soft); }
.connector-risk { fill: none; stroke: #c75a42; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-risk); }
.water-band { fill: none; stroke: #91d0ea; stroke-width: 18; stroke-linecap: round; opacity: .38; }
.ring { fill: none; stroke: #174bc5; stroke-width: 2; stroke-dasharray: 7 7; opacity: .7; }</style><defs>
              <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#174bc5"/></marker>
              <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d4d9d7"/></marker>
              <marker id="arrow-risk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c75a42"/></marker>
            </defs>
<title id="nature-mobile-algae-title">Bloom conditions and two consequence pathways</title>
<desc id="nature-mobile-algae-desc">Heat and sunlight, nutrients from runoff and upstream land use, and low flow with longer residence time are parallel influences on a bloom. A bloom can lower dissolved oxygen through respiration and decomposition, potentially stressing or killing fish. Separately, it can strain treatment through taste, odor and sampling needs. Both pathways inform public response: sampling, customer communication, source protection and capital choices. These are possible pathways, not a diagnosis; not every bloom produces toxins or explains a fish kill.</desc>
<defs><marker id="nature-mobile-algae-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#174bc5"/></marker><marker id="nature-mobile-algae-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#c75a42"/></marker></defs>
<path class="connector" d="M248 60 H264 V412 H248" style="marker-end:url(#nature-mobile-algae-arrow)"><title>Heat and sunlight can favor a bloom</title></path>
<path class="connector" d="M248 184 H264 V412 H248" style="marker-end:url(#nature-mobile-algae-arrow)"><title>Nutrient inputs can favor a bloom</title></path>
<path class="connector" d="M248 308 H264 V412 H248" style="marker-end:url(#nature-mobile-algae-arrow)"><title>Low flow and residence time can favor a bloom</title></path>
<path class="connector-risk" d="M140 463 V520" style="marker-end:url(#nature-mobile-algae-risk)"><title>Respiration and decomposition can lower dissolved oxygen</title></path>
<path class="connector" d="M32 410 H12 V830 H32" style="marker-end:url(#nature-mobile-algae-arrow)"><title>A bloom can separately strain treatment</title></path>
<path class="connector-risk" d="M140 629 V670" style="marker-end:url(#nature-mobile-algae-risk)"><title>Low dissolved oxygen can stress or kill fish</title></path>
<path class="connector-risk" d="M248 714 H264 V1006 H248" style="marker-end:url(#nature-mobile-algae-risk)"><title>Fish stress or kill informs public response</title></path>
<path class="connector" d="M140 893 V946" style="marker-end:url(#nature-mobile-algae-arrow)"><title>Treatment strain informs public response</title></path>
<g data-node="heat" data-padding="8"><rect class="node" x="32" y="16" width="216" height="69" rx="6"/><text class="label" x="140" y="44" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="44">Heat</tspan></text><text class="small" x="140" y="69" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="69">Sunlight and temperature</tspan></text></g>
<g data-node="nutrients" data-padding="8"><rect class="node" x="32" y="140" width="216" height="89" rx="6"/><text class="label" x="140" y="168" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="168">Nutrients</tspan></text><text class="small" x="140" y="193" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="193">Runoff and upstream</tspan><tspan x="140" y="213">land use</tspan></text></g>
<g data-node="flow" data-padding="8"><rect class="node" x="32" y="264" width="216" height="69" rx="6"/><text class="label" x="140" y="292" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="292">Low flow</tspan></text><text class="small" x="140" y="317" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="317">Longer residence time</tspan></text></g>
<g data-node="bloom" data-padding="8"><rect class="node-strong" x="32" y="374" width="216" height="89" rx="6"/><text class="label" x="140" y="402" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="402">Algae bloom</tspan></text><text class="small" x="140" y="427" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="427">Visible change</tspan><tspan x="140" y="447">in source water</tspan></text></g>
<g data-node="oxygen" data-padding="8"><rect class="node-risk" x="32" y="520" width="216" height="109" rx="6"/><text class="label" x="140" y="548" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="548">Low oxygen</tspan></text><text class="small" x="140" y="573" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="573">Respiration and</tspan><tspan x="140" y="593">decomposition can use</tspan><tspan x="140" y="613">up dissolved oxygen.</tspan></text></g>
<g data-node="fish" data-padding="8"><rect class="node-risk" x="32" y="670" width="216" height="89" rx="6"/><text class="label" x="140" y="698" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="698">Fish stress or kill</tspan></text><text class="small" x="140" y="723" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="723">A possible outcome;</tspan><tspan x="140" y="743">check local conditions.</tspan></text></g>
<g data-node="treatment" data-padding="8"><rect class="node-warm" x="32" y="784" width="216" height="109" rx="6"/><text class="label" x="140" y="812" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="812">Treatment strain</tspan></text><text class="small" x="140" y="837" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="837">Taste and odor;</tspan><tspan x="140" y="857">sampling needs and</tspan><tspan x="140" y="877">treatment limits.</tspan></text></g>
<g data-node="response" data-padding="8"><rect class="node-dark" x="32" y="946" width="216" height="129" rx="6"/><text class="label on-dark" x="140" y="974" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="974">Public response</tspan></text><text class="small on-dark" x="140" y="999" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="999">Sampling; communication</tspan><tspan x="140" y="1019">with customers for trust;</tspan><tspan x="140" y="1039">source protection;</tspan><tspan x="140" y="1059">capital choices.</tspan></text></g>
<text class="small" x="140" y="1116" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="1116">Possible paths, not a diagnosis.</tspan><tspan x="140" y="1136">Not every bloom makes toxins.</tspan><tspan x="140" y="1156">Not every fish kill is a bloom.</tspan></text>
</svg>