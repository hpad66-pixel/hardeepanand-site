<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 1130" role="img" aria-labelledby="nature-mobile-ai-test-title nature-mobile-ai-test-desc"><style>.node { fill: #d1d8e7; stroke: #d4d9d7; stroke-width: 1.5; }
.node-strong { fill: #e1e8f7; stroke: #174bc5; stroke-width: 2; }
.node-dark { fill: #06283d; }
.node-warm { fill: #fff4d6; stroke: #d7b453; stroke-width: 1.5; }
.node-risk { fill: #f7ded7; stroke: #c75a42; stroke-width: 1.5; }
.label { fill: #092b3e; font: 700 18px 'Inter', Arial, sans-serif; }
.small { fill: #52616a; font: 500 13px 'Inter', Arial, sans-serif; }
.tiny { fill: #52616a; font: 500 12px 'Inter', Arial, sans-serif; }
.on-dark { fill: #f5f3ed; }
.connector { fill: none; stroke: #174bc5; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
.connector-soft { fill: none; stroke: #d4d9d7; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-soft); }
.connector-risk { fill: none; stroke: #c75a42; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-risk); }
.water-band { fill: none; stroke: #91d0ea; stroke-width: 18; stroke-linecap: round; opacity: .38; }
.ring { fill: none; stroke: #174bc5; stroke-width: 2; stroke-dasharray: 7 7; opacity: .7; }</style><defs>
              <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#174bc5"/></marker>
              <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d4d9d7"/></marker>
              <marker id="arrow-risk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c75a42"/></marker>
            </defs>
<title id="nature-mobile-ai-test-title">Two ways to answer a utility question</title>
<desc id="nature-mobile-ai-test-desc">The utility question branches into two alternatives, not successive stages: a fluent summary and a connected answer. A summary may help but can sound complete too early. A connected answer must independently expose sources, relationships, testable consequences and human authority. The four checks share a branching connector; they are not a causal chain. Validate records, separate evidence from assumption, preserve operator judgment and identify who owns the next action. This is an evaluation framework, not a measured product comparison.</desc>
<defs><marker id="nature-mobile-ai-test-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#174bc5"/></marker><marker id="nature-mobile-ai-test-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#c75a42"/></marker></defs>
<path class="connector-risk" d="M110 125 V164" style="marker-end:url(#nature-mobile-ai-test-risk)"><title>One possible response is a fluent summary</title></path>
<path class="connector" d="M248 64 H264 V428 H248" style="marker-end:url(#nature-mobile-ai-test-arrow)"><title>An alternative is a connected answer</title></path>
<path class="connector" d="M32 428 H16 V577 H32" style="marker-end:url(#nature-mobile-ai-test-arrow)"><title>Connected answer must expose its source records</title></path>
<path class="connector" d="M16 577 V699 H32" style="marker-end:url(#nature-mobile-ai-test-arrow)"><title>Connected answer must preserve relationships</title></path>
<path class="connector" d="M16 699 V821 H32" style="marker-end:url(#nature-mobile-ai-test-arrow)"><title>Connected answer must test consequences</title></path>
<path class="connector" d="M16 821 V963 H32" style="marker-end:url(#nature-mobile-ai-test-arrow)"><title>Connected answer must retain human decision authority</title></path>
<g data-node="question" data-padding="8"><rect class="node-dark" x="32" y="16" width="216" height="109" rx="6"/><text class="label on-dark" x="140" y="44" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="44">Utility question</tspan></text><text class="small on-dark" x="140" y="69" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="69">What is happening?</tspan><tspan x="140" y="89">What should we</tspan><tspan x="140" y="109">check next?</tspan></text></g>
<g data-node="fluent" data-padding="8"><rect class="node-risk" x="32" y="164" width="216" height="169" rx="6"/><text class="label" x="140" y="192" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="192">Fluent answer</tspan></text><text class="small" x="140" y="217" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="217">Clean summary of</tspan><tspan x="140" y="237">visible records.</tspan><tspan x="140" y="257">Risk: sounds complete</tspan><tspan x="140" y="277">too early. A paragraph</tspan><tspan x="140" y="297">can help; it does not</tspan><tspan x="140" y="317">establish the reasoning.</tspan></text></g>
<g data-node="connected" data-padding="8"><rect class="node-strong" x="32" y="374" width="216" height="109" rx="6"/><text class="label" x="140" y="402" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="402">Connected answer</tspan></text><text class="small" x="140" y="427" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="427">Source, context,</tspan><tspan x="140" y="447">consequence and human</tspan><tspan x="140" y="467">decision authority.</tspan></text></g>
<g data-node="sources" data-padding="8"><rect class="node" x="32" y="532" width="216" height="89" rx="6"/><text class="label" x="140" y="560" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="560">Sources</tspan></text><text class="small" x="140" y="585" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="585">Show the records used.</tspan><tspan x="140" y="605">Validate those records.</tspan></text></g>
<g data-node="relationships" data-padding="8"><rect class="node" x="32" y="654" width="216" height="109" rx="6"/><text class="label" x="140" y="682" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="682">Relationships</tspan></text><text class="small" x="140" y="707" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="707">Connect assets and events;</tspan><tspan x="140" y="727">separate evidence</tspan><tspan x="140" y="747">from assumption.</tspan></text></g>
<g data-node="consequences" data-padding="8"><rect class="node" x="32" y="776" width="216" height="109" rx="6"/><text class="label" x="140" y="804" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="804">Consequences</tspan></text><text class="small" x="140" y="829" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="829">What else should follow?</tspan><tspan x="140" y="849">What evidence supports</tspan><tspan x="140" y="869">or weakens the answer?</tspan></text></g>
<g data-node="authority" data-padding="8"><rect class="node" x="32" y="918" width="216" height="109" rx="6"/><text class="label" x="140" y="946" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="946">Authority</tspan></text><text class="small" x="140" y="971" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="971">Preserve operator judgment.</tspan><tspan x="140" y="991">Name the next action owner.</tspan><tspan x="140" y="1011">People retain the decision.</tspan></text></g>
<text class="small" x="140" y="1070" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="1070">Check the answer before acting.</tspan><tspan x="140" y="1090">An evaluation framework,</tspan><tspan x="140" y="1110">not a product comparison.</tspan></text>
</svg>