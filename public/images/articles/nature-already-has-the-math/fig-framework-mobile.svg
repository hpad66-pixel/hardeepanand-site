<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 1190" role="img" aria-labelledby="nature-mobile-framework-title nature-mobile-framework-desc"><style>.node { fill: #d1d8e7; stroke: #d4d9d7; stroke-width: 1.5; }
.node-strong { fill: #e1e8f7; stroke: #174bc5; stroke-width: 2; }
.node-dark { fill: #06283d; }
.node-warm { fill: #fff4d6; stroke: #d7b453; stroke-width: 1.5; }
.node-risk { fill: #f7ded7; stroke: #c75a42; stroke-width: 1.5; }
.label { fill: #092b3e; font: 700 18px 'Inter', Arial, sans-serif; }
.small { fill: #52616a; font: 500 13px 'Inter', Arial, sans-serif; }
.tiny { fill: #52616a; font: 500 12px 'Inter', Arial, sans-serif; }
.on-dark { fill: #f5f3ed; }
.connector { fill: none; stroke: #174bc5; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
.connector-soft { fill: none; stroke: #d4d9d7; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-soft); }
.connector-risk { fill: none; stroke: #c75a42; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-risk); }
.water-band { fill: none; stroke: #91d0ea; stroke-width: 18; stroke-linecap: round; opacity: .38; }
.ring { fill: none; stroke: #174bc5; stroke-width: 2; stroke-dasharray: 7 7; opacity: .7; }</style><defs>
              <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#174bc5"/></marker>
              <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d4d9d7"/></marker>
              <marker id="arrow-risk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c75a42"/></marker>
            </defs>
<title id="nature-mobile-framework-title">Connected reasoning with two feedback loops</title>
<desc id="nature-mobile-framework-desc">Nature moves, physics translates, assets intervene, people interpret, records connect and AI must preserve sources, context and consequences. People make accountable decisions that bear on public trust. Two separate feedback loops remain visible: human interventions return from decisions to nature on the left, and community feedback returns from public trust to people on the right. This conceptual framework shows responsibilities, not automatic causation or guaranteed trust.</desc>
<defs><marker id="nature-mobile-framework-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#174bc5"/></marker><marker id="nature-mobile-framework-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#c75a42"/></marker></defs>
<path class="connector" d="M140 85 V126" style="marker-end:url(#nature-mobile-framework-arrow)"><title>Natural movement has physical relationships</title></path>
<path class="connector" d="M140 195 V236" style="marker-end:url(#nature-mobile-framework-arrow)"><title>Physics informs infrastructure intervention</title></path>
<path class="connector" d="M140 305 V346" style="marker-end:url(#nature-mobile-framework-arrow)"><title>People interpret asset operation</title></path>
<path class="connector" d="M140 435 V476" style="marker-end:url(#nature-mobile-framework-arrow)"><title>People connect observations through records</title></path>
<path class="connector" d="M140 565 V606" style="marker-end:url(#nature-mobile-framework-arrow)"><title>Records provide sources and context for AI</title></path>
<path class="connector" d="M140 715 V756" style="marker-end:url(#nature-mobile-framework-arrow)"><title>Inspectable evidence supports human decisions</title></path>
<path class="connector" d="M140 908 V950" style="marker-end:url(#nature-mobile-framework-arrow)"><title>Accountable public service decisions bear on trust</title></path>
<path class="connector" d="M32 839 H10 V50 H32" style="marker-end:url(#nature-mobile-framework-arrow)"><title>Human interventions return from accountable decisions to nature</title></path>
<path class="connector" d="M248 1024 H270 V390 H248" style="marker-end:url(#nature-mobile-framework-arrow)"><title>Community feedback returns from public trust to the people interpreting the system</title></path>
<g data-node="nature" data-padding="8"><rect class="node" x="32" y="16" width="216" height="69" rx="6"/><text class="label" x="140" y="44" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="44">Nature moves</tspan></text><text class="small" x="140" y="69" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="69">Rain, groundwater, rivers</tspan></text></g>
<g data-node="physics" data-padding="8"><rect class="node" x="32" y="126" width="216" height="69" rx="6"/><text class="label" x="140" y="154" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="154">Physics translates</tspan></text><text class="small" x="140" y="179" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="179">Flow, pressure, decay</tspan></text></g>
<g data-node="assets" data-padding="8"><rect class="node" x="32" y="236" width="216" height="69" rx="6"/><text class="label" x="140" y="264" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="264">Assets intervene</tspan></text><text class="small" x="140" y="289" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="289">Pipes, pumps, plants</tspan></text></g>
<g data-node="people" data-padding="8"><rect class="node" x="32" y="346" width="216" height="89" rx="6"/><text class="label" x="140" y="374" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="374">People interpret</tspan></text><text class="small" x="140" y="399" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="399">Operators, crews, engineers;</tspan><tspan x="140" y="419">community feedback.</tspan></text></g>
<g data-node="records" data-padding="8"><rect class="node" x="32" y="476" width="216" height="89" rx="6"/><text class="label" x="140" y="504" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="504">Records connect</tspan></text><text class="small" x="140" y="529" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="529">SCADA, GIS, CMMS,</tspan><tspan x="140" y="549">lab records</tspan></text></g>
<g data-node="ai" data-padding="8"><rect class="node-strong" x="32" y="606" width="216" height="109" rx="6"/><text class="label" x="140" y="634" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="634">AI must preserve</tspan></text><text class="small" x="140" y="659" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="659">Sources, context,</tspan><tspan x="140" y="679">consequences and evidence</tspan><tspan x="140" y="699">people can inspect.</tspan></text></g>
<g data-node="decisions" data-padding="8"><rect class="node-dark" x="32" y="756" width="216" height="152" rx="6"/><text class="label on-dark" x="140" y="784" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="784">Accountable</tspan><tspan x="140" y="807">decisions</tspan></text><text class="small on-dark" x="140" y="832" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="832">People repair, renew,</tspan><tspan x="140" y="852">respond and explain.</tspan><tspan x="140" y="872">Human interventions</tspan><tspan x="140" y="892">return to nature.</tspan></text></g>
<g data-node="trust" data-padding="8"><rect class="node-warm" x="32" y="950" width="216" height="109" rx="6"/><text class="label" x="140" y="978" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="978">Public trust</tspan></text><text class="small" x="140" y="1003" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="1003">Service, permits, rates,</tspan><tspan x="140" y="1023">confidence; community</tspan><tspan x="140" y="1043">feedback returns to people.</tspan></text></g>
<text class="small" x="140" y="1100" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="1100">Connected reasoning needs</tspan><tspan x="140" y="1120">evidence people can check.</tspan><tspan x="140" y="1140">Conceptual responsibilities;</tspan><tspan x="140" y="1160">trust is not guaranteed.</tspan></text>
</svg>