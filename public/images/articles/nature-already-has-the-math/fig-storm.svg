<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" role="img" aria-labelledby="fig2-title fig2-desc"><style>.node { fill: #d1d8e7; stroke: #d4d9d7; stroke-width: 1.5; }
.node-strong { fill: #e1e8f7; stroke: #174bc5; stroke-width: 2; }
.node-dark { fill: #06283d; }
.node-warm { fill: #fff4d6; stroke: #d7b453; stroke-width: 1.5; }
.node-risk { fill: #f7ded7; stroke: #c75a42; stroke-width: 1.5; }
.label { fill: #092b3e; font: 700 18px 'Inter', Arial, sans-serif; }
.small { fill: #52616a; font: 500 13px 'Inter', Arial, sans-serif; }
.tiny { fill: #52616a; font: 500 12px 'Inter', Arial, sans-serif; }
.on-dark { fill: #f5f3ed; }
.connector { fill: none; stroke: #174bc5; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
.connector-soft { fill: none; stroke: #d4d9d7; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-soft); }
.connector-risk { fill: none; stroke: #c75a42; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-risk); }
.water-band { fill: none; stroke: #91d0ea; stroke-width: 18; stroke-linecap: round; opacity: .38; }
.ring { fill: none; stroke: #174bc5; stroke-width: 2; stroke-dasharray: 7 7; opacity: .7; }</style><defs>
              <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#174bc5"/></marker>
              <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d4d9d7"/></marker>
              <marker id="arrow-risk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c75a42"/></marker>
            </defs>
            <title id="fig2-title">Storm consequence chain</title>
            <desc id="fig2-desc">A diagram showing a heavy storm moving through groundwater, runoff, sewer pipes, pump stations, treatment load, permit risk, public trust, operating cost, and capital planning.</desc>
            <defs>
              <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#174bc5"/></marker>
            </defs>
            <rect class="node-dark" x="360" y="32" width="220" height="76" rx="6" />
            <text class="label on-dark" x="470" y="64" text-anchor="middle">Heavy storm</text>
            <text class="small on-dark" x="470" y="86" text-anchor="middle">the visible event</text>

            <rect class="node" x="96" y="160" width="190" height="78" rx="6" />
            <text class="label" x="191" y="190" text-anchor="middle">Wet ground</text>
            <text class="small" x="191" y="212" text-anchor="middle">high groundwater</text>

            <rect class="node" x="654" y="160" width="190" height="78" rx="6" />
            <text class="label" x="749" y="190" text-anchor="middle">Street runoff</text>
            <text class="small" x="749" y="212" text-anchor="middle">flooding and inflow</text>

            <rect class="node-strong" x="98" y="292" width="190" height="78" rx="6" />
            <text class="label" x="193" y="322" text-anchor="middle">Sewer pipes</text>
            <text class="small" x="193" y="344" text-anchor="middle">inflow and infiltration</text>

            <rect class="node-strong" x="376" y="292" width="190" height="78" rx="6" />
            <text class="label" x="471" y="322" text-anchor="middle">Pump stations</text>
            <text class="small" x="471" y="344" text-anchor="middle">longer run time, wear</text>

            <rect class="node-strong" x="654" y="292" width="190" height="78" rx="6" />
            <text class="label" x="749" y="322" text-anchor="middle">Treatment plant</text>
            <text class="small" x="749" y="344" text-anchor="middle">hydraulic loading</text>

            <rect class="node-risk" x="140" y="430" width="178" height="78" rx="6" />
            <text class="label" x="229" y="460" text-anchor="middle">Permit risk</text>
            <text class="small" x="229" y="482" text-anchor="middle">overflow, notice, limits</text>

            <rect class="node-warm" x="382" y="430" width="178" height="78" rx="6" />
            <text class="label" x="471" y="460" text-anchor="middle">Cost evidence</text>
            <text class="small" x="471" y="482" text-anchor="middle">overtime and repairs</text>
            <text class="small" x="471" y="498" text-anchor="middle">renewal evidence</text>

            <rect class="node-risk" x="624" y="430" width="178" height="78" rx="6" />
            <text class="label" x="713" y="460" text-anchor="middle">Public trust</text>
            <text class="small" x="713" y="482" text-anchor="middle">flooding and calls</text>
            <text class="small" x="713" y="498" text-anchor="middle">confidence in service</text>

            <path class="connector" style="marker-end:url(#arrow2)" d="M421 108 C340 128 265 142 207 160" />
            <path class="connector" style="marker-end:url(#arrow2)" d="M519 108 C594 128 676 142 737 160" />
            <path class="connector" style="marker-end:url(#arrow2)" d="M191 238 C191 258 192 276 193 292" />
            <path class="connector" style="marker-end:url(#arrow2)" d="M286 331 L376 331" />
            <path class="connector" style="marker-end:url(#arrow2)" d="M566 331 L654 331" />
            <path class="connector" style="marker-end:url(#arrow2)" d="M800 370 C895 395 858 527 700 527 L229 527 L229 508" />
            <path class="connector" style="marker-end:url(#arrow2)" d="M471 370 L471 430" />
            <path class="connector" style="marker-end:url(#arrow2)" d="M844 199 C919 235 908 379 802 448" />
            <path class="connector" style="marker-end:url(#arrow2)" d="M654 224 L600 260 L54 260 L54 325 L98 325" />
            <text class="small" x="466" y="283" text-anchor="middle">where combined sewers or inflow defects admit runoff</text>
          </svg>