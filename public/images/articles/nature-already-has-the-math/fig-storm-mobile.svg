<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 1200" role="img" aria-labelledby="nature-mobile-storm-title nature-mobile-storm-desc"><style>.node { fill: #d1d8e7; stroke: #d4d9d7; stroke-width: 1.5; }
.node-strong { fill: #e1e8f7; stroke: #174bc5; stroke-width: 2; }
.node-dark { fill: #06283d; }
.node-warm { fill: #fff4d6; stroke: #d7b453; stroke-width: 1.5; }
.node-risk { fill: #f7ded7; stroke: #c75a42; stroke-width: 1.5; }
.label { fill: #092b3e; font: 700 18px 'Inter', Arial, sans-serif; }
.small { fill: #52616a; font: 500 13px 'Inter', Arial, sans-serif; }
.tiny { fill: #52616a; font: 500 12px 'Inter', Arial, sans-serif; }
.on-dark { fill: #f5f3ed; }
.connector { fill: none; stroke: #174bc5; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
.connector-soft { fill: none; stroke: #d4d9d7; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-soft); }
.connector-risk { fill: none; stroke: #c75a42; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-risk); }
.water-band { fill: none; stroke: #91d0ea; stroke-width: 18; stroke-linecap: round; opacity: .38; }
.ring { fill: none; stroke: #174bc5; stroke-width: 2; stroke-dasharray: 7 7; opacity: .7; }</style><defs>
              <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#174bc5"/></marker>
              <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d4d9d7"/></marker>
              <marker id="arrow-risk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c75a42"/></marker>
            </defs>
<title id="nature-mobile-storm-title">One storm, branching utility consequences</title>
<desc id="nature-mobile-storm-desc">A heavy storm produces wet ground and street runoff in parallel. Groundwater can infiltrate defective sewer pipes. Runoff enters combined sewers or sanitary sewers only through inflow defects; separate storm drains do not normally flow to the wastewater plant. Sewer flow reaches pumps and treatment. Pump operation creates cost evidence, treatment loading creates possible permit risk, and street flooding affects public trust independently of the wastewater path.</desc>
<defs><marker id="nature-mobile-storm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#174bc5"/></marker><marker id="nature-mobile-storm-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#c75a42"/></marker></defs>
<path class="connector" d="M110 85 V114 H70 V144" style="marker-end:url(#nature-mobile-storm-arrow)"><title>Rain can raise groundwater</title></path>
<path class="connector" d="M170 85 V114 H210 V144" style="marker-end:url(#nature-mobile-storm-arrow)"><title>Rain generates street runoff</title></path>
<path class="connector" d="M70 357 V382 H110 V412" style="marker-end:url(#nature-mobile-storm-arrow)"><title>Groundwater enters sewer pipes through infiltration defects</title></path>
<path class="connector" d="M210 357 V382 H170 V412" style="marker-end:url(#nature-mobile-storm-arrow)"><title>Runoff enters only where combined sewers or inflow defects admit it</title></path>
<path class="connector" d="M264 200 H276 V1148 H248" style="marker-end:url(#nature-mobile-storm-arrow)"><title>Street flooding can affect public trust, independently of plant loading</title></path>
<path class="connector" d="M140 501 V546" style="marker-end:url(#nature-mobile-storm-arrow)"><title>Added sewer flow reaches pump stations</title></path>
<path class="connector" d="M140 635 V690" style="marker-end:url(#nature-mobile-storm-arrow)"><title>Pumped flow adds hydraulic loading at the treatment plant</title></path>
<path class="connector" d="M32 590 H12 V1020 H32" style="marker-end:url(#nature-mobile-storm-arrow)"><title>Longer pump operation contributes operating and renewal cost evidence</title></path>
<path class="connector-risk" d="M140 799 V828" style="marker-end:url(#nature-mobile-storm-risk)"><title>Treatment loading can increase permit risk</title></path>
<g data-node="storm" data-padding="8"><rect class="node-dark" x="32" y="16" width="216" height="69" rx="6"/><text class="label on-dark" x="140" y="44" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="44">Heavy storm</tspan></text><text class="small on-dark" x="140" y="69" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="69">The visible event</tspan></text></g>
<g data-node="wet-ground" data-padding="8"><rect class="node" x="8" y="144" width="124" height="213" rx="6"/><text class="label" x="70" y="172" text-anchor="middle" style="font-size:16px;letter-spacing:0"><tspan x="70" y="172">Wet</tspan><tspan x="70" y="195">ground</tspan></text><text class="small" x="70" y="220" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="70" y="220">Groundwater</tspan><tspan x="70" y="240">rises.</tspan><tspan x="70" y="260">Infiltration</tspan><tspan x="70" y="280">through pipe</tspan><tspan x="70" y="300">defects adds</tspan><tspan x="70" y="320">sewer flow.</tspan></text></g>
<g data-node="runoff" data-padding="8"><rect class="node" x="148" y="144" width="116" height="213" rx="6"/><text class="label" x="206" y="172" text-anchor="middle" style="font-size:16px;letter-spacing:0"><tspan x="206" y="172">Street</tspan><tspan x="206" y="195">runoff</tspan></text><text class="small" x="206" y="220" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="206" y="220">Flooding;</tspan><tspan x="206" y="240">sewer entry</tspan><tspan x="206" y="260">only through</tspan><tspan x="206" y="280">combined</tspan><tspan x="206" y="300">sewers or</tspan><tspan x="206" y="320">inflow defects.</tspan></text></g>
<g data-node="sewer" data-padding="8"><rect class="node-strong" x="32" y="412" width="216" height="89" rx="6"/><text class="label" x="140" y="440" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="440">Sewer pipes</tspan></text><text class="small" x="140" y="465" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="465">Inflow and infiltration</tspan><tspan x="140" y="485">add to sewer flow.</tspan></text></g>
<g data-node="pump" data-padding="8"><rect class="node-strong" x="32" y="546" width="216" height="89" rx="6"/><text class="label" x="140" y="574" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="574">Pump stations</tspan></text><text class="small" x="140" y="599" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="599">Longer run time;</tspan><tspan x="140" y="619">more wear.</tspan></text></g>
<g data-node="plant" data-padding="8"><rect class="node-strong" x="32" y="690" width="216" height="109" rx="6"/><text class="label" x="140" y="718" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="718">Treatment plant</tspan></text><text class="small" x="140" y="743" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="743">Hydraulic loading;</tspan><tspan x="140" y="763">separate storm drains</tspan><tspan x="140" y="783">normally do not feed it.</tspan></text></g>
<g data-node="permit" data-padding="8"><rect class="node-risk" x="32" y="828" width="216" height="89" rx="6"/><text class="label" x="140" y="856" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="856">Permit risk</tspan></text><text class="small" x="140" y="881" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="881">Possible overflow,</tspan><tspan x="140" y="901">notice and limit issues.</tspan></text></g>
<g data-node="cost" data-padding="8"><rect class="node-warm" x="32" y="968" width="216" height="109" rx="6"/><text class="label" x="140" y="996" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="996">Cost evidence</tspan></text><text class="small" x="140" y="1021" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="1021">Overtime and repairs;</tspan><tspan x="140" y="1041">renewals and capital</tspan><tspan x="140" y="1061">planning.</tspan></text></g>
<g data-node="trust" data-padding="8"><rect class="node-risk" x="32" y="1100" width="216" height="89" rx="6"/><text class="label" x="140" y="1128" text-anchor="middle" style="font-size:18px;letter-spacing:0"><tspan x="140" y="1128">Public trust</tspan></text><text class="small" x="140" y="1153" text-anchor="middle" style="font-size:14px;letter-spacing:0"><tspan x="140" y="1153">Flooding, customer calls,</tspan><tspan x="140" y="1173">confidence in service.</tspan></text></g>
</svg>