<svg xmlns="http://www.w3.org/2000/svg" width="380" height="666" viewBox="0 0 380 666" role="img" aria-labelledby="title desc"><title id="title">The Curve Test</title><desc id="desc">Four steps: name the vital sign, draw the baseline, watch for the bend, and feed the answer forward into the next capital decision.</desc><defs><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#B5821A" stroke-width="1.5"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2C6C8C" stroke-width="1.5"/></marker><marker id="dead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#A3AEB3" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#EDF0F1"/><line x1="34" y1="60" x2="34" y2="574" stroke="#B5821A" stroke-width="2" /><circle cx="34" cy="51" r="20" fill="#EDF0F1" stroke="#B5821A" stroke-width="1.5"/><text x="34" y="56" font-size="14" fill="#B5821A" text-anchor="middle" font-family="Arial, sans-serif">01</text><text x="68" y="45" font-size="22" fill="#15303C" text-anchor="start" font-family="Georgia, serif">Name the vital sign</text><text x="68" y="78" font-size="20" fill="#4A6069" text-anchor="start" font-family="Arial, sans-serif">Which KPI should</text><text x="68" y="105" font-size="20" fill="#4A6069" text-anchor="start" font-family="Arial, sans-serif">the money change?</text><circle cx="34" cy="194" r="20" fill="#EDF0F1" stroke="#B5821A" stroke-width="1.5"/><text x="34" y="199" font-size="14" fill="#B5821A" text-anchor="middle" font-family="Arial, sans-serif">02</text><text x="68" y="188" font-size="22" fill="#15303C" text-anchor="start" font-family="Georgia, serif">Draw the baseline</text><text x="68" y="221" font-size="20" fill="#4A6069" text-anchor="start" font-family="Arial, sans-serif">Read the trend</text><text x="68" y="248" font-size="20" fill="#4A6069" text-anchor="start" font-family="Arial, sans-serif">before the work.</text><circle cx="34" cy="337" r="20" fill="#EDF0F1" stroke="#B5821A" stroke-width="1.5"/><text x="34" y="342" font-size="14" fill="#B5821A" text-anchor="middle" font-family="Arial, sans-serif">03</text><text x="68" y="331" font-size="22" fill="#15303C" text-anchor="start" font-family="Georgia, serif">Watch for the bend</text><text x="68" y="364" font-size="20" fill="#4A6069" text-anchor="start" font-family="Arial, sans-serif">Compare before</text><text x="68" y="391" font-size="20" fill="#4A6069" text-anchor="start" font-family="Arial, sans-serif">and after the work.</text><circle cx="34" cy="480" r="20" fill="#EDF0F1" stroke="#B5821A" stroke-width="1.5"/><text x="34" y="485" font-size="14" fill="#B5821A" text-anchor="middle" font-family="Arial, sans-serif">04</text><text x="68" y="474" font-size="22" fill="#15303C" text-anchor="start" font-family="Georgia, serif">Feed the answer forward</text><text x="68" y="507" font-size="20" fill="#4A6069" text-anchor="start" font-family="Arial, sans-serif">Use the result</text><text x="68" y="534" font-size="20" fill="#4A6069" text-anchor="start" font-family="Arial, sans-serif">in the next decision.</text><path d="M34 582 L34 614 L353 614 L353 51 L321 51" fill="none" stroke="#B5821A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" marker-end="url(#gold)"/><text x="190" y="650" fill="#4A6069" font-size="13" letter-spacing="1.4" text-anchor="middle" font-family="monospace">REPEAT WITH THE NEXT DECISION</text></svg>