<svg xmlns="http://www.w3.org/2000/svg" width="380" height="506" viewBox="0 0 380 506" role="img" aria-labelledby="title desc"><title id="title">A measurement becomes a steering system</title><desc id="desc">Sense, compare, act, and measure again form a continuous gold feedback loop.</desc><defs><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#B5821A" stroke-width="1.5"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2C6C8C" stroke-width="1.5"/></marker><marker id="dead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#A3AEB3" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#EDF0F1"/><circle cx="190" cy="245" r="108" fill="none" stroke="#B5821A" stroke-width="2"/><path d="M227 143 Q257 152 274 174" fill="none" stroke="#B5821A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold)"/><path d="M153 347 Q123 338 106 316" fill="none" stroke="#B5821A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold)"/><text x="190" y="234" font-size="27" fill="#15303C" text-anchor="middle" font-family="Georgia, serif">Steer by</text><text x="190" y="267" font-size="27" fill="#15303C" text-anchor="middle" font-family="Georgia, serif">the response.</text><rect x="111" y="110" width="158" height="61" fill="#F6F8F8" stroke="#C6D0D3"/><text x="190" y="134" font-size="18" fill="#15303C" text-anchor="middle" font-family="Arial, sans-serif">COMPARE</text><text x="190" y="157" font-size="13" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">Actual vs. intended</text><rect x="111" y="326" width="158" height="61" fill="#F6F8F8" stroke="#C6D0D3"/><text x="190" y="350" font-size="18" fill="#15303C" text-anchor="middle" font-family="Arial, sans-serif">MEASURE AGAIN</text><text x="190" y="373" font-size="13" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">Did it improve?</text><rect x="9" y="222" width="100" height="48" fill="#F6F8F8" stroke="#C6D0D3"/><text x="59" y="251" font-size="16" fill="#2C6C8C" text-anchor="middle" font-family="Arial, sans-serif">SENSE</text><rect x="271" y="222" width="100" height="48" fill="#F6F8F8" stroke="#C6D0D3"/><text x="321" y="251" font-size="16" fill="#B5821A" text-anchor="middle" font-family="Arial, sans-serif">ACT</text><text x="190" y="39" fill="#4A6069" font-size="13" letter-spacing="1.4" text-anchor="middle" font-family="monospace">THE INSTRUMENT IS ONLY THE START</text><text x="190" y="69" font-size="18" fill="#4A6069" text-anchor="middle" font-family="Georgia, serif">A measurement needs a path to action.</text><line x1="52" y1="434" x2="328" y2="434" stroke="#C6D0D3" stroke-width="1" /><text x="190" y="464" font-size="17" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">The next reading closes the loop.</text></svg>