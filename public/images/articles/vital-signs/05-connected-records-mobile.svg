<svg xmlns="http://www.w3.org/2000/svg" width="380" height="710" viewBox="0 0 380 710" role="img" aria-labelledby="title desc"><title id="title">From existing records to a usable baseline</title><desc id="desc">SCADA, rainfall, billing and production records are aligned and checked to create a comparable baseline. The curve is illustrative.</desc><defs><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#B5821A" stroke-width="1.5"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2C6C8C" stroke-width="1.5"/></marker><marker id="dead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#A3AEB3" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#EDF0F1"/><rect x="22" y="20" width="336" height="67" fill="#F6F8F8" stroke="#C6D0D3"/><text x="39" y="44" fill="#4A6069" font-size="13" letter-spacing="1.4" text-anchor="start" font-family="monospace">SCADA HISTORY</text><text x="39" y="69" font-size="18" fill="#2C6C8C" text-anchor="start" font-family="Arial, sans-serif">Plant flow + time</text><rect x="22" y="101" width="336" height="67" fill="#F6F8F8" stroke="#C6D0D3"/><text x="39" y="125" fill="#4A6069" font-size="13" letter-spacing="1.4" text-anchor="start" font-family="monospace">RAINFALL RECORDS</text><text x="39" y="150" font-size="18" fill="#2C6C8C" text-anchor="start" font-family="Arial, sans-serif">Storm timing + intensity</text><rect x="22" y="182" width="336" height="67" fill="#F6F8F8" stroke="#C6D0D3"/><text x="39" y="206" fill="#4A6069" font-size="13" letter-spacing="1.4" text-anchor="start" font-family="monospace">BILLING + PRODUCTION</text><text x="39" y="231" font-size="18" fill="#2C6C8C" text-anchor="start" font-family="Arial, sans-serif">Water in + water billed</text><line x1="190" y1="253" x2="190" y2="293" stroke="#2C6C8C" stroke-width="2" marker-end="url(#blue)"/><rect x="22" y="305" width="336" height="115" fill="#F6F8F8" stroke="#C6D0D3"/><text x="190" y="332" fill="#B5821A" font-size="13" letter-spacing="1.4" text-anchor="middle" font-family="monospace">CONNECT &amp; CHECK</text><text x="190" y="359" font-size="17" fill="#15303C" text-anchor="middle" font-family="Arial, sans-serif">Align dates, units and boundaries.</text><text x="190" y="386" font-size="17" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">Mark gaps. Compare like conditions.</text><line x1="190" y1="429" x2="190" y2="465" stroke="#B5821A" stroke-width="2" marker-end="url(#gold)"/><rect x="22" y="478" width="336" height="157" fill="#F6F8F8" stroke="#C6D0D3"/><text x="43" y="507" fill="#4A6069" font-size="13" letter-spacing="1.4" text-anchor="start" font-family="monospace">A BASELINE YOU CAN USE</text><line x1="46" y1="591" x2="331" y2="591" stroke="#C6D0D3" stroke-width="1" /><path d="M46 576 C77 568 77 580 101 562 S136 570 159 552 S182 561 204 543 S243 553 269 532 S310 539 331 521" fill="none" stroke="#2C6C8C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text x="190" y="663" font-size="19" fill="#15303C" text-anchor="middle" font-family="Georgia, serif">Start with the records you already own.</text><text x="190" y="689" font-size="16" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">Sharper instrumentation can come later.</text></svg>