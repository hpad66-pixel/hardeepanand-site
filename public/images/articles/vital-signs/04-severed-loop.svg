<svg xmlns="http://www.w3.org/2000/svg" width="820" height="358" viewBox="0 0 820 358" role="img" aria-labelledby="title desc"><title id="title">The severed loop</title><desc id="desc">A worsening trend reaches a report, but a broken connection prevents a response. The capital plan stays unchanged.</desc><defs><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#B5821A" stroke-width="1.5"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2C6C8C" stroke-width="1.5"/></marker><marker id="dead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#A3AEB3" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#EDF0F1"/><g transform="translate(28 70)"><text x="0" y="0" fill="#4A6069" font-size="13" letter-spacing="1.4" text-anchor="start" font-family="monospace">THE WARNING</text><line x1="0" y1="106" x2="213" y2="106" stroke="#C6D0D3" stroke-width="1" /><path d="M0 92 C42.6 95 57.510000000000005 66 85.2 72 S149.1 33 213 16" fill="none" stroke="#2C6C8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="0" y="139" font-size="16" fill="#4A6069" text-anchor="start" font-family="Arial, sans-serif">A worsening trend is visible.</text></g><line x1="256" y1="143" x2="310" y2="143" stroke="#2C6C8C" stroke-width="2" marker-end="url(#blue)"/><rect x="325" y="106" width="184" height="76" fill="#F6F8F8" stroke="#C6D0D3"/><text x="417" y="135" font-size="17" fill="#2C6C8C" text-anchor="middle" font-family="Arial, sans-serif">REPORTED</text><text x="417" y="161" font-size="15" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">Signal received</text><line x1="509" y1="143" x2="547" y2="143" stroke="#B5821A" stroke-width="2" /><line x1="585" y1="143" x2="619" y2="143" stroke="#A3AEB3" stroke-width="2" stroke-dasharray="4 4"/><line x1="552" y1="133" x2="563" y2="150" stroke="#B5821A" stroke-width="2" /><line x1="565" y1="133" x2="576" y2="150" stroke="#B5821A" stroke-width="2" /><text x="565" y="92" font-size="13" fill="#B5821A" text-anchor="middle" font-family="Arial, sans-serif">NO RESPONSE</text><rect x="630" y="106" width="166" height="76" fill="#EDF0F1" stroke="#A3AEB3"/><text x="713" y="135" font-size="17" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">UNCHANGED</text><text x="713" y="161" font-size="15" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">The capital plan</text><path d="M711 196 L711 274 L134 274 L134 248" fill="none" stroke="#A3AEB3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/><rect x="270" y="258" width="300" height="32" fill="#EDF0F1" stroke="#EDF0F1"/><text x="420" y="280" font-size="15" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">The result never informs the next decision.</text><text x="410" y="336" font-size="21" fill="#15303C" text-anchor="middle" font-family="Georgia, serif">An open loop can contain excellent data and still fail to steer.</text></svg>