<svg xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390" role="img" aria-labelledby="title desc"><title id="title">A measurement becomes a steering system</title><desc id="desc">Sense, compare, act, and measure again form a continuous gold feedback loop.</desc><defs><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#B5821A" stroke-width="1.5"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2C6C8C" stroke-width="1.5"/></marker><marker id="dead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#A3AEB3" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#EDF0F1"/><circle cx="410" cy="190" r="120" fill="none" stroke="#B5821A" stroke-width="2"/><path d="M447 76 Q477 85 494 107" fill="none" stroke="#B5821A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold)"/><path d="M373 304 Q343 295 326 273" fill="none" stroke="#B5821A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold)"/><text x="410" y="179" font-size="27" fill="#15303C" text-anchor="middle" font-family="Georgia, serif">Steer by</text><text x="410" y="212" font-size="27" fill="#15303C" text-anchor="middle" font-family="Georgia, serif">the response.</text><rect x="331" y="43" width="158" height="61" fill="#F6F8F8" stroke="#C6D0D3"/><text x="410" y="67" font-size="18" fill="#15303C" text-anchor="middle" font-family="Arial, sans-serif">COMPARE</text><text x="410" y="90" font-size="13" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">Actual vs. intended</text><rect x="331" y="283" width="158" height="61" fill="#F6F8F8" stroke="#C6D0D3"/><text x="410" y="307" font-size="18" fill="#15303C" text-anchor="middle" font-family="Arial, sans-serif">MEASURE AGAIN</text><text x="410" y="330" font-size="13" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">Did it improve?</text><rect x="37" y="151" width="178" height="78" fill="#F6F8F8" stroke="#C6D0D3"/><text x="126" y="179" font-size="18" fill="#2C6C8C" text-anchor="middle" font-family="Arial, sans-serif">SENSE</text><text x="126" y="207" font-size="15" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">Read the vital sign</text><rect x="605" y="151" width="178" height="78" fill="#F6F8F8" stroke="#C6D0D3"/><text x="694" y="179" font-size="18" fill="#B5821A" text-anchor="middle" font-family="Arial, sans-serif">ACT</text><text x="694" y="207" font-size="15" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">Change the system</text><line x1="215" y1="190" x2="285" y2="190" stroke="#2C6C8C" stroke-width="2" marker-end="url(#blue)"/><line x1="535" y1="190" x2="605" y2="190" stroke="#B5821A" stroke-width="2" marker-end="url(#gold)"/><text x="126" y="125" fill="#4A6069" font-size="13" letter-spacing="1.4" text-anchor="middle" font-family="monospace">THE INSTRUMENT</text><text x="694" y="125" fill="#4A6069" font-size="13" letter-spacing="1.4" text-anchor="middle" font-family="monospace">THE INTERVENTION</text><text x="410" y="375" font-size="17" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">The value is in the connection between the reading and the response.</text></svg>