<svg xmlns="http://www.w3.org/2000/svg" width="380" height="676" viewBox="0 0 380 676" role="img" aria-labelledby="title desc"><title id="title">From a snapshot to a response</title><desc id="desc">A single crimson point contrasts with a continuous illustrative curve. An intervention is marked on the curve.</desc><defs><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#B5821A" stroke-width="1.5"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2C6C8C" stroke-width="1.5"/></marker><marker id="dead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#A3AEB3" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#EDF0F1"/><g transform="translate(12 0)"><text x="18" y="30" fill="#4A6069" font-size="13" letter-spacing="1.4" text-anchor="start" font-family="monospace">01 / THE SNAPSHOT</text><text x="18" y="67" font-size="23" fill="#15303C" text-anchor="start" font-family="Georgia, serif">A reading without a response.</text><line x1="24" y1="199" x2="332" y2="199" stroke="#C6D0D3" stroke-width="1" /><line x1="24" y1="100" x2="24" y2="199" stroke="#C6D0D3" stroke-width="1" /><circle cx="178" cy="143" r="6" fill="#9C2A32" stroke="#9C2A32" stroke-width="2"/><text x="178" y="126" font-size="13" fill="#9C2A32" text-anchor="middle" font-family="Arial, sans-serif">ONE READING</text><text x="178" y="225" font-size="14" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">Time →</text><text x="18" y="268" font-size="20" fill="#4A6069" text-anchor="start" font-family="Arial, sans-serif">Describe the condition.</text><text x="18" y="296" font-size="20" fill="#4A6069" text-anchor="start" font-family="Arial, sans-serif">What changed it? Unknown.</text></g><line x1="12" y1="330" x2="368" y2="330" stroke="#C6D0D3" stroke-width="1" /><g transform="translate(12 350)"><text x="18" y="30" fill="#4A6069" font-size="13" letter-spacing="1.4" text-anchor="start" font-family="monospace">02 / THE CURVE</text><text x="18" y="67" font-size="23" fill="#15303C" text-anchor="start" font-family="Georgia, serif">The system answers back.</text><line x1="24" y1="199" x2="332" y2="199" stroke="#C6D0D3" stroke-width="1" /><line x1="24" y1="100" x2="24" y2="199" stroke="#C6D0D3" stroke-width="1" /><line x1="24" y1="143" x2="332" y2="143" stroke="#C6D0D3" stroke-width="1" stroke-dasharray="3 5"/><path d="M24 163 C50 158 55 166 70 150" fill="none" stroke="#9C2A32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M70 150 C90 138 96 95 122 100 S154 164 183 171 S230 159 257 174 S301 177 332 177" fill="none" stroke="#9C2A32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="132" y1="91" x2="132" y2="203" stroke="#B5821A" stroke-width="1.5" stroke-dasharray="4 4"/><text x="146" y="96" font-size="14" fill="#B5821A" text-anchor="start" font-family="Arial, sans-serif">Intervention</text><text x="178" y="225" font-size="14" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">Time →</text><text x="18" y="268" font-size="20" fill="#4A6069" text-anchor="start" font-family="Arial, sans-serif">Read before and after.</text><text x="18" y="296" font-size="20" fill="#4A6069" text-anchor="start" font-family="Arial, sans-serif">What explains the change?</text></g></svg>