<svg xmlns="http://www.w3.org/2000/svg" width="820" height="303" viewBox="0 0 820 303" role="img" aria-labelledby="vs-04-wide-title vs-04-wide-desc" class="vital-graphic"><style>
  .vs-trace { stroke-dasharray:1; stroke-dashoffset:0; animation:vs-draw 4.6s ease both; }
  .vs-orbit { stroke-dasharray:5 95; opacity:0; animation:vs-orbit 4.8s linear both; }
  .vs-signal { stroke-dasharray:5 95; opacity:0; animation:vs-signal 4.6s ease both; }
  .vs-step { stroke-dasharray:1; stroke-dashoffset:0; animation:vs-step 4.8s ease both; }
  @keyframes vs-draw { 0%,8% {stroke-dashoffset:1} 72%,100% {stroke-dashoffset:0} }
  @keyframes vs-orbit {0%{opacity:0;stroke-dashoffset:25} 8%{opacity:1} 90%{opacity:1} 100%{opacity:0;stroke-dashoffset:-75} }
  @keyframes vs-signal {0%{opacity:0;stroke-dashoffset:5} 8%{opacity:1} 65%,88%{opacity:1;stroke-dashoffset:-95} 100%{opacity:0;stroke-dashoffset:-95} }
  @keyframes vs-step {0%{stroke-dashoffset:1;opacity:0} 15%,80%{stroke-dashoffset:0;opacity:1} 100%{stroke-dashoffset:0;opacity:0} }
  @media(prefers-reduced-motion:reduce){.vs-motion{animation:none!important}.vs-orbit,.vs-signal,.vs-step{display:none}}
</style><title id="vs-04-wide-title">The severed loop</title><desc id="vs-04-wide-desc">A worsening trend reaches a report, but a broken connection prevents a response. The capital plan stays unchanged.</desc><defs><marker id="vs-04-wide-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--figure-accent, #174bc5)" stroke-width="1.5"/></marker><marker id="vs-04-wide-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--accent, #124f6b)" stroke-width="1.5"/></marker><marker id="vs-04-wide-dead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--line, #d4d9d7)" stroke-width="1.5"/></marker></defs><g transform="translate(28 70)"><text x="0" y="0" fill="var(--text-dim, #52616a)" font-size="13" letter-spacing="1.2" text-anchor="start" style="font-family:var(--font-label, 'Inter', Arial, sans-serif)">THE WARNING</text><line x1="0" y1="106" x2="213" y2="106" stroke="var(--line, #d4d9d7)" stroke-width="1" /><path d="M0 92 C42.6 95 57.510000000000005 66 85.2 72 S149.1 33 213 16" fill="none" stroke="var(--accent, #124f6b)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="0" y="139" font-size="16" fill="var(--text-dim, #52616a)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">A worsening trend is visible.</text></g><line x1="256" y1="143" x2="310" y2="143" stroke="var(--accent, #124f6b)" stroke-width="2" marker-end="url(#vs-04-wide-blue)"/><rect x="325" y="106" width="184" height="76" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="417" y="135" font-size="17" fill="var(--accent, #124f6b)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">REPORTED</text><text x="417" y="161" font-size="15" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Signal received</text><line x1="509" y1="143" x2="547" y2="143" stroke="var(--figure-accent, #174bc5)" stroke-width="2" /><line x1="585" y1="143" x2="619" y2="143" stroke="var(--line, #d4d9d7)" stroke-width="2" stroke-dasharray="4 4"/><path d="M509 143 L547 143" fill="none" stroke="var(--text, #092b3e)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="100" class="vs-motion vs-signal"/><line x1="552" y1="133" x2="563" y2="150" stroke="var(--figure-accent, #174bc5)" stroke-width="2" /><line x1="565" y1="133" x2="576" y2="150" stroke="var(--figure-accent, #174bc5)" stroke-width="2" /><text x="565" y="92" font-size="13" fill="var(--figure-accent, #174bc5)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">NO RESPONSE</text><rect x="630" y="106" width="166" height="76" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="713" y="135" font-size="17" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">UNCHANGED</text><text x="713" y="161" font-size="15" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">The capital plan</text><path d="M711 196 L711 274 L134 274 L134 248" fill="none" stroke="var(--line, #d4d9d7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/><rect x="270" y="258" width="300" height="32" fill="var(--bg, #f5f3ed)" stroke="var(--bg, #f5f3ed)"/><text x="420" y="280" font-size="15" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">The result never informs the next decision.</text></svg>