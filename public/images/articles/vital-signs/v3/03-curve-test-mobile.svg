<svg xmlns="http://www.w3.org/2000/svg" width="380" height="630" viewBox="0 0 380 630" role="img" aria-labelledby="vs-03-mobile-title vs-03-mobile-desc" class="vital-graphic"><style>
  .vs-trace { stroke-dasharray:1; stroke-dashoffset:0; animation:vs-draw 4.6s ease both; }
  .vs-orbit { stroke-dasharray:5 95; opacity:0; animation:vs-orbit 4.8s linear both; }
