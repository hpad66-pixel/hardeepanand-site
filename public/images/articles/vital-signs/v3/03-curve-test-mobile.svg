  @keyframes vs-signal {0%{opacity:0;stroke-dashoffset:5} 8%{opacity:1} 65%,88%{opacity:1;stroke-dashoffset:-95} 100%{opacity:0;stroke-dashoffset:-95} }
  @keyframes vs-step {0%{stroke-dashoffset:1;opacity:0} 15%,80%{stroke-dashoffset:0;opacity:1} 100%{stroke-dashoffset:0;opacity:0} }
  @media(prefers-reduced-motion:reduce){.vs-motion{animation:none!important}.vs-orbit,.vs-signal,.vs-step{display:none}}
</style><title id="vs-03-mobile-title">The Curve Test</title><desc id="vs-03-mobile-desc">Four steps: name the vital sign, draw the baseline, watch for the bend, and feed the answer forward into the next capital decision.</desc><defs><marker id="vs-03-mobile-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--figure-accent, #174bc5)" stroke-width="1.5"/></marker><marker id="vs-03-mobile-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--accent, #124f6b)" stroke-width="1.5"/></marker><marker id="vs-03-mobile-dead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--line, #d4d9d7)" stroke-width="1.5"/></marker></defs><line x1="34" y1="60" x2="34" y2="574" stroke="var(--figure-accent, #174bc5)" stroke-width="2" /><circle cx="34" cy="51" r="20" fill="var(--bg, #f5f3ed)" stroke="var(--figure-accent, #174bc5)" stroke-width="1.5"/><text x="34" y="56" font-size="14" fill="var(--figure-accent, #174bc5)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">01</text><circle cx="34" cy="51" r="23" fill="none" stroke="var(--text, #092b3e)" stroke-width="2" pathLength="1" class="vs-motion vs-step" style="animation-delay:0s;animation-duration:4.8s"/><text x="68" y="45" font-size="22" fill="var(--text, #092b3e)" text-anchor="start" style="font-family:var(--font-display, 'Newsreader', Georgia, serif)">Name the vital sign</text><text x="68" y="78" font-size="20" fill="var(--text-dim, #52616a)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Which KPI should</text><text x="68" y="105" font-size="20" fill="var(--text-dim, #52616a)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">the money change?</text><circle cx="34" cy="194" r="20" fill="var(--bg, #f5f3ed)" stroke="var(--figure-accent, #174bc5)" stroke-width="1.5"/><text x="34" y="199" font-size="14" fill="var(--figure-accent, #174bc5)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">02</text><circle cx="34" cy="194" r="23" fill="none" stroke="var(--text, #092b3e)" stroke-width="2" pathLength="1" class="vs-motion vs-step" style="animation-delay:0.85s;animation-duration:3.9499999999999997s"/><text x="68" y="188" font-size="22" fill="var(--text, #092b3e)" text-anchor="start" style="font-family:var(--font-display, 'Newsreader', Georgia, serif)">Draw the baseline</text><text x="68" y="221" font-size="20" fill="var(--text-dim, #52616a)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Read the trend</text><text x="68" y="248" font-size="20" fill="var(--text-dim, #52616a)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">before the work.</text><circle cx="34" cy="337" r="20" fill="var(--bg, #f5f3ed)" stroke="var(--figure-accent, #174bc5)" stroke-width="1.5"/><text x="34" y="342" font-size="14" fill="var(--figure-accent, #174bc5)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">03</text><circle cx="34" cy="337" r="23" fill="none" stroke="var(--text, #092b3e)" stroke-width="2" pathLength="1" class="vs-motion vs-step" style="animation-delay:1.7s;animation-duration:3.0999999999999996s"/><text x="68" y="331" font-size="22" fill="var(--text, #092b3e)" text-anchor="start" style="font-family:var(--font-display, 'Newsreader', Georgia, serif)">Watch for the bend</text><text x="68" y="364" font-size="20" fill="var(--text-dim, #52616a)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Compare before</text><text x="68" y="391" font-size="20" fill="var(--text-dim, #52616a)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">and after the work.</text><circle cx="34" cy="480" r="20" fill="var(--bg, #f5f3ed)" stroke="var(--figure-accent, #174bc5)" stroke-width="1.5"/><text x="34" y="485" font-size="14" fill="var(--figure-accent, #174bc5)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">04</text><circle cx="34" cy="480" r="23" fill="none" stroke="var(--text, #092b3e)" stroke-width="2" pathLength="1" class="vs-motion vs-step" style="animation-delay:2.55s;animation-duration:2.25s"/><text x="68" y="474" font-size="22" fill="var(--text, #092b3e)" text-anchor="start" style="font-family:var(--font-display, 'Newsreader', Georgia, serif)">Feed the answer forward</text><text x="68" y="507" font-size="20" fill="var(--text-dim, #52616a)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Use the result</text><text x="68" y="534" font-size="20" fill="var(--text-dim, #52616a)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">in the next decision.</text><path d="M34 582 L34 614 L353 614 L353 51 L321 51" fill="none" stroke="var(--figure-accent, #174bc5)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" marker-end="url(#vs-03-mobile-gold)"/></svg>