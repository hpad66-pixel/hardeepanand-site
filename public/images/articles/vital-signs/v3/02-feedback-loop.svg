<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" role="img" aria-labelledby="vs-02-wide-title vs-02-wide-desc" class="vital-graphic"><style>
  .vs-trace { stroke-dasharray:1; stroke-dashoffset:0; animation:vs-draw 4.6s ease both; }
  .vs-orbit { stroke-dasharray:5 95; opacity:0; animation:vs-orbit 4.8s linear both; }
  .vs-signal { stroke-dasharray:5 95; opacity:0; animation:vs-signal 4.6s ease both; }
  .vs-step { stroke-dasharray:1; stroke-dashoffset:0; animation:vs-step 4.8s ease both; }
  @keyframes vs-draw { 0%,8% {stroke-dashoffset:1} 72%,100% {stroke-dashoffset:0} }
  @keyframes vs-orbit {0%{opacity:0;stroke-dashoffset:25} 8%{opacity:1} 90%{opacity:1} 100%{opacity:0;stroke-dashoffset:-75} }
  @keyframes vs-signal {0%{opacity:0;stroke-dashoffset:5} 8%{opacity:1} 65%,88%{opacity:1;stroke-dashoffset:-95} 100%{opacity:0;stroke-dashoffset:-95} }
  @keyframes vs-step {0%{stroke-dashoffset:1;opacity:0} 15%,80%{stroke-dashoffset:0;opacity:1} 100%{stroke-dashoffset:0;opacity:0} }
  @media(prefers-reduced-motion:reduce){.vs-motion{animation:none!important}.vs-orbit,.vs-signal,.vs-step{display:none}}
</style><title id="vs-02-wide-title">A measurement becomes a steering system</title><desc id="vs-02-wide-desc">Sense, compare, act, and measure again form a continuous feedback loop.</desc><defs><marker id="vs-02-wide-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--figure-accent, #174bc5)" stroke-width="1.5"/></marker><marker id="vs-02-wide-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--accent, #124f6b)" stroke-width="1.5"/></marker><marker id="vs-02-wide-dead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--line, #d4d9d7)" stroke-width="1.5"/></marker></defs><circle cx="410" cy="190" r="120" fill="none" stroke="var(--figure-accent, #174bc5)" stroke-width="2"/><circle cx="410" cy="190" r="120" fill="none" stroke="var(--text, #092b3e)" stroke-width="4" pathLength="100" class="vs-motion vs-orbit"/><path d="M447 76 Q477 85 494 107" fill="none" stroke="var(--figure-accent, #174bc5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#vs-02-wide-gold)"/><path d="M373 304 Q343 295 326 273" fill="none" stroke="var(--figure-accent, #174bc5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#vs-02-wide-gold)"/><text x="410" y="179" font-size="27" fill="var(--text, #092b3e)" text-anchor="middle" style="font-family:var(--font-display, 'Newsreader', Georgia, serif)">Steer by</text><text x="410" y="212" font-size="27" fill="var(--text, #092b3e)" text-anchor="middle" style="font-family:var(--font-display, 'Newsreader', Georgia, serif)">the response.</text><rect x="331" y="43" width="158" height="61" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="410" y="67" font-size="18" fill="var(--text, #092b3e)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">COMPARE</text><text x="410" y="90" font-size="13" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Actual vs. intended</text><rect x="331" y="283" width="158" height="61" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="410" y="307" font-size="18" fill="var(--text, #092b3e)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">MEASURE AGAIN</text><text x="410" y="330" font-size="13" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Did it improve?</text><rect x="37" y="151" width="178" height="78" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="126" y="179" font-size="18" fill="var(--accent, #124f6b)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">SENSE</text><text x="126" y="207" font-size="15" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Read the vital sign</text><rect x="605" y="151" width="178" height="78" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="694" y="179" font-size="18" fill="var(--figure-accent, #174bc5)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">ACT</text><text x="694" y="207" font-size="15" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Change the system</text><line x1="215" y1="190" x2="285" y2="190" stroke="var(--accent, #124f6b)" stroke-width="2" marker-end="url(#vs-02-wide-blue)"/><line x1="535" y1="190" x2="605" y2="190" stroke="var(--figure-accent, #174bc5)" stroke-width="2" marker-end="url(#vs-02-wide-gold)"/><path d="M694 229 V310 H499" fill="none" stroke="var(--figure-accent, #174bc5)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#vs-02-wide-gold)"/><text x="126" y="125" fill="var(--text-dim, #52616a)" font-size="13" letter-spacing="1.2" text-anchor="middle" style="font-family:var(--font-label, 'Inter', Arial, sans-serif)">THE INSTRUMENT</text><text x="694" y="125" fill="var(--text-dim, #52616a)" font-size="13" letter-spacing="1.2" text-anchor="middle" style="font-family:var(--font-label, 'Inter', Arial, sans-serif)">THE INTERVENTION</text></svg>