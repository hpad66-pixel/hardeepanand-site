<svg xmlns="http://www.w3.org/2000/svg" width="380" height="676" viewBox="0 0 380 676" role="img" aria-labelledby="vs-01-mobile-title vs-01-mobile-desc" class="vital-graphic"><style>
  .vs-trace { stroke-dasharray:1; stroke-dashoffset:0; animation:vs-draw 4.6s ease both; }
  .vs-orbit { stroke-dasharray:5 95; opacity:0; animation:vs-orbit 4.8s linear both; }
  .vs-signal { stroke-dasharray:5 95; opacity:0; animation:vs-signal 4.6s ease both; }
  .vs-step { stroke-dasharray:1; stroke-dashoffset:0; animation:vs-step 4.8s ease both; }
  @keyframes vs-draw { 0%,8% {stroke-dashoffset:1} 72%,100% {stroke-dashoffset:0} }
  @keyframes vs-orbit {0%{opacity:0;stroke-dashoffset:25} 8%{opacity:1} 90%{opacity:1} 100%{opacity:0;stroke-dashoffset:-75} }
  @keyframes vs-signal {0%{opacity:0;stroke-dashoffset:5} 8%{opacity:1} 65%,88%{opacity:1;stroke-dashoffset:-95} 100%{opacity:0;stroke-dashoffset:-95} }
  @keyframes vs-step {0%{stroke-dashoffset:1;opacity:0} 15%,80%{stroke-dashoffset:0;opacity:1} 100%{stroke-dashoffset:0;opacity:0} }
  @media(prefers-reduced-motion:reduce){.vs-motion{animation:none!important}.vs-orbit,.vs-signal,.vs-step{display:none}}
</style><title id="vs-01-mobile-title">From a snapshot to a response</title><desc id="vs-01-mobile-desc">A single point contrasts with a continuous illustrative curve. An intervention is marked on the curve.</desc><defs><marker id="vs-01-mobile-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--figure-accent, #174bc5)" stroke-width="1.5"/></marker><marker id="vs-01-mobile-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--accent, #124f6b)" stroke-width="1.5"/></marker><marker id="vs-01-mobile-dead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--line, #d4d9d7)" stroke-width="1.5"/></marker></defs><g transform="translate(12 0)"><text x="18" y="30" fill="var(--text-dim, #52616a)" font-size="13" letter-spacing="1.2" text-anchor="start" style="font-family:var(--font-label, 'Inter', Arial, sans-serif)">01 / THE SNAPSHOT</text><text x="18" y="67" font-size="23" fill="var(--text, #092b3e)" text-anchor="start" style="font-family:var(--font-display, 'Newsreader', Georgia, serif)">A reading without a response.</text><line x1="24" y1="199" x2="332" y2="199" stroke="var(--line, #d4d9d7)" stroke-width="1" /><line x1="24" y1="100" x2="24" y2="199" stroke="var(--line, #d4d9d7)" stroke-width="1" /><circle cx="178" cy="143" r="6" fill="var(--figure-accent, #174bc5)" stroke="var(--figure-accent, #174bc5)" stroke-width="2"/><text x="178" y="126" font-size="13" fill="var(--figure-accent, #174bc5)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">ONE READING</text><text x="178" y="225" font-size="14" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Time →</text><text x="18" y="268" font-size="20" fill="var(--text-dim, #52616a)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Describe the condition.</text><text x="18" y="296" font-size="20" fill="var(--text-dim, #52616a)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">What changed it? Unknown.</text></g><line x1="12" y1="330" x2="368" y2="330" stroke="var(--line, #d4d9d7)" stroke-width="1" /><g transform="translate(12 350)"><text x="18" y="30" fill="var(--text-dim, #52616a)" font-size="13" letter-spacing="1.2" text-anchor="start" style="font-family:var(--font-label, 'Inter', Arial, sans-serif)">02 / THE CURVE</text><text x="18" y="67" font-size="23" fill="var(--text, #092b3e)" text-anchor="start" style="font-family:var(--font-display, 'Newsreader', Georgia, serif)">The system answers back.</text><line x1="24" y1="199" x2="332" y2="199" stroke="var(--line, #d4d9d7)" stroke-width="1" /><line x1="24" y1="100" x2="24" y2="199" stroke="var(--line, #d4d9d7)" stroke-width="1" /><line x1="24" y1="143" x2="332" y2="143" stroke="var(--line, #d4d9d7)" stroke-width="1" stroke-dasharray="3 5"/><path d="M24 163 C50 158 55 166 70 150 C90 138 96 95 122 100 S154 164 183 171 S230 159 257 174 S301 177 332 177" fill="none" stroke="var(--line, #d4d9d7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M24 163 C50 158 55 166 70 150 C90 138 96 95 122 100 S154 164 183 171 S230 159 257 174 S301 177 332 177" fill="none" stroke="var(--figure-accent, #174bc5)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion vs-trace"/><line x1="132" y1="91" x2="132" y2="203" stroke="var(--figure-accent, #174bc5)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="146" y="96" font-size="14" fill="var(--figure-accent, #174bc5)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Intervention</text><text x="178" y="225" font-size="14" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Time →</text><text x="18" y="268" font-size="20" fill="var(--text-dim, #52616a)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Read before and after.</text><text x="18" y="296" font-size="20" fill="var(--text-dim, #52616a)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">What explains the change?</text></g></svg>