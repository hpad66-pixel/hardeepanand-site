<svg xmlns="http://www.w3.org/2000/svg" width="380" height="588" viewBox="0 0 380 588" role="img" aria-labelledby="title desc"><title id="title">The severed loop</title><desc id="desc">A worsening trend reaches a report, but a broken connection prevents a response. The capital plan stays unchanged.</desc><defs><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#B5821A" stroke-width="1.5"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2C6C8C" stroke-width="1.5"/></marker><marker id="dead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#A3AEB3" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#EDF0F1"/><g transform="translate(36 36)"><text x="0" y="0" fill="#4A6069" font-size="13" letter-spacing="1.4" text-anchor="start" font-family="monospace">THE WARNING</text><line x1="0" y1="106" x2="304" y2="106" stroke="#C6D0D3" stroke-width="1" /><path d="M0 92 C60.800000000000004 95 82.08000000000001 66 121.60000000000001 72 S212.79999999999998 33 304 16" fill="none" stroke="#2C6C8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="0" y="139" font-size="16" fill="#4A6069" text-anchor="start" font-family="Arial, sans-serif">A worsening trend is visible.</text></g><line x1="190" y1="200" x2="190" y2="239" stroke="#2C6C8C" stroke-width="2" marker-end="url(#blue)"/><rect x="72" y="248" width="236" height="71" fill="#F6F8F8" stroke="#C6D0D3"/><text x="190" y="276" font-size="17" fill="#2C6C8C" text-anchor="middle" font-family="Arial, sans-serif">REPORTED</text><text x="190" y="300" font-size="15" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">The dashboard has the signal.</text><line x1="190" y1="326" x2="190" y2="350" stroke="#B5821A" stroke-width="2" /><line x1="190" y1="385" x2="190" y2="409" stroke="#A3AEB3" stroke-width="2" stroke-dasharray="4 4"/><text x="211" y="373" font-size="16" fill="#B5821A" text-anchor="start" font-family="Arial, sans-serif">No decision follows.</text><line x1="181" y1="360" x2="198" y2="352" stroke="#B5821A" stroke-width="2" /><line x1="181" y1="373" x2="198" y2="365" stroke="#B5821A" stroke-width="2" /><rect x="72" y="421" width="236" height="71" fill="#EDF0F1" stroke="#A3AEB3"/><text x="190" y="449" font-size="17" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">UNCHANGED</text><text x="190" y="473" font-size="15" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">The capital plan stays the same.</text><line x1="36" y1="523" x2="344" y2="523" stroke="#C6D0D3" stroke-width="1" /><text x="190" y="556" font-size="19" fill="#15303C" text-anchor="middle" font-family="Georgia, serif">The failure is in the connection.</text></svg>