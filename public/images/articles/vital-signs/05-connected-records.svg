<svg xmlns="http://www.w3.org/2000/svg" width="820" height="441" viewBox="0 0 820 441" role="img" aria-labelledby="title desc"><title id="title">From existing records to a usable baseline</title><desc id="desc">SCADA, rainfall, billing and production records are aligned and checked to create a comparable baseline. The curve is illustrative.</desc><defs><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#B5821A" stroke-width="1.5"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2C6C8C" stroke-width="1.5"/></marker><marker id="dead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#A3AEB3" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#EDF0F1"/><rect x="15" y="40" width="264" height="81" fill="#F6F8F8" stroke="#C6D0D3"/><text x="32" y="69" fill="#4A6069" font-size="13" letter-spacing="1.4" text-anchor="start" font-family="monospace">SCADA HISTORY</text><text x="32" y="98" font-size="18" fill="#2C6C8C" text-anchor="start" font-family="Arial, sans-serif">Plant flow + time</text><line x1="279" y1="80" x2="309" y2="80" stroke="#2C6C8C" stroke-width="1.5" /><rect x="15" y="145" width="264" height="81" fill="#F6F8F8" stroke="#C6D0D3"/><text x="32" y="174" fill="#4A6069" font-size="13" letter-spacing="1.4" text-anchor="start" font-family="monospace">RAINFALL RECORDS</text><text x="32" y="203" font-size="18" fill="#2C6C8C" text-anchor="start" font-family="Arial, sans-serif">Storm timing + intensity</text><line x1="279" y1="185" x2="309" y2="185" stroke="#2C6C8C" stroke-width="1.5" /><rect x="15" y="250" width="264" height="81" fill="#F6F8F8" stroke="#C6D0D3"/><text x="32" y="279" fill="#4A6069" font-size="13" letter-spacing="1.4" text-anchor="start" font-family="monospace">BILLING + PRODUCTION</text><text x="32" y="308" font-size="18" fill="#2C6C8C" text-anchor="start" font-family="Arial, sans-serif">Water in + water billed</text><line x1="279" y1="290" x2="309" y2="290" stroke="#2C6C8C" stroke-width="1.5" /><line x1="309" y1="80" x2="309" y2="290" stroke="#2C6C8C" stroke-width="1.5" /><line x1="309" y1="185" x2="343" y2="185" stroke="#2C6C8C" stroke-width="2" marker-end="url(#blue)"/><rect x="355" y="91" width="213" height="190" fill="#F6F8F8" stroke="#C6D0D3"/><text x="461" y="123" fill="#B5821A" font-size="13" letter-spacing="1.4" text-anchor="middle" font-family="monospace">CONNECT &amp; CHECK</text><text x="461" y="161" font-size="18" fill="#15303C" text-anchor="middle" font-family="Arial, sans-serif">Align dates, units</text><text x="461" y="186" font-size="18" fill="#15303C" text-anchor="middle" font-family="Arial, sans-serif">and boundaries.</text><line x1="380" y1="203" x2="543" y2="203" stroke="#C6D0D3" stroke-width="1" /><text x="461" y="230" font-size="15" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">Mark gaps. Compare</text><text x="461" y="252" font-size="15" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">like conditions.</text><line x1="576" y1="185" x2="612" y2="185" stroke="#B5821A" stroke-width="2" marker-end="url(#gold)"/><rect x="627" y="91" width="183" height="190" fill="#F6F8F8" stroke="#C6D0D3"/><text x="718" y="123" fill="#4A6069" font-size="13" letter-spacing="1.4" text-anchor="middle" font-family="monospace">THE BASELINE</text><line x1="645" y1="229" x2="791" y2="229" stroke="#C6D0D3" stroke-width="1" /><path d="M645 212 C658 194 669 220 682 200 S709 208 722 186 S750 189 766 168 S783 174 791 156" fill="none" stroke="#2C6C8C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text x="718" y="257" font-size="15" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">A curve you can read</text><line x1="15" y1="360" x2="805" y2="360" stroke="#C6D0D3" stroke-width="1" /><text x="410" y="395" font-size="22" fill="#15303C" text-anchor="middle" font-family="Georgia, serif">The first project is connection. Better instrumentation can follow.</text></svg>