<svg xmlns="http://www.w3.org/2000/svg" width="820" height="456" viewBox="0 0 820 456" role="img" aria-labelledby="title desc"><title id="title">The Curve Test</title><desc id="desc">Four steps: name the vital sign, draw the baseline, watch for the bend, and feed the answer forward into the next capital decision.</desc><defs><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#B5821A" stroke-width="1.5"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2C6C8C" stroke-width="1.5"/></marker><marker id="dead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#A3AEB3" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#EDF0F1"/><line x1="358" y1="93" x2="466" y2="93" stroke="#B5821A" stroke-width="2" marker-end="url(#gold)"/><line x1="638" y1="153" x2="638" y2="250" stroke="#B5821A" stroke-width="2" marker-end="url(#gold)"/><line x1="466" y1="314" x2="365" y2="314" stroke="#B5821A" stroke-width="2" marker-end="url(#gold)"/><line x1="197" y1="251" x2="197" y2="162" stroke="#B5821A" stroke-width="2" marker-end="url(#gold)"/><rect x="36" y="44" width="310" height="116" fill="#F6F8F8" stroke="#C6D0D3"/><text x="56" y="72" fill="#B5821A" font-size="13" letter-spacing="1.4" text-anchor="start" font-family="monospace">01</text><text x="56" y="104" font-size="24" fill="#15303C" text-anchor="start" font-family="Georgia, serif">Name the vital sign</text><text x="56" y="132" font-size="15" fill="#4A6069" text-anchor="start" font-family="Arial, sans-serif">Which number should the money move?</text><rect x="475" y="44" width="310" height="116" fill="#F6F8F8" stroke="#C6D0D3"/><text x="495" y="72" fill="#B5821A" font-size="13" letter-spacing="1.4" text-anchor="start" font-family="monospace">02</text><text x="495" y="104" font-size="24" fill="#15303C" text-anchor="start" font-family="Georgia, serif">Draw the baseline</text><text x="495" y="132" font-size="15" fill="#4A6069" text-anchor="start" font-family="Arial, sans-serif">Establish the trend before the work.</text><rect x="475" y="265" width="310" height="116" fill="#F6F8F8" stroke="#C6D0D3"/><text x="495" y="293" fill="#B5821A" font-size="13" letter-spacing="1.4" text-anchor="start" font-family="monospace">03</text><text x="495" y="325" font-size="24" fill="#15303C" text-anchor="start" font-family="Georgia, serif">Watch for the bend</text><text x="495" y="353" font-size="15" fill="#4A6069" text-anchor="start" font-family="Arial, sans-serif">Read the response after intervention.</text><rect x="36" y="265" width="310" height="116" fill="#F6F8F8" stroke="#C6D0D3"/><text x="56" y="293" fill="#B5821A" font-size="13" letter-spacing="1.4" text-anchor="start" font-family="monospace">04</text><text x="56" y="325" font-size="24" fill="#15303C" text-anchor="start" font-family="Georgia, serif">Feed the answer forward</text><text x="56" y="353" font-size="15" fill="#4A6069" text-anchor="start" font-family="Arial, sans-serif">Let the result shape the next decision.</text><text x="410" y="209" font-size="28" fill="#15303C" text-anchor="middle" font-family="Georgia, serif">The Curve Test</text><text x="410" y="233" fill="#4A6069" font-size="13" letter-spacing="1.4" text-anchor="middle" font-family="monospace">FOUR STEPS. ONE CLOSED LOOP.</text><text x="410" y="431" font-size="18" fill="#4A6069" text-anchor="middle" font-family="Arial, sans-serif">A result becomes useful when it changes what you fund next.</text></svg>