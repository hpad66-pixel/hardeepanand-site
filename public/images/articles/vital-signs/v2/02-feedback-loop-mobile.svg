<svg xmlns="http://www.w3.org/2000/svg" width="380" height="506" viewBox="0 0 380 506" role="img" aria-labelledby="vs-02-mobile-title vs-02-mobile-desc" class="vital-graphic"><style>
  .vs-trace { stroke-dasharray:1; stroke-dashoffset:0; animation:vs-draw 4.6s ease both; }
  .vs-orbit { stroke-dasharray:5 95; opacity:0; animation:vs-orbit 4.8s linear both; }
  .vs-signal { stroke-dasharray:5 95; opacity:0; animation:vs-signal 4.6s ease both; }
  .vs-step { stroke-dasharray:1; stroke-dashoffset:0; animation:vs-step 4.8s ease both; }
  @keyframes vs-draw { 0%,8% {stroke-dashoffset:1} 72%,100% {stroke-dashoffset:0} }
  @keyframes vs-orbit {0%{opacity:0;stroke-dashoffset:25} 8%{opacity:1} 90%{opacity:1} 100%{opacity:0;stroke-dashoffset:-75} }
  @keyframes vs-signal {0%{opacity:0;stroke-dashoffset:5} 8%{opacity:1} 65%,88%{opacity:1;stroke-dashoffset:-95} 100%{opacity:0;stroke-dashoffset:-95} }
  @keyframes vs-step {0%{stroke-dashoffset:1;opacity:0} 15%,80%{stroke-dashoffset:0;opacity:1} 100%{stroke-dashoffset:0;opacity:0} }
  @media(prefers-reduced-motion:reduce){.vs-motion{animation:none!important}.vs-orbit,.vs-signal,.vs-step{display:none}}
</style><title id="vs-02-mobile-title">A measurement becomes a steering system</title><desc id="vs-02-mobile-desc">Sense, compare, act, and measure again form a continuous feedback loop.</desc><defs><marker id="vs-02-mobile-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--accent-2, #236780)" stroke-width="1.5"/></marker><marker id="vs-02-mobile-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--accent, #124f6b)" stroke-width="1.5"/></marker><marker id="vs-02-mobile-dead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--line, #d4d9d7)" stroke-width="1.5"/></marker></defs><circle cx="190" cy="245" r="108" fill="none" stroke="var(--accent-2, #236780)" stroke-width="2"/><circle cx="190" cy="245" r="108" fill="none" stroke="var(--text, #092b3e)" stroke-width="4" pathLength="100" class="vs-motion vs-orbit"/><path d="M227 143 Q257 152 274 174" fill="none" stroke="var(--accent-2, #236780)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#vs-02-mobile-gold)"/><path d="M153 347 Q123 338 106 316" fill="none" stroke="var(--accent-2, #236780)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#vs-02-mobile-gold)"/><text x="190" y="234" font-size="27" fill="var(--text, #092b3e)" text-anchor="middle" style="font-family:var(--font-display, 'Newsreader', Georgia, serif)">Steer by</text><text x="190" y="267" font-size="27" fill="var(--text, #092b3e)" text-anchor="middle" style="font-family:var(--font-display, 'Newsreader', Georgia, serif)">the response.</text><rect x="111" y="110" width="158" height="61" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="190" y="134" font-size="18" fill="var(--text, #092b3e)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">COMPARE</text><text x="190" y="157" font-size="13" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Actual vs. intended</text><rect x="111" y="326" width="158" height="61" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="190" y="350" font-size="18" fill="var(--text, #092b3e)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">MEASURE AGAIN</text><text x="190" y="373" font-size="13" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Did it improve?</text><rect x="9" y="222" width="100" height="48" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="59" y="251" font-size="16" fill="var(--accent, #124f6b)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">SENSE</text><rect x="271" y="222" width="100" height="48" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="321" y="251" font-size="16" fill="var(--accent-2, #236780)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">ACT</text><text x="190" y="39" fill="var(--text-dim, #52616a)" font-size="13" letter-spacing="1.2" text-anchor="middle" style="font-family:var(--font-label, 'Inter', Arial, sans-serif)">THE INSTRUMENT IS ONLY THE START</text><text x="190" y="69" font-size="18" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-display, 'Newsreader', Georgia, serif)">A measurement needs a path to action.</text><line x1="52" y1="434" x2="328" y2="434" stroke="var(--line, #d4d9d7)" stroke-width="1" /><text x="190" y="464" font-size="17" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">The next reading closes the loop.</text></svg>