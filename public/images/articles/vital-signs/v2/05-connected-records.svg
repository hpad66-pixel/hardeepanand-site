<svg xmlns="http://www.w3.org/2000/svg" width="820" height="441" viewBox="0 0 820 441" role="img" aria-labelledby="vs-05-wide-title vs-05-wide-desc" class="vital-graphic"><style>
  .vs-trace { stroke-dasharray:1; stroke-dashoffset:0; animation:vs-draw 4.6s ease both; }
  .vs-orbit { stroke-dasharray:5 95; opacity:0; animation:vs-orbit 4.8s linear both; }
  .vs-signal { stroke-dasharray:5 95; opacity:0; animation:vs-signal 4.6s ease both; }
  .vs-step { stroke-dasharray:1; stroke-dashoffset:0; animation:vs-step 4.8s ease both; }
  @keyframes vs-draw { 0%,8% {stroke-dashoffset:1} 72%,100% {stroke-dashoffset:0} }
  @keyframes vs-orbit {0%{opacity:0;stroke-dashoffset:25} 8%{opacity:1} 90%{opacity:1} 100%{opacity:0;stroke-dashoffset:-75} }
  @keyframes vs-signal {0%{opacity:0;stroke-dashoffset:5} 8%{opacity:1} 65%,88%{opacity:1;stroke-dashoffset:-95} 100%{opacity:0;stroke-dashoffset:-95} }
  @keyframes vs-step {0%{stroke-dashoffset:1;opacity:0} 15%,80%{stroke-dashoffset:0;opacity:1} 100%{stroke-dashoffset:0;opacity:0} }
  @media(prefers-reduced-motion:reduce){.vs-motion{animation:none!important}.vs-orbit,.vs-signal,.vs-step{display:none}}
</style><title id="vs-05-wide-title">From existing records to a usable baseline</title><desc id="vs-05-wide-desc">SCADA, rainfall, billing and production records are aligned and checked to create a comparable baseline. The curve is illustrative.</desc><defs><marker id="vs-05-wide-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--accent-2, #236780)" stroke-width="1.5"/></marker><marker id="vs-05-wide-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--accent, #124f6b)" stroke-width="1.5"/></marker><marker id="vs-05-wide-dead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--line, #d4d9d7)" stroke-width="1.5"/></marker></defs><rect x="15" y="40" width="264" height="81" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="32" y="69" fill="var(--text-dim, #52616a)" font-size="13" letter-spacing="1.2" text-anchor="start" style="font-family:var(--font-label, 'Inter', Arial, sans-serif)">SCADA HISTORY</text><text x="32" y="98" font-size="18" fill="var(--accent, #124f6b)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Plant flow + time</text><line x1="279" y1="80" x2="309" y2="80" stroke="var(--accent, #124f6b)" stroke-width="1.5" /><rect x="15" y="145" width="264" height="81" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="32" y="174" fill="var(--text-dim, #52616a)" font-size="13" letter-spacing="1.2" text-anchor="start" style="font-family:var(--font-label, 'Inter', Arial, sans-serif)">RAINFALL RECORDS</text><text x="32" y="203" font-size="18" fill="var(--accent, #124f6b)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Storm timing + intensity</text><line x1="279" y1="185" x2="309" y2="185" stroke="var(--accent, #124f6b)" stroke-width="1.5" /><rect x="15" y="250" width="264" height="81" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="32" y="279" fill="var(--text-dim, #52616a)" font-size="13" letter-spacing="1.2" text-anchor="start" style="font-family:var(--font-label, 'Inter', Arial, sans-serif)">BILLING + PRODUCTION</text><text x="32" y="308" font-size="18" fill="var(--accent, #124f6b)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Water in + water billed</text><line x1="279" y1="290" x2="309" y2="290" stroke="var(--accent, #124f6b)" stroke-width="1.5" /><line x1="309" y1="80" x2="309" y2="290" stroke="var(--accent, #124f6b)" stroke-width="1.5" /><line x1="309" y1="185" x2="343" y2="185" stroke="var(--accent, #124f6b)" stroke-width="2" marker-end="url(#vs-05-wide-blue)"/><rect x="355" y="91" width="213" height="190" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="461" y="123" fill="var(--accent-2, #236780)" font-size="13" letter-spacing="1.2" text-anchor="middle" style="font-family:var(--font-label, 'Inter', Arial, sans-serif)">CONNECT &amp; CHECK</text><text x="461" y="161" font-size="18" fill="var(--text, #092b3e)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Align dates, units</text><text x="461" y="186" font-size="18" fill="var(--text, #092b3e)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">and boundaries.</text><line x1="380" y1="203" x2="543" y2="203" stroke="var(--line, #d4d9d7)" stroke-width="1" /><text x="461" y="230" font-size="15" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Mark gaps. Compare</text><text x="461" y="252" font-size="15" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">like conditions.</text><line x1="576" y1="185" x2="612" y2="185" stroke="var(--accent-2, #236780)" stroke-width="2" marker-end="url(#vs-05-wide-gold)"/><rect x="627" y="91" width="183" height="190" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="718" y="123" fill="var(--text-dim, #52616a)" font-size="13" letter-spacing="1.2" text-anchor="middle" style="font-family:var(--font-label, 'Inter', Arial, sans-serif)">THE BASELINE</text><line x1="645" y1="229" x2="791" y2="229" stroke="var(--line, #d4d9d7)" stroke-width="1" /><path d="M645 212 C658 194 669 220 682 200 S709 208 722 186 S750 189 766 168 S783 174 791 156" fill="none" stroke="var(--line, #d4d9d7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M645 212 C658 194 669 220 682 200 S709 208 722 186 S750 189 766 168 S783 174 791 156" fill="none" stroke="var(--accent, #124f6b)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion vs-trace"/><text x="718" y="257" font-size="15" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">A curve you can read</text><line x1="15" y1="360" x2="805" y2="360" stroke="var(--line, #d4d9d7)" stroke-width="1" /><text x="410" y="395" font-size="22" fill="var(--text, #092b3e)" text-anchor="middle" style="font-family:var(--font-display, 'Newsreader', Georgia, serif)">The first project is connection. Better instrumentation can follow.</text></svg>