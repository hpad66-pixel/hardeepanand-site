  @keyframes vs-draw { 0%,8% {stroke-dashoffset:1} 72%,100% {stroke-dashoffset:0} }
  @keyframes vs-orbit {0%{opacity:0;stroke-dashoffset:25} 8%{opacity:1} 90%{opacity:1} 100%{opacity:0;stroke-dashoffset:-75} }
  @keyframes vs-signal {0%{opacity:0;stroke-dashoffset:5} 8%{opacity:1} 65%,88%{opacity:1;stroke-dashoffset:-95} 100%{opacity:0;stroke-dashoffset:-95} }
  @keyframes vs-step {0%{stroke-dashoffset:1;opacity:0} 15%,80%{stroke-dashoffset:0;opacity:1} 100%{stroke-dashoffset:0;opacity:0} }
  @media(prefers-reduced-motion:reduce){.vs-motion{animation:none!important}.vs-orbit,.vs-signal,.vs-step{display:none}}
</style><title id="vs-03-wide-title">The Curve Test</title><desc id="vs-03-wide-desc">Four steps: name the vital sign, draw the baseline, watch for the bend, and feed the answer forward into the next capital decision.</desc><defs><marker id="vs-03-wide-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--accent-2, #236780)" stroke-width="1.5"/></marker><marker id="vs-03-wide-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--accent, #124f6b)" stroke-width="1.5"/></marker><marker id="vs-03-wide-dead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--line, #d4d9d7)" stroke-width="1.5"/></marker></defs><line x1="358" y1="93" x2="466" y2="93" stroke="var(--accent-2, #236780)" stroke-width="2" marker-end="url(#vs-03-wide-gold)"/><line x1="638" y1="153" x2="638" y2="250" stroke="var(--accent-2, #236780)" stroke-width="2" marker-end="url(#vs-03-wide-gold)"/><line x1="466" y1="314" x2="365" y2="314" stroke="var(--accent-2, #236780)" stroke-width="2" marker-end="url(#vs-03-wide-gold)"/><line x1="197" y1="251" x2="197" y2="162" stroke="var(--accent-2, #236780)" stroke-width="2" marker-end="url(#vs-03-wide-gold)"/><rect x="36" y="44" width="310" height="116" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="56" y="72" fill="var(--accent-2, #236780)" font-size="13" letter-spacing="1.2" text-anchor="start" style="font-family:var(--font-label, 'Inter', Arial, sans-serif)">01</text><text x="56" y="104" font-size="24" fill="var(--text, #092b3e)" text-anchor="start" style="font-family:var(--font-display, 'Newsreader', Georgia, serif)">Name the vital sign</text><path d="M56 81H83" fill="none" stroke="var(--text, #092b3e)" stroke-width="2" pathLength="1" class="vs-motion vs-step" style="animation-delay:0s;animation-duration:4.8s"/><text x="56" y="132" font-size="15" fill="var(--text-dim, #52616a)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Which number should the money move?</text><rect x="475" y="44" width="310" height="116" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="495" y="72" fill="var(--accent-2, #236780)" font-size="13" letter-spacing="1.2" text-anchor="start" style="font-family:var(--font-label, 'Inter', Arial, sans-serif)">02</text><text x="495" y="104" font-size="24" fill="var(--text, #092b3e)" text-anchor="start" style="font-family:var(--font-display, 'Newsreader', Georgia, serif)">Draw the baseline</text><path d="M495 81H522" fill="none" stroke="var(--text, #092b3e)" stroke-width="2" pathLength="1" class="vs-motion vs-step" style="animation-delay:0.85s;animation-duration:3.9499999999999997s"/><text x="495" y="132" font-size="15" fill="var(--text-dim, #52616a)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Establish the trend before the work.</text><rect x="475" y="265" width="310" height="116" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="495" y="293" fill="var(--accent-2, #236780)" font-size="13" letter-spacing="1.2" text-anchor="start" style="font-family:var(--font-label, 'Inter', Arial, sans-serif)">03</text><text x="495" y="325" font-size="24" fill="var(--text, #092b3e)" text-anchor="start" style="font-family:var(--font-display, 'Newsreader', Georgia, serif)">Watch for the bend</text><path d="M495 302H522" fill="none" stroke="var(--text, #092b3e)" stroke-width="2" pathLength="1" class="vs-motion vs-step" style="animation-delay:1.7s;animation-duration:3.0999999999999996s"/><text x="495" y="353" font-size="15" fill="var(--text-dim, #52616a)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Read the response after intervention.</text><rect x="36" y="265" width="310" height="116" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="56" y="293" fill="var(--accent-2, #236780)" font-size="13" letter-spacing="1.2" text-anchor="start" style="font-family:var(--font-label, 'Inter', Arial, sans-serif)">04</text><text x="56" y="325" font-size="24" fill="var(--text, #092b3e)" text-anchor="start" style="font-family:var(--font-display, 'Newsreader', Georgia, serif)">Feed the answer forward</text><path d="M56 302H83" fill="none" stroke="var(--text, #092b3e)" stroke-width="2" pathLength="1" class="vs-motion vs-step" style="animation-delay:2.55s;animation-duration:2.25s"/><text x="56" y="353" font-size="15" fill="var(--text-dim, #52616a)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Let the result shape the next decision.</text><text x="410" y="209" font-size="28" fill="var(--text, #092b3e)" text-anchor="middle" style="font-family:var(--font-display, 'Newsreader', Georgia, serif)">The Curve Test</text><text x="410" y="233" fill="var(--text-dim, #52616a)" font-size="13" letter-spacing="1.2" text-anchor="middle" style="font-family:var(--font-label, 'Inter', Arial, sans-serif)">FOUR STEPS. ONE CLOSED LOOP.</text><text x="410" y="431" font-size="18" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">A result becomes useful when it changes what you fund next.</text></svg>