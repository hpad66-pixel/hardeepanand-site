<svg xmlns="http://www.w3.org/2000/svg" width="820" height="456" viewBox="0 0 820 456" role="img" aria-labelledby="vs-03-wide-title vs-03-wide-desc" class="vital-graphic"><style>
  .vs-trace { stroke-dasharray:1; stroke-dashoffset:0; animation:vs-draw 4.6s ease both; }
  .vs-orbit { stroke-dasharray:5 95; opacity:0; animation:vs-orbit 4.8s linear both; }
