<svg xmlns="http://www.w3.org/2000/svg" width="380" height="588" viewBox="0 0 380 588" role="img" aria-labelledby="vs-04-mobile-title vs-04-mobile-desc" class="vital-graphic"><style>
  .vs-trace { stroke-dasharray:1; stroke-dashoffset:0; animation:vs-draw 4.6s ease both; }
  .vs-orbit { stroke-dasharray:5 95; opacity:0; animation:vs-orbit 4.8s linear both; }
  .vs-signal { stroke-dasharray:5 95; opacity:0; animation:vs-signal 4.6s ease both; }
  .vs-step { stroke-dasharray:1; stroke-dashoffset:0; animation:vs-step 4.8s ease both; }
  @keyframes vs-draw { 0%,8% {stroke-dashoffset:1} 72%,100% {stroke-dashoffset:0} }
  @keyframes vs-orbit {0%{opacity:0;stroke-dashoffset:25} 8%{opacity:1} 90%{opacity:1} 100%{opacity:0;stroke-dashoffset:-75} }
  @keyframes vs-signal {0%{opacity:0;stroke-dashoffset:5} 8%{opacity:1} 65%,88%{opacity:1;stroke-dashoffset:-95} 100%{opacity:0;stroke-dashoffset:-95} }
  @keyframes vs-step {0%{stroke-dashoffset:1;opacity:0} 15%,80%{stroke-dashoffset:0;opacity:1} 100%{stroke-dashoffset:0;opacity:0} }
  @media(prefers-reduced-motion:reduce){.vs-motion{animation:none!important}.vs-orbit,.vs-signal,.vs-step{display:none}}
</style><title id="vs-04-mobile-title">The severed loop</title><desc id="vs-04-mobile-desc">A worsening trend reaches a report, but a broken connection prevents a response. The capital plan stays unchanged.</desc><defs><marker id="vs-04-mobile-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--accent-2, #236780)" stroke-width="1.5"/></marker><marker id="vs-04-mobile-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--accent, #124f6b)" stroke-width="1.5"/></marker><marker id="vs-04-mobile-dead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--line, #d4d9d7)" stroke-width="1.5"/></marker></defs><g transform="translate(36 36)"><text x="0" y="0" fill="var(--text-dim, #52616a)" font-size="13" letter-spacing="1.2" text-anchor="start" style="font-family:var(--font-label, 'Inter', Arial, sans-serif)">THE WARNING</text><line x1="0" y1="106" x2="304" y2="106" stroke="var(--line, #d4d9d7)" stroke-width="1" /><path d="M0 92 C60.800000000000004 95 82.08000000000001 66 121.60000000000001 72 S212.79999999999998 33 304 16" fill="none" stroke="var(--accent, #124f6b)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="0" y="139" font-size="16" fill="var(--text-dim, #52616a)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">A worsening trend is visible.</text></g><line x1="190" y1="200" x2="190" y2="239" stroke="var(--accent, #124f6b)" stroke-width="2" marker-end="url(#vs-04-mobile-blue)"/><rect x="72" y="248" width="236" height="71" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="190" y="276" font-size="17" fill="var(--accent, #124f6b)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">REPORTED</text><text x="190" y="300" font-size="15" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">The dashboard has the signal.</text><line x1="190" y1="326" x2="190" y2="350" stroke="var(--accent-2, #236780)" stroke-width="2" /><line x1="190" y1="385" x2="190" y2="409" stroke="var(--line, #d4d9d7)" stroke-width="2" stroke-dasharray="4 4"/><path d="M190 326 L190 350" fill="none" stroke="var(--text, #092b3e)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="100" class="vs-motion vs-signal"/><text x="211" y="373" font-size="16" fill="var(--accent-2, #236780)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">No decision follows.</text><line x1="181" y1="360" x2="198" y2="352" stroke="var(--accent-2, #236780)" stroke-width="2" /><line x1="181" y1="373" x2="198" y2="365" stroke="var(--accent-2, #236780)" stroke-width="2" /><rect x="72" y="421" width="236" height="71" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="190" y="449" font-size="17" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">UNCHANGED</text><text x="190" y="473" font-size="15" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">The capital plan stays the same.</text><line x1="36" y1="523" x2="344" y2="523" stroke="var(--line, #d4d9d7)" stroke-width="1" /><text x="190" y="556" font-size="19" fill="var(--text, #092b3e)" text-anchor="middle" style="font-family:var(--font-display, 'Newsreader', Georgia, serif)">The failure is in the connection.</text></svg>