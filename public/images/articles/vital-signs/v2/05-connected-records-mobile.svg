<svg xmlns="http://www.w3.org/2000/svg" width="380" height="710" viewBox="0 0 380 710" role="img" aria-labelledby="vs-05-mobile-title vs-05-mobile-desc" class="vital-graphic"><style>
  .vs-trace { stroke-dasharray:1; stroke-dashoffset:0; animation:vs-draw 4.6s ease both; }
  .vs-orbit { stroke-dasharray:5 95; opacity:0; animation:vs-orbit 4.8s linear both; }
  .vs-signal { stroke-dasharray:5 95; opacity:0; animation:vs-signal 4.6s ease both; }
  .vs-step { stroke-dasharray:1; stroke-dashoffset:0; animation:vs-step 4.8s ease both; }
  @keyframes vs-draw { 0%,8% {stroke-dashoffset:1} 72%,100% {stroke-dashoffset:0} }
  @keyframes vs-orbit {0%{opacity:0;stroke-dashoffset:25} 8%{opacity:1} 90%{opacity:1} 100%{opacity:0;stroke-dashoffset:-75} }
  @keyframes vs-signal {0%{opacity:0;stroke-dashoffset:5} 8%{opacity:1} 65%,88%{opacity:1;stroke-dashoffset:-95} 100%{opacity:0;stroke-dashoffset:-95} }
  @keyframes vs-step {0%{stroke-dashoffset:1;opacity:0} 15%,80%{stroke-dashoffset:0;opacity:1} 100%{stroke-dashoffset:0;opacity:0} }
  @media(prefers-reduced-motion:reduce){.vs-motion{animation:none!important}.vs-orbit,.vs-signal,.vs-step{display:none}}
</style><title id="vs-05-mobile-title">From existing records to a usable baseline</title><desc id="vs-05-mobile-desc">SCADA, rainfall, billing and production records are aligned and checked to create a comparable baseline. The curve is illustrative.</desc><defs><marker id="vs-05-mobile-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--accent-2, #236780)" stroke-width="1.5"/></marker><marker id="vs-05-mobile-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--accent, #124f6b)" stroke-width="1.5"/></marker><marker id="vs-05-mobile-dead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--line, #d4d9d7)" stroke-width="1.5"/></marker></defs><rect x="22" y="20" width="336" height="67" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="39" y="44" fill="var(--text-dim, #52616a)" font-size="13" letter-spacing="1.2" text-anchor="start" style="font-family:var(--font-label, 'Inter', Arial, sans-serif)">SCADA HISTORY</text><text x="39" y="69" font-size="18" fill="var(--accent, #124f6b)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Plant flow + time</text><rect x="22" y="101" width="336" height="67" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="39" y="125" fill="var(--text-dim, #52616a)" font-size="13" letter-spacing="1.2" text-anchor="start" style="font-family:var(--font-label, 'Inter', Arial, sans-serif)">RAINFALL RECORDS</text><text x="39" y="150" font-size="18" fill="var(--accent, #124f6b)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Storm timing + intensity</text><rect x="22" y="182" width="336" height="67" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="39" y="206" fill="var(--text-dim, #52616a)" font-size="13" letter-spacing="1.2" text-anchor="start" style="font-family:var(--font-label, 'Inter', Arial, sans-serif)">BILLING + PRODUCTION</text><text x="39" y="231" font-size="18" fill="var(--accent, #124f6b)" text-anchor="start" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Water in + water billed</text><line x1="190" y1="253" x2="190" y2="293" stroke="var(--accent, #124f6b)" stroke-width="2" marker-end="url(#vs-05-mobile-blue)"/><rect x="22" y="305" width="336" height="115" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="190" y="332" fill="var(--accent-2, #236780)" font-size="13" letter-spacing="1.2" text-anchor="middle" style="font-family:var(--font-label, 'Inter', Arial, sans-serif)">CONNECT &amp; CHECK</text><text x="190" y="359" font-size="17" fill="var(--text, #092b3e)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Align dates, units and boundaries.</text><text x="190" y="386" font-size="17" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Mark gaps. Compare like conditions.</text><line x1="190" y1="429" x2="190" y2="465" stroke="var(--accent-2, #236780)" stroke-width="2" marker-end="url(#vs-05-mobile-gold)"/><rect x="22" y="478" width="336" height="157" fill="var(--bg, #f5f3ed)" stroke="var(--line, #d4d9d7)"/><text x="43" y="507" fill="var(--text-dim, #52616a)" font-size="13" letter-spacing="1.2" text-anchor="start" style="font-family:var(--font-label, 'Inter', Arial, sans-serif)">A BASELINE YOU CAN USE</text><line x1="46" y1="591" x2="331" y2="591" stroke="var(--line, #d4d9d7)" stroke-width="1" /><path d="M46 576 C77 568 77 580 101 562 S136 570 159 552 S182 561 204 543 S243 553 269 532 S310 539 331 521" fill="none" stroke="var(--line, #d4d9d7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M46 576 C77 568 77 580 101 562 S136 570 159 552 S182 561 204 543 S243 553 269 532 S310 539 331 521" fill="none" stroke="var(--accent, #124f6b)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion vs-trace"/><text x="190" y="663" font-size="19" fill="var(--text, #092b3e)" text-anchor="middle" style="font-family:var(--font-display, 'Newsreader', Georgia, serif)">Start with the records you already own.</text><text x="190" y="689" font-size="16" fill="var(--text-dim, #52616a)" text-anchor="middle" style="font-family:var(--font-body, 'Inter', Arial, sans-serif)">Sharper instrumentation can come later.</text></svg>