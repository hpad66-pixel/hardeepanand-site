<svg xmlns="http://www.w3.org/2000/svg" class="vital-graphic" width="380" height="490" viewBox="0 0 380 490" role="img" aria-labelledby="sc-old-judgment-new-tools-m-title sc-old-judgment-new-tools-m-desc"><title id="sc-old-judgment-new-tools-m-title">Weave what you know into what you learn.</title><desc id="sc-old-judgment-new-tools-m-desc">Three strands—experience, learning, and practice—cross and come together in one useful workflow. Experience supplies judgment, learning connects new capabilities, and practice checks the result.</desc><style>.sc-draw{stroke-dasharray:1;animation:sc-line 2.8s ease both}.sc-reveal{animation:sc-arrive 1.1s ease both;transform-box:fill-box;transform-origin:center}@keyframes sc-line{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes sc-arrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.sc-draw,.sc-reveal{animation:none!important}}</style><text x="63" y="49" text-anchor="middle" font-size="18" fill="var(--text,#092b3e)" style="font-family:var(--font-display,Georgia,serif)">Experience</text><text x="63" y="73" text-anchor="middle" font-size="12" fill="var(--text-dim,#52616a)" style="font-family:var(--font-display,Georgia,serif)">Bring judgment</text><path d="M63 98 C63 162 310 166 310 229 S92 270 132 348" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M63 98 C63 162 310 166 310 229 S92 270 132 348" fill="none" stroke="var(--text,#092b3e)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion sc-draw" style="animation-delay:0s"/><text x="190" y="49" text-anchor="middle" font-size="18" fill="var(--figure-accent,#174bc5)" style="font-family:var(--font-display,Georgia,serif)">Learning</text><text x="190" y="73" text-anchor="middle" font-size="12" fill="var(--text-dim,#52616a)" style="font-family:var(--font-display,Georgia,serif)">Connect tools</text><path d="M190 98 C190 159 70 167 70 229 S266 275 190 348" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M190 98 C190 159 70 167 70 229 S266 275 190 348" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion sc-draw" style="animation-delay:0.35s"/><text x="317" y="49" text-anchor="middle" font-size="18" fill="var(--figure-secondary,#507da0)" style="font-family:var(--font-display,Georgia,serif)">Practice</text><text x="317" y="73" text-anchor="middle" font-size="12" fill="var(--text-dim,#52616a)" style="font-family:var(--font-display,Georgia,serif)">Check the result</text><path d="M317 98 C317 154 190 170 190 229 S75 286 248 348" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M317 98 C317 154 190 170 190 229 S75 286 248 348" fill="none" stroke="var(--figure-secondary,#507da0)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion sc-draw" style="animation-delay:0.7s"/><g class="vs-motion sc-reveal" style="animation-delay:1.9s"><path d="M113 361 Q190 383 267 361" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="190" y="414" text-anchor="middle" font-size="26" fill="var(--figure-accent,#174bc5)" style="font-family:var(--font-display,Georgia,serif)">One useful workflow.</text><text x="190" y="448" text-anchor="middle" font-size="16" fill="var(--text-dim,#52616a)" style="font-family:var(--font-display,Georgia,serif)">Your judgment stays in the loop.</text></g></svg>