<svg xmlns="http://www.w3.org/2000/svg" class="vital-graphic" width="820" height="415" viewBox="0 0 820 415" role="img" aria-labelledby="sc-carry-the-map-w-title sc-carry-the-map-w-desc"><title id="sc-carry-the-map-w-title">Your experience comes with you.</title><desc id="sc-carry-the-map-w-desc">A continuous climbing route links accumulated judgment to a new ascent. The earlier route remains visible as the new one is drawn.</desc><style>.sc-draw{stroke-dasharray:1;animation:sc-line 2.8s ease both}.sc-reveal{animation:sc-arrive 1.1s ease both;transform-box:fill-box;transform-origin:center}@keyframes sc-line{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes sc-arrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.sc-draw,.sc-reveal{animation:none!important}}</style><path d="M20 310 L165 172 L238 223 L429 48 L505 134 L574 93 L800 306" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M387 88 L429 48 L458 79 L479 65" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M54 345 C226 389 281 325 196 286 S105 261 238 223 S526 288 504 201 S367 230 421 148 S521 162 574 93" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M54 345 C226 389 281 325 196 286 S105 261 238 223 S526 288 504 201 S367 230 421 148 S521 162 574 93" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion sc-draw" style="animation-delay:0s"/><g class="vs-motion sc-reveal" style="animation-delay:0s"><circle cx="54" cy="345" r="5" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="69" y="376" text-anchor="middle" font-size="19" fill="var(--text,#092b3e)" style="font-family:var(--font-display,Georgia,serif)">Experience</text></g><g class="vs-motion sc-reveal" style="animation-delay:0.65s"><circle cx="196" cy="286" r="5" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="211" y="317" text-anchor="middle" font-size="19" fill="var(--text,#092b3e)" style="font-family:var(--font-display,Georgia,serif)">Judgment</text></g><g class="vs-motion sc-reveal" style="animation-delay:1.3s"><circle cx="504" cy="201" r="5" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="519" y="232" text-anchor="middle" font-size="19" fill="var(--text,#092b3e)" style="font-family:var(--font-display,Georgia,serif)">New skills</text></g><g class="vs-motion sc-reveal" style="animation-delay:1.9s"><path d="M574 93 V46 l30 9 -30 12" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="646" y="45" text-anchor="middle" font-size="21" fill="var(--figure-accent,#174bc5)" style="font-family:var(--font-display,Georgia,serif)">Still you. Further up.</text></g><text x="410" y="405" text-anchor="middle" font-size="21" fill="var(--text-dim,#52616a)" style="font-family:var(--font-display,Georgia,serif)">The first climb becomes part of the second.</text></svg>