<svg xmlns="http://www.w3.org/2000/svg" class="vital-graphic" width="380" height="470" viewBox="0 0 380 470" role="img" aria-labelledby="sc-carry-the-map-m-title sc-carry-the-map-m-desc"><title id="sc-carry-the-map-m-title">Your experience comes with you.</title><desc id="sc-carry-the-map-m-desc">A continuous climbing route links accumulated judgment to a new ascent. The earlier route remains visible as the new one is drawn.</desc><style>.sc-draw{stroke-dasharray:1;animation:sc-line 2.8s ease both}.sc-reveal{animation:sc-arrive 1.1s ease both;transform-box:fill-box;transform-origin:center}@keyframes sc-line{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes sc-arrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.sc-draw,.sc-reveal{animation:none!important}}</style><path d="M12 328 L67 217 L109 259 L200 91 L245 163 L289 126 L369 302" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M175 136 L200 91 L220 122 L231 112" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M35 363 C118 390 157 339 112 306 S58 284 112 259 S266 277 235 217 S151 215 198 175 S250 140 289 126" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M35 363 C118 390 157 339 112 306 S58 284 112 259 S266 277 235 217 S151 215 198 175 S250 140 289 126" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion sc-draw" style="animation-delay:0s"/><g class="vs-motion sc-reveal" style="animation-delay:0s"><circle cx="35" cy="363" r="5" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="70" y="394" text-anchor="middle" font-size="15" fill="var(--text,#092b3e)" style="font-family:var(--font-display,Georgia,serif)">Experience</text></g><g class="vs-motion sc-reveal" style="animation-delay:0.65s"><circle cx="112" cy="306" r="5" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="147" y="337" text-anchor="middle" font-size="15" fill="var(--text,#092b3e)" style="font-family:var(--font-display,Georgia,serif)">Judgment</text></g><g class="vs-motion sc-reveal" style="animation-delay:1.3s"><circle cx="235" cy="217" r="5" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="270" y="248" text-anchor="middle" font-size="15" fill="var(--text,#092b3e)" style="font-family:var(--font-display,Georgia,serif)">New skills</text></g><g class="vs-motion sc-reveal" style="animation-delay:1.9s"><path d="M289 126 V79 l30 9 -30 12" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="273" y="60" text-anchor="middle" font-size="17" fill="var(--figure-accent,#174bc5)" style="font-family:var(--font-display,Georgia,serif)">Still you. Further up.</text></g><text x="190" y="460" text-anchor="middle" font-size="17" fill="var(--text-dim,#52616a)" style="font-family:var(--font-display,Georgia,serif)">The first climb becomes part of the second.</text></svg>