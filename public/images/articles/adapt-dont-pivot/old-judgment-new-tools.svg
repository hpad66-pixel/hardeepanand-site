<svg xmlns="http://www.w3.org/2000/svg" class="vital-graphic" width="820" height="390" viewBox="0 0 820 390" role="img" aria-labelledby="sc-old-judgment-new-tools-w-title sc-old-judgment-new-tools-w-desc"><title id="sc-old-judgment-new-tools-w-title">Weave what you know into what you learn.</title><desc id="sc-old-judgment-new-tools-w-desc">Three strands—experience, learning, and practice—cross and come together in one useful workflow. Experience supplies judgment, learning connects new capabilities, and practice checks the result.</desc><style>.sc-draw{stroke-dasharray:1;animation:sc-line 2.8s ease both}.sc-reveal{animation:sc-arrive 1.1s ease both;transform-box:fill-box;transform-origin:center}@keyframes sc-line{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes sc-arrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.sc-draw,.sc-reveal{animation:none!important}}</style><text x="80" y="69" text-anchor="middle" font-size="21" fill="var(--text,#092b3e)" style="font-family:var(--font-display,Georgia,serif)">Experience</text><text x="80" y="93" text-anchor="middle" font-size="14" fill="var(--text-dim,#52616a)" style="font-family:var(--font-display,Georgia,serif)">Bring judgment</text><path d="M173 73 C340 73 339 269 473 269 S610 122 667 145" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M173 73 C340 73 339 269 473 269 S610 122 667 145" fill="none" stroke="var(--text,#092b3e)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion sc-draw" style="animation-delay:0s"/><text x="80" y="169" text-anchor="middle" font-size="21" fill="var(--figure-accent,#174bc5)" style="font-family:var(--font-display,Georgia,serif)">Learning</text><text x="80" y="193" text-anchor="middle" font-size="14" fill="var(--text-dim,#52616a)" style="font-family:var(--font-display,Georgia,serif)">Connect tools</text><path d="M173 173 C332 173 360 72 473 72 S610 190 667 183" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M173 173 C332 173 360 72 473 72 S610 190 667 183" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion sc-draw" style="animation-delay:0.35s"/><text x="80" y="269" text-anchor="middle" font-size="21" fill="var(--figure-secondary,#507da0)" style="font-family:var(--font-display,Georgia,serif)">Practice</text><text x="80" y="293" text-anchor="middle" font-size="14" fill="var(--text-dim,#52616a)" style="font-family:var(--font-display,Georgia,serif)">Check the result</text><path d="M173 273 C327 273 345 170 473 170 S600 277 667 221" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M173 273 C327 273 345 170 473 170 S600 277 667 221" fill="none" stroke="var(--figure-secondary,#507da0)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion sc-draw" style="animation-delay:0.7s"/><g class="vs-motion sc-reveal" style="animation-delay:1.9s"><path d="M686 129 Q708 183 686 237" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="753" y="174" text-anchor="middle" font-size="23" fill="var(--figure-accent,#174bc5)" style="font-family:var(--font-display,Georgia,serif)">Useful</text><text x="753" y="203" text-anchor="middle" font-size="23" fill="var(--figure-accent,#174bc5)" style="font-family:var(--font-display,Georgia,serif)">work</text></g><text x="410" y="358" text-anchor="middle" font-size="21" fill="var(--text-dim,#52616a)" style="font-family:var(--font-display,Georgia,serif)">Your judgment stays in the loop.</text></svg>