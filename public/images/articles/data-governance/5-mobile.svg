<svg class="vital-graphic" xmlns="http://www.w3.org/2000/svg" width="380" height="535" viewBox="0 0 380 535" role="img" aria-labelledby="data-governance-5-m-title data-governance-5-m-desc" style="font-family:var(--font-body,Inter,Arial,sans-serif)"><title id="data-governance-5-m-title">Build capability in a useful order</title><desc id="data-governance-5-m-desc">Start with one consequential decision. Prove that its data can be found, understood, and traced before widening the program.</desc><style>.sl-flow{stroke-dasharray:1;stroke-dashoffset:0;animation:sl-draw 2.5s ease both}.sl-reveal{animation:sl-reveal 1.2s ease both;transform-box:fill-box;transform-origin:center}@keyframes sl-draw{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}@keyframes sl-reveal{0%{opacity:.12;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.sl-flow,.sl-reveal{animation:none!important}}</style><path d="M45 90 V142" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><g class="vs-motion sl-reveal" style="animation-delay:0s"><circle cx="45" cy="46" r="20" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="45" y="51" text-anchor="middle" font-size="15" fill="var(--figure-accent,#174bc5)">1</text></g><g class="vs-motion sl-reveal" style="animation-delay:0s"><text x="83" y="44" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">Find one critical dataset</text><text x="83" y="69" text-anchor="start" font-size="12" fill="var(--text-dim,#52616a)">Can a colleague find it?</text></g><path d="M45 208 V260" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><g class="vs-motion sl-reveal" style="animation-delay:0.45s"><circle cx="45" cy="164" r="20" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="45" y="169" text-anchor="middle" font-size="15" fill="var(--figure-accent,#174bc5)">2</text></g><g class="vs-motion sl-reveal" style="animation-delay:0.45s"><text x="83" y="162" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">Trace its journey</text><text x="83" y="187" text-anchor="start" font-size="12" fill="var(--text-dim,#52616a)">Can you explain its origin?</text></g><path d="M45 326 V378" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><g class="vs-motion sl-reveal" style="animation-delay:0.9s"><circle cx="45" cy="282" r="20" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="45" y="287" text-anchor="middle" font-size="15" fill="var(--figure-accent,#174bc5)">3</text></g><g class="vs-motion sl-reveal" style="animation-delay:0.9s"><text x="83" y="280" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">Keep controls current</text><text x="83" y="305" text-anchor="start" font-size="12" fill="var(--text-dim,#52616a)">Who handles a change?</text></g><path d="M45 444 V496" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><g class="vs-motion sl-reveal" style="animation-delay:1.35s"><circle cx="45" cy="400" r="20" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="45" y="405" text-anchor="middle" font-size="15" fill="var(--figure-accent,#174bc5)">4</text></g><g class="vs-motion sl-reveal" style="animation-delay:1.35s"><text x="83" y="398" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">Extend into a model</text><text x="83" y="423" text-anchor="start" font-size="12" fill="var(--text-dim,#52616a)">Are its inputs defensible?</text></g><text x="190" y="525" text-anchor="middle" font-size="16" fill="var(--figure-accent,#174bc5)">Earn the next step with evidence.</text></svg>