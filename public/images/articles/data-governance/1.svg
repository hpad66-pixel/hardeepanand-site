<svg class="vital-graphic" xmlns="http://www.w3.org/2000/svg" width="820" height="410" viewBox="0 0 820 410" role="img" aria-labelledby="data-governance-1-w-title data-governance-1-w-desc" style="font-family:var(--font-body,Inter,Arial,sans-serif)"><title id="data-governance-1-w-title">Make knowledge discoverable</title><desc id="data-governance-1-w-desc">A catalog preserves the route to knowledge; it does not replace the people responsible for it.</desc><style>.sl-flow{stroke-dasharray:1;stroke-dashoffset:0;animation:sl-draw 2.5s ease both}.sl-reveal{animation:sl-reveal 1.2s ease both;transform-box:fill-box;transform-origin:center}@keyframes sl-draw{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}@keyframes sl-reveal{0%{opacity:.12;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.sl-flow,.sl-reveal{animation:none!important}}</style><text x="195" y="34" text-anchor="middle" font-size="12" fill="var(--figure-accent,#174bc5)">ONE PERSON HOLDS THE MAP</text><path d="M42 87 Q42 147 195 163" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M42 87 Q42 147 195 163" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0s"/><circle cx="42" cy="75" r="16" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="42" y="80" text-anchor="middle" font-size="10" fill="var(--text,#092b3e)">Ops</text><path d="M195 87 Q195 147 195 163" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M195 87 Q195 147 195 163" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0.3s"/><circle cx="195" cy="75" r="16" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="195" y="80" text-anchor="middle" font-size="10" fill="var(--text,#092b3e)">IT</text><path d="M348 87 Q348 147 195 163" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M348 87 Q348 147 195 163" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0.6s"/><circle cx="348" cy="75" r="16" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="348" y="80" text-anchor="middle" font-size="10" fill="var(--text,#092b3e)">AI</text><circle cx="195" cy="194" r="31" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="195" y="200" text-anchor="middle" font-size="14" fill="var(--text,#092b3e)">Sarah</text><text x="195" y="253" text-anchor="middle" font-size="14" fill="var(--text-dim,#52616a)">Every question waits here</text><text x="195" y="288" text-anchor="middle" font-size="13" fill="var(--text-dim,#52616a)">When she leaves, the map leaves.</text><path d="M410 30 V365" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="1" stroke-linecap="round" /><text x="625" y="34" text-anchor="middle" font-size="12" fill="var(--figure-accent,#174bc5)">KNOWLEDGE PEOPLE CAN FIND</text><path d="M472 87 Q472 147 625 163" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M472 87 Q472 147 625 163" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0s"/><circle cx="472" cy="75" r="16" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="472" y="80" text-anchor="middle" font-size="10" fill="var(--text,#092b3e)">Ops</text><path d="M625 87 Q625 147 625 163" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M625 87 Q625 147 625 163" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0.3s"/><circle cx="625" cy="75" r="16" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="625" y="80" text-anchor="middle" font-size="10" fill="var(--text,#092b3e)">IT</text><path d="M778 87 Q778 147 625 163" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M778 87 Q778 147 625 163" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0.6s"/><circle cx="778" cy="75" r="16" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="778" y="80" text-anchor="middle" font-size="10" fill="var(--text,#092b3e)">AI</text><circle cx="625" cy="194" r="31" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="625" y="200" text-anchor="middle" font-size="14" fill="var(--text,#092b3e)">Catalog</text><text x="625" y="253" text-anchor="middle" font-size="14" fill="var(--text-dim,#52616a)">Meaning · source · owner</text><path d="M625 226 V285" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M625 226 V285" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:1.4s"/><g class="vs-motion sl-reveal" style="animation-delay:1.7s"><text x="625" y="307" text-anchor="middle" font-size="13" fill="var(--text,#092b3e)">Sarah maintains the knowledge.</text></g></svg>