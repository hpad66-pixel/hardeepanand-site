<svg class="vital-graphic" xmlns="http://www.w3.org/2000/svg" width="380" height="520" viewBox="0 0 380 520" role="img" aria-labelledby="data-governance-4-m-title data-governance-4-m-desc" style="font-family:var(--font-body,Inter,Arial,sans-serif)"><title id="data-governance-4-m-title">One foundation, several uses</title><desc id="data-governance-4-m-desc">A common evidence foundation supports these uses. Each still has its own requirements; a catalog alone does not establish compliance.</desc><style>.sl-flow{stroke-dasharray:1;stroke-dashoffset:0;animation:sl-draw 2.5s ease both}.sl-reveal{animation:sl-reveal 1.2s ease both;transform-box:fill-box;transform-origin:center}@keyframes sl-draw{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}@keyframes sl-reveal{0%{opacity:.12;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.sl-flow,.sl-reveal{animation:none!important}}</style><path d="M25 315 H355 V395 H25 Z" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="190" y="347" text-anchor="middle" font-size="21" fill="var(--text,#092b3e)">Governed, traceable records</text><text x="190" y="375" text-anchor="middle" font-size="14" fill="var(--text-dim,#52616a)">Known source · accountable owner</text><path d="M40 315 V65 H90" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M40 315 V65 H90" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0s"/><g class="vs-motion sl-reveal" style="animation-delay:0.6s"><rect x="90" y="35" width="250" height="66" rx="3" fill="var(--bg,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="104" y="61" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">Audit evidence</text><text x="104" y="84" text-anchor="start" font-size="12" fill="var(--text-dim,#52616a)">Explain a reported result</text></g><path d="M40 315 V151 H90" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M40 315 V151 H90" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0.35s"/><g class="vs-motion sl-reveal" style="animation-delay:1s"><rect x="90" y="121" width="250" height="66" rx="3" fill="var(--bg,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="104" y="147" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">Collaboration</text><text x="104" y="170" text-anchor="start" font-size="12" fill="var(--text-dim,#52616a)">Reuse data with context</text></g><path d="M40 315 V237 H90" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M40 315 V237 H90" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0.7s"/><g class="vs-motion sl-reveal" style="animation-delay:1.4s"><rect x="90" y="207" width="250" height="66" rx="3" fill="var(--bg,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="104" y="233" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">AI evaluation</text><text x="104" y="256" text-anchor="start" font-size="12" fill="var(--text-dim,#52616a)">Inspect model inputs</text></g><text x="190" y="496" text-anchor="middle" font-size="14" fill="var(--text-dim,#52616a)">Shared foundation; separate requirements.</text></svg>