<svg class="vital-graphic" xmlns="http://www.w3.org/2000/svg" width="380" height="550" viewBox="0 0 380 550" role="img" aria-labelledby="data-governance-3-m-title data-governance-3-m-desc" style="font-family:var(--font-body,Inter,Arial,sans-serif)"><title id="data-governance-3-m-title">Turn documentation into a working practice</title><desc id="data-governance-3-m-desc">Automation can surface change. Accountable people still decide what the change means and which controls need updating.</desc><style>.sl-flow{stroke-dasharray:1;stroke-dashoffset:0;animation:sl-draw 2.5s ease both}.sl-reveal{animation:sl-reveal 1.2s ease both;transform-box:fill-box;transform-origin:center}@keyframes sl-draw{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}@keyframes sl-reveal{0%{opacity:.12;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.sl-flow,.sl-reveal{animation:none!important}}</style><text x="190" y="25" text-anchor="middle" font-size="12" fill="var(--figure-accent,#174bc5)">A CHANGE SHOULD TRAVEL TO ITS OWNER</text><path d="M85 220 C85 55 295 55 295 220" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M85 220 C85 55 295 55 295 220" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0s"/><path d="M295 220 C295 375 85 375 85 220" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M295 220 C295 375 85 375 85 220" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:1.2s"/><circle cx="85" cy="220" r="44" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="85" y="217" text-anchor="middle" font-size="17" fill="var(--text,#092b3e)">Source</text><text x="85" y="240" text-anchor="middle" font-size="14" fill="var(--text-dim,#52616a)">changes</text><circle cx="295" cy="220" r="44" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="295" y="217" text-anchor="middle" font-size="17" fill="var(--text,#092b3e)">Owner</text><text x="295" y="240" text-anchor="middle" font-size="14" fill="var(--text-dim,#52616a)">reviews</text><g class="vs-motion sl-reveal" style="animation-delay:0.5s"><text x="190" y="95" text-anchor="middle" font-size="16" fill="var(--figure-accent,#174bc5)">Detect + notify</text></g><g class="vs-motion sl-reveal" style="animation-delay:1.6s"><text x="190" y="352" text-anchor="middle" font-size="13" fill="var(--figure-accent,#174bc5)">Update the shared description</text></g><text x="190" y="498" text-anchor="middle" font-size="18" fill="var(--text,#092b3e)">The loop keeps the catalog useful.</text><text x="190" y="522" text-anchor="middle" font-size="13" fill="var(--text-dim,#52616a)">A saved spreadsheet cannot close it by itself.</text></svg>