<svg class="vital-graphic" xmlns="http://www.w3.org/2000/svg" width="820" height="365" viewBox="0 0 820 365" role="img" aria-labelledby="data-governance-5-w-title data-governance-5-w-desc" style="font-family:var(--font-body,Inter,Arial,sans-serif)"><title id="data-governance-5-w-title">Build capability in a useful order</title><desc id="data-governance-5-w-desc">Start with one consequential decision. Prove that its data can be found, understood, and traced before widening the program.</desc><style>.sl-flow{stroke-dasharray:1;stroke-dashoffset:0;animation:sl-draw 2.5s ease both}.sl-reveal{animation:sl-reveal 1.2s ease both;transform-box:fill-box;transform-origin:center}@keyframes sl-draw{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}@keyframes sl-reveal{0%{opacity:.12;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.sl-flow,.sl-reveal{animation:none!important}}</style><path d="M30 272 H208 V217" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><g class="vs-motion sl-reveal" style="animation-delay:0s"><circle cx="55" cy="251" r="20" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="55" y="256" text-anchor="middle" font-size="15" fill="var(--figure-accent,#174bc5)">1</text></g><g class="vs-motion sl-reveal" style="animation-delay:0s"><text x="30" y="307" text-anchor="start" font-size="13" fill="var(--text,#092b3e)">Find one critical dataset</text></g><path d="M225 217 H403 V162" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><g class="vs-motion sl-reveal" style="animation-delay:0.45s"><circle cx="250" cy="196" r="20" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="250" y="201" text-anchor="middle" font-size="15" fill="var(--figure-accent,#174bc5)">2</text></g><g class="vs-motion sl-reveal" style="animation-delay:0.45s"><text x="225" y="252" text-anchor="start" font-size="13" fill="var(--text,#092b3e)">Trace its journey</text></g><path d="M420 162 H598 V107" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><g class="vs-motion sl-reveal" style="animation-delay:0.9s"><circle cx="445" cy="141" r="20" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="445" y="146" text-anchor="middle" font-size="15" fill="var(--figure-accent,#174bc5)">3</text></g><g class="vs-motion sl-reveal" style="animation-delay:0.9s"><text x="420" y="197" text-anchor="start" font-size="13" fill="var(--text,#092b3e)">Keep controls current</text></g><path d="M615 107 H793 V52" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><g class="vs-motion sl-reveal" style="animation-delay:1.35s"><circle cx="640" cy="86" r="20" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="640" y="91" text-anchor="middle" font-size="15" fill="var(--figure-accent,#174bc5)">4</text></g><g class="vs-motion sl-reveal" style="animation-delay:1.35s"><text x="615" y="142" text-anchor="start" font-size="13" fill="var(--text,#092b3e)">Extend into a model</text></g><path d="M50 285 C230 280 480 230 770 72" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M50 285 C230 280 480 230 770 72" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0.2s"/><text x="410" y="355" text-anchor="middle" font-size="16" fill="var(--figure-accent,#174bc5)">Earn the next step with evidence.</text></svg>