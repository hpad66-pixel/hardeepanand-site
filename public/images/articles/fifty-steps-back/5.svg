<svg class="vital-graphic" xmlns="http://www.w3.org/2000/svg" width="820" height="385" viewBox="0 0 820 385" role="img" aria-labelledby="fifty-steps-back-5-w-title fifty-steps-back-5-w-desc" style="font-family:var(--font-body,Inter,Arial,sans-serif)"><title id="fifty-steps-back-5-w-title">The step back makes progress possible</title><desc id="fifty-steps-back-5-w-desc">Fifty and five hundred are metaphors for readiness and progress, not a promised tenfold return.</desc><style>.sl-flow{stroke-dasharray:1;stroke-dashoffset:0;animation:sl-draw 2.5s ease both}.sl-reveal{animation:sl-reveal 1.2s ease both;transform-box:fill-box;transform-origin:center}@keyframes sl-draw{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}@keyframes sl-reveal{0%{opacity:.12;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.sl-flow,.sl-reveal{animation:none!important}}</style><path d="M740 58 C550 10 230 30 115 170 S340 355 520 250 S700 215 775 160" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M740 58 C550 10 230 30 115 170 S340 355 520 250 S700 215 775 160" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0s"/><g class="vs-motion sl-reveal" style="animation-delay:0s"><circle cx="715" cy="61" r="8" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="715" y="36" text-anchor="middle" font-size="18" fill="var(--text,#092b3e)">Pause</text></g><g class="vs-motion sl-reveal" style="animation-delay:0.7s"><circle cx="125" cy="155" r="8" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="125" y="195" text-anchor="middle" font-size="18" fill="var(--text,#092b3e)">Understand</text></g><g class="vs-motion sl-reveal" style="animation-delay:1.4s"><circle cx="440" cy="294" r="8" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="440" y="269" text-anchor="middle" font-size="18" fill="var(--text,#092b3e)">Test + learn</text></g><g class="vs-motion sl-reveal" style="animation-delay:2s"><text x="620" y="335" text-anchor="middle" font-size="22" fill="var(--figure-accent,#174bc5)">Move forward on firmer ground.</text></g></svg>