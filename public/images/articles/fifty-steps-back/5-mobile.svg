<svg class="vital-graphic" xmlns="http://www.w3.org/2000/svg" width="380" height="490" viewBox="0 0 380 490" role="img" aria-labelledby="fifty-steps-back-5-m-title fifty-steps-back-5-m-desc" style="font-family:var(--font-body,Inter,Arial,sans-serif)"><title id="fifty-steps-back-5-m-title">The step back makes progress possible</title><desc id="fifty-steps-back-5-m-desc">Fifty and five hundred are metaphors for readiness and progress, not a promised tenfold return.</desc><style>.sl-flow{stroke-dasharray:1;stroke-dashoffset:0;animation:sl-draw 2.5s ease both}.sl-reveal{animation:sl-reveal 1.2s ease both;transform-box:fill-box;transform-origin:center}@keyframes sl-draw{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}@keyframes sl-reveal{0%{opacity:.12;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.sl-flow,.sl-reveal{animation:none!important}}</style><path d="M320 65 C150 20 40 125 65 235 S260 420 325 310" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M320 65 C150 20 40 125 65 235 S260 420 325 310" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0s"/><g class="vs-motion sl-reveal" style="animation-delay:0s"><circle cx="300" cy="65" r="8" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="300" y="40" text-anchor="middle" font-size="18" fill="var(--text,#092b3e)">Pause</text></g><g class="vs-motion sl-reveal" style="animation-delay:0.7s"><circle cx="66" cy="235" r="8" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="66" y="275" text-anchor="middle" font-size="18" fill="var(--text,#092b3e)">Understand</text></g><g class="vs-motion sl-reveal" style="animation-delay:1.4s"><circle cx="240" cy="380" r="8" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="240" y="355" text-anchor="middle" font-size="18" fill="var(--text,#092b3e)">Test + learn</text></g><g class="vs-motion sl-reveal" style="animation-delay:2s"><text x="190" y="460" text-anchor="middle" font-size="19" fill="var(--figure-accent,#174bc5)">Move forward on firmer ground.</text></g></svg>