<svg class="vital-graphic" xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390" role="img" aria-labelledby="fifty-steps-back-1-w-title fifty-steps-back-1-w-desc" style="font-family:var(--font-body,Inter,Arial,sans-serif)"><title id="fifty-steps-back-1-w-title">Read the pressures together</title><desc id="fifty-steps-back-1-w-desc">These pressures interact. This is a conceptual map, not a quantified forecast or a ranking of risks.</desc><style>.sl-flow{stroke-dasharray:1;stroke-dashoffset:0;animation:sl-draw 2.5s ease both}.sl-reveal{animation:sl-reveal 1.2s ease both;transform-box:fill-box;transform-origin:center}@keyframes sl-draw{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}@keyframes sl-reveal{0%{opacity:.12;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.sl-flow,.sl-reveal{animation:none!important}}</style><path d="M130 85 L410 195" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M130 85 L410 195" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0s"/><text x="130" y="65" text-anchor="middle" font-size="18" fill="var(--text,#092b3e)">Investment needs</text><path d="M690 85 L410 195" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M690 85 L410 195" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0.4s"/><text x="690" y="65" text-anchor="middle" font-size="18" fill="var(--text,#092b3e)">New obligations</text><path d="M410 310 L410 195" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M410 310 L410 195" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0.8s"/><text x="410" y="330" text-anchor="middle" font-size="18" fill="var(--text,#092b3e)">Knowledge loss</text><circle cx="410" cy="195" r="85" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="410" y="179" text-anchor="middle" font-size="19" fill="var(--text,#092b3e)">The same</text><text x="410" y="205" text-anchor="middle" font-size="19" fill="var(--text,#092b3e)">operating team</text><text x="410" y="234" text-anchor="middle" font-size="12" fill="var(--text-dim,#52616a)">Finite time + attention</text><g class="vs-motion sl-reveal" style="animation-delay:1.4s"><text x="410" y="385" text-anchor="middle" font-size="14" fill="var(--figure-accent,#174bc5)">Pressures converge. Capacity does not automatically grow.</text></g></svg>