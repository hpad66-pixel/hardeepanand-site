<svg class="vital-graphic" xmlns="http://www.w3.org/2000/svg" width="380" height="570" viewBox="0 0 380 570" role="img" aria-labelledby="fifty-steps-back-3-m-title fifty-steps-back-3-m-desc" style="font-family:var(--font-body,Inter,Arial,sans-serif)"><title id="fifty-steps-back-3-m-title">Understand before handing over control</title><desc id="fifty-steps-back-3-m-desc">A supervised pilot can expose data gaps. Expanding autonomy requires evidence that the process and its limits are understood.</desc><style>.sl-flow{stroke-dasharray:1;stroke-dashoffset:0;animation:sl-draw 2.5s ease both}.sl-reveal{animation:sl-reveal 1.2s ease both;transform-box:fill-box;transform-origin:center}@keyframes sl-draw{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}@keyframes sl-reveal{0%{opacity:.12;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.sl-flow,.sl-reveal{animation:none!important}}</style><path d="M190 49 A86 86 0 1 1 189 49" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M190 49 A86 86 0 1 1 189 49" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0s"/><text x="190" y="125" text-anchor="middle" font-size="22" fill="var(--text,#092b3e)">Supervised</text><text x="190" y="153" text-anchor="middle" font-size="22" fill="var(--text,#092b3e)">pilot</text><text x="190" y="180" text-anchor="middle" font-size="12" fill="var(--text-dim,#52616a)">Learn · test · compare</text><path d="M190 221 V300" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M190 221 V300" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:1s"/><path d="M40 300 V442" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="4" stroke-linecap="round" /><g class="vs-motion sl-reveal" style="animation-delay:1.4s"><text x="58" y="325" text-anchor="start" font-size="12" fill="var(--figure-accent,#174bc5)">EVIDENCE GATE</text><text x="58" y="358" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">Reliable inputs</text><text x="58" y="386" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">Known operating limits</text><text x="58" y="414" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">Human override</text></g><g class="vs-motion sl-reveal" style="animation-delay:2.2s"><text x="190" y="510" text-anchor="middle" font-size="18" fill="var(--text,#092b3e)">Expand carefully</text><text x="190" y="534" text-anchor="middle" font-size="13" fill="var(--text-dim,#52616a)">Keep the ability to stop.</text></g></svg>