<svg class="vital-graphic" xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="fifty-steps-back-4-w-title fifty-steps-back-4-w-desc" style="font-family:var(--font-body,Inter,Arial,sans-serif)"><title id="fifty-steps-back-4-w-title">Identity comes before prediction</title><desc id="fifty-steps-back-4-w-desc">Two pumps of the same model remain separate assets. Standard names and verified identities prevent their histories from being confused.</desc><style>.sl-flow{stroke-dasharray:1;stroke-dashoffset:0;animation:sl-draw 2.5s ease both}.sl-reveal{animation:sl-reveal 1.2s ease both;transform-box:fill-box;transform-origin:center}@keyframes sl-draw{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}@keyframes sl-reveal{0%{opacity:.12;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.sl-flow,.sl-reveal{animation:none!important}}</style><text x="410" y="24" text-anchor="middle" font-size="14" fill="var(--figure-accent,#174bc5)">LINK ALIASES. DO NOT MERGE DIFFERENT PUMPS.</text><rect x="30" y="65" width="190" height="66" rx="3" fill="var(--bg,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="44" y="91" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">Pump 3A</text><text x="44" y="114" text-anchor="start" font-size="12" fill="var(--text-dim,#52616a)">Local name</text><rect x="30" y="145" width="190" height="66" rx="3" fill="var(--bg,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="44" y="171" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">P-03</text><text x="44" y="194" text-anchor="start" font-size="12" fill="var(--text-dim,#52616a)">Work-order name</text><path d="M220 98 H465 V139 H485" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M220 98 H465 V139 H485" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0s"/><path d="M220 178 H465 V139 H485" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M220 178 H465 V139 H485" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0.2s"/><g class="vs-motion sl-reveal" style="animation-delay:0.6s"><rect x="485" y="105" width="300" height="66" rx="3" fill="var(--bg,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="499" y="131" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">Plant A / asset 017</text><text x="499" y="154" text-anchor="start" font-size="12" fill="var(--text-dim,#52616a)">Unique identity · same pump model</text></g><rect x="30" y="245" width="190" height="66" rx="3" fill="var(--bg,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="44" y="271" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">Pump B2</text><text x="44" y="294" text-anchor="start" font-size="12" fill="var(--text-dim,#52616a)">Local name</text><rect x="30" y="325" width="190" height="66" rx="3" fill="var(--bg,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="44" y="351" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">PUMP-02</text><text x="44" y="374" text-anchor="start" font-size="12" fill="var(--text-dim,#52616a)">Work-order name</text><path d="M220 278 H465 V319 H485" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M220 278 H465 V319 H485" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0.6s"/><path d="M220 358 H465 V319 H485" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M220 358 H465 V319 H485" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0.8s"/><g class="vs-motion sl-reveal" style="animation-delay:1.2s"><rect x="485" y="285" width="300" height="66" rx="3" fill="var(--bg,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="499" y="311" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">Plant B / asset 042</text><text x="499" y="334" text-anchor="start" font-size="12" fill="var(--text-dim,#52616a)">Unique identity · same pump model</text></g><text x="410" y="428" text-anchor="middle" font-size="18" fill="var(--figure-accent,#174bc5)">Same model ≠ same physical asset.</text></svg>