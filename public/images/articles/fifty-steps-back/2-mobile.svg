" y="246" width="300" height="66" rx="3" fill="var(--bg,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="54" y="272" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">Why did we act?</text><text x="54" y="295" text-anchor="start" font-size="12" fill="var(--text-dim,#52616a)">Reasoning behind the response</text></g><g class="vs-motion sl-reveal" style="animation-delay:1.3s"><rect x="40" y="324" width="300" height="66" rx="3" fill="var(--bg,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="54" y="350" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">What happened next?</text><text x="54" y="373" text-anchor="start" font-size="12" fill="var(--text-dim,#52616a)">Outcome and limits</text></g><path d="M190 390 V450" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M190 390 V450" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:1.7s"/><g class="vs-motion sl-reveal" style="animation-delay:2s"><circle cx="190" cy="493" r="43" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="190" y="489" text-anchor="middle" font-size="16" fill="var(--text,#092b3e)">Next</text><text x="190" y="512" text-anchor="middle" font-size="14" fill="var(--text-dim,#52616a)">operator</text></g></svg>