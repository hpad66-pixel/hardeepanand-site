<svg class="vital-graphic" xmlns="http://www.w3.org/2000/svg" width="380" height="520" viewBox="0 0 380 520" role="img" aria-labelledby="fifty-steps-back-1-m-title fifty-steps-back-1-m-desc" style="font-family:var(--font-body,Inter,Arial,sans-serif)"><title id="fifty-steps-back-1-m-title">Read the pressures together</title><desc id="fifty-steps-back-1-m-desc">These pressures interact. This is a conceptual map, not a quantified forecast or a ranking of risks.</desc><style>.sl-flow{stroke-dasharray:1;stroke-dashoffset:0;animation:sl-draw 2.5s ease both}.sl-reveal{animation:sl-reveal 1.2s ease both;transform-box:fill-box;transform-origin:center}@keyframes sl-draw{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}@keyframes sl-reveal{0%{opacity:.12;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.sl-flow,.sl-reveal{animation:none!important}}</style><path d="M190 65 L190 255" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M190 65 L190 255" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0s"/><text x="190" y="45" text-anchor="middle" font-size="14" fill="var(--text,#092b3e)">Investment needs</text><path d="M90 405 L190 255" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M90 405 L190 255" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0.4s"/><text x="90" y="425" text-anchor="middle" font-size="14" fill="var(--text,#092b3e)">New obligations</text><path d="M290 405 L190 255" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M290 405 L190 255" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0.8s"/><text x="290" y="425" text-anchor="middle" font-size="14" fill="var(--text,#092b3e)">Knowledge loss</text><circle cx="190" cy="255" r="75" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="190" y="239" text-anchor="middle" font-size="19" fill="var(--text,#092b3e)">The same</text><text x="190" y="265" text-anchor="middle" font-size="19" fill="var(--text,#092b3e)">operating team</text><text x="190" y="294" text-anchor="middle" font-size="12" fill="var(--text-dim,#52616a)">Finite time + attention</text><g class="vs-motion sl-reveal" style="animation-delay:1.4s"><text x="190" y="510" text-anchor="middle" font-size="11" fill="var(--figure-accent,#174bc5)">Pressures converge. Capacity does not automatically grow.</text></g></svg>