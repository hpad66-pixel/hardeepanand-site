<svg class="vital-graphic" xmlns="http://www.w3.org/2000/svg" width="380" height="660" viewBox="0 0 380 660" role="img" aria-labelledby="fifty-steps-back-4-m-title fifty-steps-back-4-m-desc" style="font-family:var(--font-body,Inter,Arial,sans-serif)"><title id="fifty-steps-back-4-m-title">Identity comes before prediction</title><desc id="fifty-steps-back-4-m-desc">Two pumps of the same model remain separate assets. Standard names and verified identities prevent their histories from being confused.</desc><style>.sl-flow{stroke-dasharray:1;stroke-dashoffset:0;animation:sl-draw 2.5s ease both}.sl-reveal{animation:sl-reveal 1.2s ease both;transform-box:fill-box;transform-origin:center}@keyframes sl-draw{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}@keyframes sl-reveal{0%{opacity:.12;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.sl-flow,.sl-reveal{animation:none!important}}</style><text x="190" y="24" text-anchor="middle" font-size="11" fill="var(--figure-accent,#174bc5)">LINK ALIASES. DO NOT MERGE DIFFERENT PUMPS.</text><rect x="18" y="65" width="155" height="66" rx="3" fill="var(--bg,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="32" y="91" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">Pump 3A</text><text x="32" y="114" text-anchor="start" font-size="12" fill="var(--text-dim,#52616a)">Local name</text><rect x="18" y="145" width="155" height="66" rx="3" fill="var(--bg,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="32" y="171" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">P-03</text><text x="32" y="194" text-anchor="start" font-size="12" fill="var(--text-dim,#52616a)">Work-order name</text><path d="M173 98 H190 V139 H210" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M173 98 H190 V139 H210" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0s"/><path d="M173 178 H190 V139 H210" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M173 178 H190 V139 H210" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0.2s"/><g class="vs-motion sl-reveal" style="animation-delay:0.6s"><rect x="210" y="105" width="155" height="66" rx="3" fill="var(--bg,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="224" y="131" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">Asset 017</text><text x="224" y="154" text-anchor="start" font-size="12" fill="var(--text-dim,#52616a)">Plant A · same model</text></g><text x="190" y="275" text-anchor="middle" font-size="12" fill="var(--text-dim,#52616a)">Keep plant A’s history attached to its own asset.</text><rect x="18" y="345" width="155" height="66" rx="3" fill="var(--bg,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="32" y="371" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">Pump B2</text><text x="32" y="394" text-anchor="start" font-size="12" fill="var(--text-dim,#52616a)">Local name</text><rect x="18" y="425" width="155" height="66" rx="3" fill="var(--bg,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="32" y="451" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">PUMP-02</text><text x="32" y="474" text-anchor="start" font-size="12" fill="var(--text-dim,#52616a)">Work-order name</text><path d="M173 378 H190 V419 H210" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M173 378 H190 V419 H210" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0.6s"/><path d="M173 458 H190 V419 H210" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" /><path d="M173 458 H190 V419 H210" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" pathLength="1" class="vs-motion sl-flow" style="animation-delay:0.8s"/><g class="vs-motion sl-reveal" style="animation-delay:1.2s"><rect x="210" y="385" width="155" height="66" rx="3" fill="var(--bg,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="224" y="411" text-anchor="start" font-size="16" fill="var(--text,#092b3e)">Asset 042</text><text x="224" y="434" text-anchor="start" font-size="12" fill="var(--text-dim,#52616a)">Plant B · same model</text></g><text x="190" y="555" text-anchor="middle" font-size="12" fill="var(--text-dim,#52616a)">Keep plant B’s history attached to its own asset.</text><text x="190" y="648" text-anchor="middle" font-size="16" fill="var(--figure-accent,#174bc5)">Same model ≠ same physical asset.</text></svg>