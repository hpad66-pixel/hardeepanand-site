<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 275" role="img" aria-labelledby="resilience-chain-wide-title resilience-chain-wide-desc" style="font-family:Inter,Arial,sans-serif"><title id="resilience-chain-wide-title">Strengthening the shared handoff</title><desc id="resilience-chain-wide-desc">Five interlocking links represent data, AI, handoffs, resources, and recovery. In the original view, the cobalt handoff link has a gap; the supported view closes it. It represents an unclear responsibility between teams, not an individual at fault. Agreeing an owner and a witnessed check strengthens this connection; every other link still needs care. Conceptual illustration, not a measured resilience score.</desc><g class="chain-link  " transform="translate(110 120) rotate(23) scale(1)" fill="none" stroke="var(--text,#092b3e)" stroke-width="7" stroke-linecap="round"><rect x="-85" y="-30" width="170" height="60" rx="30"/></g><g text-anchor="middle" transform="translate(110 225)"><text font-size="16" font-weight="600" fill="var(--text,#092b3e)">Data</text><text y="22" font-size="12" fill="var(--text-dim,#52616a)">Trusted sources</text></g><g class="chain-link  " transform="translate(265 120) rotate(-23) scale(1)" fill="none" stroke="var(--text,#092b3e)" stroke-width="7" stroke-linecap="round"><rect x="-85" y="-30" width="170" height="60" rx="30"/></g><g text-anchor="middle" transform="translate(265 26)"><text font-size="16" font-weight="600" fill="var(--text,#092b3e)">AI</text><text y="22" font-size="12" fill="var(--text-dim,#52616a)">Bounded permissions</text></g><g class="chain-link chain-weak " transform="translate(420 120) rotate(23) scale(1)" fill="none" stroke="var(--chain-blue,#174bc5)" stroke-width="7" stroke-linecap="round"><path d="M-44-30 H36 M70-25 A30 30 0 0 1 55 30 H-55 A30 30 0 0 1-55-30 H-44"/><path class="chain-repair" d="M36-30 H55 A30 30 0 0 1 70-25" pathLength="1"/></g><g text-anchor="middle" transform="translate(420 225)"><text font-size="16" font-weight="600" fill="var(--chain-blue,#174bc5)">Handoffs</text><text y="22" font-size="12" fill="var(--text-dim,#52616a)">Shared ownership</text></g><g class="chain-link  chain-beyond" transform="translate(575 120) rotate(-23) scale(1)" fill="none" stroke="var(--text,#092b3e)" stroke-width="7" stroke-linecap="round"><rect x="-85" y="-30" width="170" height="60" rx="30"/></g><g text-anchor="middle" transform="translate(575 26)"><text font-size="16" font-weight="600" fill="var(--text,#092b3e)">Resources</text><text y="22" font-size="12" fill="var(--text-dim,#52616a)">Money + time</text></g><g class="chain-link  chain-beyond" transform="translate(730 120) rotate(23) scale(1)" fill="none" stroke="var(--text,#092b3e)" stroke-width="7" stroke-linecap="round"><rect x="-85" y="-30" width="170" height="60" rx="30"/></g><g text-anchor="middle" transform="translate(730 225)"><text font-size="16" font-weight="600" fill="var(--text,#092b3e)">Recovery</text><text y="22" font-size="12" fill="var(--text-dim,#52616a)">Practiced together</text></g></svg>
