<svg xmlns="http://www.w3.org/2000/svg" class="vital-graphic" width="380" height="590" viewBox="0 0 380 590" role="img" aria-labelledby="sc-open-the-gate-m-title sc-open-the-gate-m-desc"><title id="sc-open-the-gate-m-title">A list is a start. Closing the loop is the work.</title><desc id="sc-open-the-gate-m-desc">A written question moves through a gate to a completed action. Completion can mean doing the work, asking for help, or deliberately letting go.</desc><style>.sc-draw{stroke-dasharray:1;animation:sc-line 2.8s ease both}.sc-reveal{animation:sc-arrive 1.1s ease both;transform-box:fill-box;transform-origin:center}@keyframes sc-line{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes sc-arrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.sc-draw,.sc-reveal{animation:none!important}}</style><path d="M52 35 h126 v140 h-126 Z" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M76 69 h70 M76 97 h53 M76 125 h80" fill="none" stroke="var(--text,#092b3e)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="115" y="203" text-anchor="middle" font-size="22" fill="var(--text,#092b3e)" style="font-family:var(--font-display,Georgia,serif)">Write it.</text><path d="M205 359 V246 h84 v113" fill="none" stroke="var(--text,#092b3e)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g class="vs-motion sc-reveal" style="animation-delay:0.9s"><path d="M209 250 l58 -23 v112 l-58 17 Z" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="248" cy="293" r="3" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/></g><text x="245" y="397" text-anchor="middle" font-size="18" fill="var(--text,#092b3e)" style="font-family:var(--font-display,Georgia,serif)">Work through it.</text><path d="M178 105 C340 105 165 210 205 310 M289 310 C370 350 350 450 149 489" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M178 105 C340 105 165 210 205 310 M289 310 C370 350 350 450 149 489" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion sc-draw" style="animation-delay:0.5s"/><g class="vs-motion sc-reveal" style="animation-delay:2s"><circle cx="125" cy="489" r="25" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><path d="M113 489 l8 9 17 -22" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="125" y="551" text-anchor="middle" font-size="22" fill="var(--figure-accent,#174bc5)" style="font-family:var(--font-display,Georgia,serif)">Close it.</text></g></svg>