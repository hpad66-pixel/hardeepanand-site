<svg xmlns="http://www.w3.org/2000/svg" class="vital-graphic" width="820" height="385" viewBox="0 0 820 385" role="img" aria-labelledby="sc-open-the-gate-w-title sc-open-the-gate-w-desc"><title id="sc-open-the-gate-w-title">A list is a start. Closing the loop is the work.</title><desc id="sc-open-the-gate-w-desc">A written question moves through a gate to a completed action. Completion can mean doing the work, asking for help, or deliberately letting go.</desc><style>.sc-draw{stroke-dasharray:1;animation:sc-line 2.8s ease both}.sc-reveal{animation:sc-arrive 1.1s ease both;transform-box:fill-box;transform-origin:center}@keyframes sc-line{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes sc-arrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.sc-draw,.sc-reveal{animation:none!important}}</style><path d="M76 67 h148 v140 h-148 Z" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M100 101 h70 M100 129 h53 M100 157 h80" fill="none" stroke="var(--text,#092b3e)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="150" y="235" text-anchor="middle" font-size="22" fill="var(--text,#092b3e)" style="font-family:var(--font-display,Georgia,serif)">Write it.</text><path d="M375 208 V95 h84 v113" fill="none" stroke="var(--text,#092b3e)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g class="vs-motion sc-reveal" style="animation-delay:0.9s"><path d="M379 99 l58 -23 v112 l-58 17 Z" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="418" cy="142" r="3" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/></g><text x="415" y="246" text-anchor="middle" font-size="22" fill="var(--text,#092b3e)" style="font-family:var(--font-display,Georgia,serif)">Work through it.</text><path d="M226 151 H369 M463 151 H689" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M226 151 H369 M463 151 H689" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion sc-draw" style="animation-delay:0.5s"/><g class="vs-motion sc-reveal" style="animation-delay:2s"><circle cx="717" cy="151" r="25" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><path d="M705 151 l8 9 17 -22" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="717" y="213" text-anchor="middle" font-size="22" fill="var(--figure-accent,#174bc5)" style="font-family:var(--font-display,Georgia,serif)">Close it.</text></g><text x="410" y="350" text-anchor="middle" font-size="18" fill="var(--text-dim,#52616a)" style="font-family:var(--font-display,Georgia,serif)">Done. Delegated with a handoff. Or deliberately released.</text></svg>