<svg xmlns="http://www.w3.org/2000/svg" class="vital-graphic" width="820" height="340" viewBox="0 0 820 340" role="img" aria-labelledby="sc-leave-the-loop-w-title sc-leave-the-loop-w-desc"><title id="sc-leave-the-loop-w-title">Give the thought a way out.</title><desc id="sc-leave-the-loop-w-desc">A looping line opens into a deliberate next action. The drawing illustrates a choice about attention, not a medical claim.</desc><style>.sc-draw{stroke-dasharray:1;animation:sc-line 2.8s ease both}.sc-reveal{animation:sc-arrive 1.1s ease both;transform-box:fill-box;transform-origin:center}@keyframes sc-line{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes sc-arrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.sc-draw,.sc-reveal{animation:none!important}}</style><path d="M223 164 C270 97 111 83 134 176 S350 251 324 125 S65 43 86 193 S375 294 358 144" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M223 164 C270 97 111 83 134 176 S350 251 324 125 S65 43 86 193 S375 294 358 144" fill="none" stroke="var(--text,#092b3e)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion sc-draw"/><text x="205" y="168" text-anchor="middle" font-size="22" fill="var(--text,#092b3e)" style="font-family:var(--font-display,Georgia,serif)">What if…</text><path d="M358 144 C373 5 438 256 526 178 S662 117 758 152" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M358 144 C373 5 438 256 526 178 S662 117 758 152" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion sc-draw" style="animation-delay:0.8s"/><g class="vs-motion sc-reveal" style="animation-delay:2.1s"><circle cx="764" cy="153" r="13" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><path d="M758 153 l4 5 8 -10" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="654" y="262" text-anchor="middle" font-size="25" fill="var(--figure-accent,#174bc5)" style="font-family:var(--font-display,Georgia,serif)">One useful next action.</text></g><text x="206" y="304" text-anchor="middle" font-size="17" fill="var(--text-dim,#52616a)" style="font-family:var(--font-display,Georgia,serif)">Thinking can circle.</text></svg>