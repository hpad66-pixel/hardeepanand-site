<svg xmlns="http://www.w3.org/2000/svg" class="vital-graphic" width="380" height="490" viewBox="0 0 380 490" role="img" aria-labelledby="sc-leave-the-loop-m-title sc-leave-the-loop-m-desc"><title id="sc-leave-the-loop-m-title">Give the thought a way out.</title><desc id="sc-leave-the-loop-m-desc">A looping line opens into a deliberate next action. The drawing illustrates a choice about attention, not a medical claim.</desc><style>.sc-draw{stroke-dasharray:1;animation:sc-line 2.8s ease both}.sc-reveal{animation:sc-arrive 1.1s ease both;transform-box:fill-box;transform-origin:center}@keyframes sc-line{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes sc-arrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.sc-draw,.sc-reveal{animation:none!important}}</style><path d="M190 154 C237 87 78 73 101 166 S317 241 291 115 S32 33 53 183 S342 284 325 134" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M190 154 C237 87 78 73 101 166 S317 241 291 115 S32 33 53 183 S342 284 325 134" fill="none" stroke="var(--text,#092b3e)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion sc-draw"/><text x="172" y="158" text-anchor="middle" font-size="22" fill="var(--text,#092b3e)" style="font-family:var(--font-display,Georgia,serif)">What if…</text><path d="M325 134 C365 298 60 247 111 368 Q140 401 263 392" fill="none" stroke="var(--line,#d4d9d7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M325 134 C365 298 60 247 111 368 Q140 401 263 392" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion sc-draw" style="animation-delay:0.8s"/><g class="vs-motion sc-reveal" style="animation-delay:2.1s"><circle cx="281" cy="392" r="13" fill="var(--bg,#f5f3ed)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><path d="M275 392 l4 5 8 -10" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="192" y="452" text-anchor="middle" font-size="22" fill="var(--figure-accent,#174bc5)" style="font-family:var(--font-display,Georgia,serif)">One useful next action.</text></g></svg>