<svg id="hc-utility-m" class="systems-graphic head-clouds-graphic" xmlns="http://www.w3.org/2000/svg" width="380" height="690" viewBox="0 0 380 690" role="img" aria-labelledby="hc-utility-m-title hc-utility-m-desc" style="font-family:var(--font-body,Inter,Arial,sans-serif)"><style>
.hc-draw{stroke-dasharray:1;stroke-dashoffset:0;animation:hc-draw 3.4s ease both}
.hc-reveal{opacity:1;animation:hc-reveal .9s ease both;transform-box:fill-box;transform-origin:center}
.hc-pulse{animation:hc-pulse 3.8s ease both;transform-box:fill-box;transform-origin:center}
.hc-soft{stroke:var(--line,#d4d9d7)}
@keyframes hc-draw{0%,12%{stroke-dashoffset:1}82%,100%{stroke-dashoffset:0}}
@keyframes hc-reveal{0%{opacity:.08;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes hc-pulse{0%{opacity:.45;transform:scale(.98)}35%,100%{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.vs-motion{animation:none!important}}
</style><title id="hc-utility-m-title">Utility source-to-decision path</title><desc id="hc-utility-m-desc">A conceptual utility diagram following scattered records into a source packet, authority check, and owned pump-station decision.</desc><defs><marker id="hc-utility-m-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--figure-accent,#174bc5)"/></marker></defs><g class="vs-motion hc-reveal" style="animation-delay:0s"><rect x="42" y="34" width="296" height="96" rx="17" fill="var(--surface,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="190" y="75" font-size="22" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Scattered records</text><text x="190" y="104" font-size="14" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">work orders · notes · capital plan</text></g><path d="M190 136 V178" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:0.35s" marker-end="url(#hc-utility-m-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:0.55s"><rect x="42" y="184" width="296" height="96" rx="17" fill="var(--figure-tint,#edf2f3)" stroke="var(--figure-accent,#174bc5)"/><text x="190" y="225" font-size="22" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Source packet</text><text x="190" y="254" font-size="14" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">what is missing and who owns it</text></g><path d="M190 286 V328" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:0.9s" marker-end="url(#hc-utility-m-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:1.1s"><rect x="42" y="334" width="296" height="96" rx="17" fill="var(--surface,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="190" y="375" font-size="22" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Authority check</text><text x="190" y="404" font-size="14" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">who can act and explain why</text></g><path d="M190 436 V478" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:1.4500000000000002s" marker-end="url(#hc-utility-m-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:1.6500000000000001s"><rect x="42" y="484" width="296" height="108" rx="17" fill="var(--figure-tint,#edf2f3)" stroke="var(--figure-accent,#174bc5)"/><text x="190" y="525" font-size="22" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Better decision</text><text x="190" y="554" font-size="14" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">clear enough for someone to own</text></g></svg>
