<svg id="hc-adapt-m" class="systems-graphic head-clouds-graphic" xmlns="http://www.w3.org/2000/svg" width="380" height="690" viewBox="0 0 380 690" role="img" aria-labelledby="hc-adapt-m-title hc-adapt-m-desc" style="font-family:var(--font-body,Inter,Arial,sans-serif)"><style>
.hc-draw{stroke-dasharray:1;stroke-dashoffset:0;animation:hc-draw 3.4s ease both}
.hc-reveal{opacity:1;animation:hc-reveal .9s ease both;transform-box:fill-box;transform-origin:center}
.hc-pulse{animation:hc-pulse 3.8s ease both;transform-box:fill-box;transform-origin:center}
.hc-soft{stroke:var(--line,#d4d9d7)}
@keyframes hc-draw{0%,12%{stroke-dashoffset:1}82%,100%{stroke-dashoffset:0}}
@keyframes hc-reveal{0%{opacity:.08;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes hc-pulse{0%{opacity:.45;transform:scale(.98)}35%,100%{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.vs-motion{animation:none!important}}
</style><title id="hc-adapt-m-title">Responsible adaptation loop</title><desc id="hc-adapt-m-desc">A conceptual feedback loop showing discomfort, source checking, practice, correction, and modeled learning.</desc><defs><marker id="hc-adapt-m-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--figure-accent,#174bc5)"/></marker></defs><g class="vs-motion hc-reveal" style="animation-delay:0s"><rect x="48" y="30" width="284" height="82" rx="16" fill="var(--surface,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="190" y="64" font-size="21" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Discomfort</text><text x="190" y="90" font-size="14" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">the old way strains</text></g><path d="M190 114 V150" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:0.25s" marker-end="url(#hc-adapt-m-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:0.45s"><rect x="48" y="154" width="284" height="82" rx="16" fill="var(--surface,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="190" y="188" font-size="21" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Check sources</text><text x="190" y="214" font-size="14" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">no source, no trust</text></g><path d="M190 238 V274" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:0.7s" marker-end="url(#hc-adapt-m-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:0.9s"><rect x="48" y="278" width="284" height="82" rx="16" fill="var(--surface,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="190" y="312" font-size="21" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Practice</text><text x="190" y="338" font-size="14" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">use the tool carefully</text></g><path d="M190 362 V398" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:1.15s" marker-end="url(#hc-adapt-m-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:1.35s"><rect x="48" y="402" width="284" height="82" rx="16" fill="var(--surface,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="190" y="436" font-size="21" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Correct</text><text x="190" y="462" font-size="14" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">change the workflow</text></g><path d="M190 486 V522" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:1.6s" marker-end="url(#hc-adapt-m-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:1.8s"><rect x="48" y="526" width="284" height="82" rx="16" fill="var(--figure-tint,#edf2f3)" stroke="var(--figure-accent,#174bc5)"/><text x="190" y="560" font-size="21" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Model learning</text><text x="190" y="586" font-size="14" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">before asking for it</text></g></svg>
