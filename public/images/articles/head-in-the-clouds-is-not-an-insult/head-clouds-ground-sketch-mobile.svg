<svg id="hc-ground-m" class="systems-graphic head-clouds-graphic" xmlns="http://www.w3.org/2000/svg" width="380" height="630" viewBox="0 0 380 630" role="img" aria-labelledby="hc-ground-m-title hc-ground-m-desc" style="font-family:var(--font-body,Inter,Arial,sans-serif)"><style>
.hc-draw{stroke-dasharray:1;stroke-dashoffset:0;animation:hc-draw 3.4s ease both}
.hc-reveal{opacity:1;animation:hc-reveal .9s ease both;transform-box:fill-box;transform-origin:center}
.hc-pulse{animation:hc-pulse 3.8s ease both;transform-box:fill-box;transform-origin:center}
.hc-soft{stroke:var(--line,#d4d9d7)}
@keyframes hc-draw{0%,12%{stroke-dashoffset:1}82%,100%{stroke-dashoffset:0}}
@keyframes hc-reveal{0%{opacity:.08;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes hc-pulse{0%{opacity:.45;transform:scale(.98)}35%,100%{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.vs-motion{animation:none!important}}
</style><title id="hc-ground-m-title">Vision returning to ground-level utility work</title><desc id="hc-ground-m-desc">Conceptual illustration showing vision tested by evidence, people, authority, records, and an owned decision.</desc><defs><marker id="hc-ground-m-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--figure-accent,#174bc5)"/></marker></defs><g class="vs-motion hc-reveal" style="animation-delay:0s"><path d="M75 86 C50 56 91 30 126 50 C145 14 205 26 208 67 C250 58 282 96 258 126 H80 C48 126 48 98 75 86 Z" fill="color-mix(in srgb, var(--figure-accent,#174bc5) 13%, transparent)" stroke="var(--figure-accent,#174bc5)" stroke-width="2.4"/><text x="168" y="82" font-size="32" fill="var(--figure-accent,#174bc5)" text-anchor="middle" font-weight="500" style="font-family:var(--font-display,'Newsreader',Georgia,serif);letter-spacing:0">Vision</text><text x="168" y="112" font-size="13" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">what the system could become</text></g><path d="M168 132 V168" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:0.35s" marker-end="url(#hc-ground-m-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:0.6s"><rect x="50" y="172" width="280" height="134" rx="14" fill="var(--surface,#f5f3ed)" stroke="var(--figure-accent,#174bc5)"/><text x="190" y="207" font-size="22" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="400" style="font-family:var(--font-display,'Newsreader',Georgia,serif);letter-spacing:0">Ground test<tspan x="190" dy="26">evidence · people</tspan><tspan x="190" dy="26">authority</tspan></text><text x="190" y="291" font-size="13" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">not just a speech</text></g><path d="M190 314 V342" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:1s" marker-end="url(#hc-ground-m-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:1.25s"><rect x="48" y="352" width="284" height="70" rx="14" fill="color-mix(in srgb, var(--bg,#f5f3ed) 88%, var(--figure-accent,#174bc5) 12%)" stroke="var(--line,#d4d9d7)"/><text x="190" y="382" font-size="20" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Records</text><text x="190" y="406" font-size="13" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">what can be traced</text></g><path d="M190 430 V440" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:1.25s" marker-end="url(#hc-ground-m-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:1.5s"><rect x="48" y="450" width="284" height="70" rx="14" fill="color-mix(in srgb, var(--bg,#f5f3ed) 88%, var(--figure-accent,#174bc5) 12%)" stroke="var(--line,#d4d9d7)"/><text x="190" y="480" font-size="20" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">People</text><text x="190" y="504" font-size="13" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">who carries judgment</text></g><path d="M190 528 V538" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:1.5s" marker-end="url(#hc-ground-m-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:1.75s"><rect x="48" y="548" width="284" height="70" rx="14" fill="color-mix(in srgb, var(--bg,#f5f3ed) 88%, var(--figure-accent,#174bc5) 12%)" stroke="var(--line,#d4d9d7)"/><text x="190" y="578" font-size="20" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Decision</text><text x="190" y="602" font-size="13" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">what someone owns</text></g></svg>
