<svg id="hc-adapt-w" class="systems-graphic head-clouds-graphic" xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img" aria-labelledby="hc-adapt-w-title hc-adapt-w-desc" style="font-family:var(--font-body,Inter,Arial,sans-serif)"><style>
.hc-draw{stroke-dasharray:1;stroke-dashoffset:0;animation:hc-draw 3.4s ease both}
.hc-reveal{opacity:1;animation:hc-reveal .9s ease both;transform-box:fill-box;transform-origin:center}
.hc-pulse{animation:hc-pulse 3.8s ease both;transform-box:fill-box;transform-origin:center}
.hc-soft{stroke:var(--line,#d4d9d7)}
@keyframes hc-draw{0%,12%{stroke-dashoffset:1}82%,100%{stroke-dashoffset:0}}
@keyframes hc-reveal{0%{opacity:.08;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes hc-pulse{0%{opacity:.45;transform:scale(.98)}35%,100%{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.vs-motion{animation:none!important}}
</style><title id="hc-adapt-w-title">Responsible adaptation loop</title><desc id="hc-adapt-w-desc">A conceptual feedback loop showing discomfort, source checking, practice, correction, and modeled learning.</desc><defs><marker id="hc-adapt-w-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--figure-accent,#174bc5)"/></marker></defs><g class="vs-motion hc-pulse" style="animation-delay:1.15s"><circle cx="410" cy="216" r="92" fill="color-mix(in srgb, var(--figure-accent,#174bc5) 10%, transparent)" stroke="var(--figure-accent,#174bc5)" stroke-width="2"/><text x="410" y="208" font-size="25" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Adaptation</text><text x="410" y="236" font-size="14" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">practice with judgment</text></g><g class="vs-motion hc-reveal" style="animation-delay:0s"><rect x="72" y="74" width="200" height="86" rx="14" fill="var(--surface,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="172" y="109" font-size="20" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Discomfort</text><text x="172" y="135" font-size="14" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">the old way strains</text></g><g class="vs-motion hc-reveal" style="animation-delay:0.55s"><rect x="548" y="74" width="200" height="86" rx="14" fill="var(--surface,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="648" y="109" font-size="20" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Check sources</text><text x="648" y="135" font-size="14" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">no source, no trust</text></g><g class="vs-motion hc-reveal" style="animation-delay:1.1s"><rect x="548" y="276" width="200" height="86" rx="14" fill="var(--surface,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="648" y="311" font-size="20" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Practice</text><text x="648" y="337" font-size="14" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">use the tool carefully</text></g><g class="vs-motion hc-reveal" style="animation-delay:1.6500000000000001s"><rect x="72" y="276" width="200" height="86" rx="14" fill="var(--surface,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="172" y="311" font-size="20" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Correct</text><text x="172" y="337" font-size="14" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">change the workflow</text></g><path d="M272 117 C340 84 480 84 548 117" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:0.35s" marker-end="url(#hc-adapt-w-arrow)"/><path d="M648 160 C710 204 710 248 648 276" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:0.9s" marker-end="url(#hc-adapt-w-arrow)"/><path d="M548 319 C480 352 340 352 272 319" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:1.45s" marker-end="url(#hc-adapt-w-arrow)"/><path d="M172 276 C110 238 110 197 172 160" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:2s" marker-end="url(#hc-adapt-w-arrow)"/></svg>
