<svg id="hc-utility-w" class="systems-graphic head-clouds-graphic" xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img" aria-labelledby="hc-utility-w-title hc-utility-w-desc" style="font-family:var(--font-body,Inter,Arial,sans-serif)"><style>
.hc-draw{stroke-dasharray:1;stroke-dashoffset:0;animation:hc-draw 3.4s ease both}
.hc-reveal{opacity:1;animation:hc-reveal .9s ease both;transform-box:fill-box;transform-origin:center}
.hc-pulse{animation:hc-pulse 3.8s ease both;transform-box:fill-box;transform-origin:center}
.hc-soft{stroke:var(--line,#d4d9d7)}
@keyframes hc-draw{0%,12%{stroke-dashoffset:1}82%,100%{stroke-dashoffset:0}}
@keyframes hc-reveal{0%{opacity:.08;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes hc-pulse{0%{opacity:.45;transform:scale(.98)}35%,100%{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.vs-motion{animation:none!important}}
</style><title id="hc-utility-w-title">Utility source-to-decision path</title><desc id="hc-utility-w-desc">A conceptual utility diagram following scattered records into a source packet, authority check, and owned pump-station decision.</desc><defs><marker id="hc-utility-w-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--figure-accent,#174bc5)"/></marker></defs><g class="vs-motion hc-reveal" style="animation-delay:0s"><rect x="36" y="48" width="178" height="82" rx="14" fill="var(--surface,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="125" y="82" font-size="18" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Work orders</text><text x="125" y="106" font-size="13" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">what was done</text></g><path d="M214 89 C252 89 278 104 318 116" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:0.55s" marker-end="url(#hc-utility-w-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:0.15s"><rect x="36" y="164" width="178" height="82" rx="14" fill="var(--surface,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="125" y="198" font-size="18" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Operator notes</text><text x="125" y="222" font-size="13" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">what was seen</text></g><path d="M214 205 C252 205 278 104 318 116" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:0.7000000000000001s" marker-end="url(#hc-utility-w-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:0.3s"><rect x="36" y="280" width="178" height="82" rx="14" fill="var(--surface,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="125" y="314" font-size="18" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Capital plan</text><text x="125" y="338" font-size="13" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">what is funded</text></g><path d="M214 321 C252 321 278 104 318 116" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:0.8500000000000001s" marker-end="url(#hc-utility-w-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:1.05s"><rect x="318" y="70" width="224" height="118" rx="18" fill="color-mix(in srgb, var(--figure-accent,#174bc5) 12%, transparent)" stroke="var(--figure-accent,#174bc5)"/><text x="430" y="112" font-size="24" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Source packet</text><text x="430" y="142" font-size="14" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">missing record<tspan x="430" dy="17">owner · risk</tspan><tspan x="430" dy="17">next action</tspan></text></g><path d="M430 190 V254" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:1.45s" marker-end="url(#hc-utility-w-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:1.85s"><rect x="318" y="256" width="224" height="104" rx="18" fill="var(--surface,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="430" y="292" font-size="23" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Authority check</text><text x="430" y="322" font-size="14" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">who can act<tspan x="430" dy="17">and explain why</tspan></text></g><path d="M542 308 C600 296 626 252 664 228" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:2.25s" marker-end="url(#hc-utility-w-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:2.75s"><rect x="664" y="148" width="132" height="168" rx="20" fill="var(--figure-deep,var(--deep,#092b3e))" stroke="var(--figure-deep,var(--deep,#092b3e))"/><text x="730" y="204" font-size="24" fill="var(--figure-on-deep,#f5f3ed)" text-anchor="middle" font-weight="400" style="font-family:var(--font-display,'Newsreader',Georgia,serif);letter-spacing:0">Better<tspan x="730" dy="25">decision</tspan></text><text x="730" y="260" font-size="13" fill="var(--figure-soft-on-deep,#bed0dc)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">clear enough<tspan x="730" dy="16">to own</tspan></text></g></svg>
