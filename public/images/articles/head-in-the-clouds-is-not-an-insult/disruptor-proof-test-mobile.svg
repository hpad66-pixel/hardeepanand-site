<svg id="hc-proof-m" class="systems-graphic head-clouds-graphic" xmlns="http://www.w3.org/2000/svg" width="380" height="640" viewBox="0 0 380 640" role="img" aria-labelledby="hc-proof-m-title hc-proof-m-desc" style="font-family:var(--font-body,Inter,Arial,sans-serif)"><style>
.hc-draw{stroke-dasharray:1;stroke-dashoffset:0;animation:hc-draw 3.4s ease both}
.hc-reveal{opacity:1;animation:hc-reveal .9s ease both;transform-box:fill-box;transform-origin:center}
.hc-pulse{animation:hc-pulse 3.8s ease both;transform-box:fill-box;transform-origin:center}
.hc-soft{stroke:var(--line,#d4d9d7)}
@keyframes hc-draw{0%,12%{stroke-dashoffset:1}82%,100%{stroke-dashoffset:0}}
@keyframes hc-reveal{0%{opacity:.08;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes hc-pulse{0%{opacity:.45;transform:scale(.98)}35%,100%{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.vs-motion{animation:none!important}}
</style><title id="hc-proof-m-title">Burden-of-proof test for useful disruption</title><desc id="hc-proof-m-desc">A conceptual diagram showing how disruption becomes noise when it cannot answer what improves, and useful movement when it creates evidence, ownership, and follow-through.</desc><defs><marker id="hc-proof-m-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--figure-accent,#174bc5)"/></marker></defs><g class="vs-motion hc-reveal" style="animation-delay:0s"><rect x="46" y="28" width="288" height="76" rx="16" fill="var(--figure-deep,var(--deep,#092b3e))" stroke="var(--figure-deep,var(--deep,#092b3e))"/><text x="190" y="62" font-size="21" fill="var(--figure-on-deep,#f5f3ed)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Disruptive move</text><text x="190" y="89" font-size="14" fill="var(--figure-soft-on-deep,#bed0dc)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">pressure enters the room</text></g><path d="M190 108 V142" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:0.25s" marker-end="url(#hc-proof-m-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:0.55s"><rect x="46" y="148" width="288" height="86" rx="16" fill="color-mix(in srgb, var(--figure-accent,#174bc5) 12%, transparent)" stroke="var(--figure-accent,#174bc5)"/><text x="190" y="182" font-size="21" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Burden of proof</text><text x="190" y="209" font-size="14" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">what improves, who owns it</text></g><path d="M190 238 V276" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:0.8s" marker-end="url(#hc-proof-m-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:1.1s"><rect x="46" y="282" width="288" height="104" rx="16" fill="var(--surface,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="190" y="316" font-size="21" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">If it cannot answer</text><text x="190" y="343" font-size="14" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">noise, heat, reaction</text></g><path d="M190 390 V428" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:1.35s" marker-end="url(#hc-proof-m-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:1.6500000000000001s"><rect x="46" y="434" width="288" height="128" rx="16" fill="color-mix(in srgb, var(--figure-accent,#174bc5) 14%, var(--bg,#f5f3ed))" stroke="var(--figure-accent,#174bc5)"/><text x="190" y="468" font-size="21" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">If it can answer</text><text x="190" y="495" font-size="14" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">clearer decision · visible risk<tspan x="190" dy="18">better human work</tspan></text></g></svg>
