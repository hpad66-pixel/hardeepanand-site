<svg id="hc-proof-w" class="systems-graphic head-clouds-graphic" xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img" aria-labelledby="hc-proof-w-title hc-proof-w-desc" style="font-family:var(--font-body,Inter,Arial,sans-serif)"><style>
.hc-draw{stroke-dasharray:1;stroke-dashoffset:0;animation:hc-draw 3.4s ease both}
.hc-reveal{opacity:1;animation:hc-reveal .9s ease both;transform-box:fill-box;transform-origin:center}
.hc-pulse{animation:hc-pulse 3.8s ease both;transform-box:fill-box;transform-origin:center}
.hc-soft{stroke:var(--line,#d4d9d7)}
@keyframes hc-draw{0%,12%{stroke-dashoffset:1}82%,100%{stroke-dashoffset:0}}
@keyframes hc-reveal{0%{opacity:.08;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes hc-pulse{0%{opacity:.45;transform:scale(.98)}35%,100%{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.vs-motion{animation:none!important}}
</style><title id="hc-proof-w-title">Burden-of-proof test for useful disruption</title><desc id="hc-proof-w-desc">A conceptual diagram showing how disruption becomes noise when it cannot answer what improves, and useful movement when it creates evidence, ownership, and follow-through.</desc><defs><marker id="hc-proof-w-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--figure-accent,#174bc5)"/></marker></defs><g class="vs-motion hc-reveal" style="animation-delay:0s"><rect x="286" y="36" width="248" height="80" rx="18" fill="var(--figure-deep,var(--deep,#092b3e))" stroke="var(--figure-deep,var(--deep,#092b3e))"/><text x="410" y="69" font-size="22" fill="var(--figure-on-deep,#f5f3ed)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Disruptive move</text><text x="410" y="96" font-size="14" fill="var(--figure-soft-on-deep,#bed0dc)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">pressure enters the room</text></g><path d="M410 118 V158" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:0.35s" marker-end="url(#hc-proof-w-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:0.7s"><rect x="226" y="156" width="368" height="92" rx="17" fill="color-mix(in srgb, var(--figure-accent,#174bc5) 12%, transparent)" stroke="var(--figure-accent,#174bc5)"/><text x="410" y="194" font-size="23" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Can it carry<tspan x="410" dy="25">a burden of proof?</tspan></text></g><path d="M226 202 H132 V270" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:1.05s" marker-end="url(#hc-proof-w-arrow)"/><path d="M594 202 H688 V270" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:1.05s" marker-end="url(#hc-proof-w-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:1.5s"><rect x="36" y="270" width="192" height="112" rx="14" fill="var(--surface,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="132" y="312" font-size="24" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">No</text><text x="132" y="342" font-size="14" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">heat without<tspan x="132" dy="18">a better decision</tspan></text></g><g class="vs-motion hc-reveal" style="animation-delay:1.7s"><rect x="592" y="270" width="192" height="112" rx="14" fill="color-mix(in srgb, var(--figure-accent,#174bc5) 14%, var(--bg,#f5f3ed))" stroke="var(--figure-accent,#174bc5)"/><text x="688" y="312" font-size="24" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Yes</text><text x="688" y="342" font-size="14" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">evidence, ownership<tspan x="688" dy="18">and follow-through</tspan></text></g><g class="vs-motion hc-reveal" style="animation-delay:2.05s"><rect x="292" y="264" width="236" height="124" rx="14" fill="var(--surface,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="410" y="298" font-size="16" fill="var(--figure-accent,#174bc5)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Five checks</text><text x="410" y="324" font-size="13" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">What gets fixed?<tspan x="410" dy="16">What evidence improves?</tspan><tspan x="410" dy="16">Who can act?</tspan><tspan x="410" dy="16">What risk becomes visible?</tspan></text></g></svg>
