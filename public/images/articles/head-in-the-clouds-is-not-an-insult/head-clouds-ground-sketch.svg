<svg id="hc-ground-w" class="systems-graphic head-clouds-graphic" xmlns="http://www.w3.org/2000/svg" width="820" height="410" viewBox="0 0 820 410" role="img" aria-labelledby="hc-ground-w-title hc-ground-w-desc" style="font-family:var(--font-body,Inter,Arial,sans-serif)"><style>
.hc-draw{stroke-dasharray:1;stroke-dashoffset:0;animation:hc-draw 3.4s ease both}
.hc-reveal{opacity:1;animation:hc-reveal .9s ease both;transform-box:fill-box;transform-origin:center}
.hc-pulse{animation:hc-pulse 3.8s ease both;transform-box:fill-box;transform-origin:center}
.hc-soft{stroke:var(--line,#d4d9d7)}
@keyframes hc-draw{0%,12%{stroke-dashoffset:1}82%,100%{stroke-dashoffset:0}}
@keyframes hc-reveal{0%{opacity:.08;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes hc-pulse{0%{opacity:.45;transform:scale(.98)}35%,100%{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.vs-motion{animation:none!important}}
</style><title id="hc-ground-w-title">Vision returning to ground-level utility work</title><desc id="hc-ground-w-desc">Conceptual illustration showing vision tested by evidence, people, authority, records, and an owned decision.</desc><defs><marker id="hc-ground-w-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--figure-accent,#174bc5)"/></marker></defs><path d="M0 330 C112 300 212 340 322 318 C462 292 553 352 690 314 C760 294 790 304 820 292 L820 410 L0 410 Z" fill="var(--figure-accent,#174bc5)" fill-opacity="0.08"/><g class="vs-motion hc-reveal" style="animation-delay:0s"><path d="M88 110 C52 70 110 35 158 62 C183 12 264 29 266 86 C326 76 365 130 329 168 H92 C50 168 50 124 88 110 Z" fill="var(--figure-accent,#174bc5)" fill-opacity="0.13" stroke="var(--figure-accent,#174bc5)" stroke-width="2.5"/><text x="208" y="102" font-size="36" fill="var(--figure-accent,#174bc5)" text-anchor="middle" font-weight="500" style="font-family:var(--font-display,'Newsreader',Georgia,serif);letter-spacing:0">Vision</text><text x="208" y="136" font-size="14" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">what the system could become</text></g><path d="M335 136 C390 138 430 130 492 128" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:0.35s" marker-end="url(#hc-ground-w-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:0.55s"><rect x="480" y="64" width="262" height="160" rx="18" fill="var(--figure-tint,#edf2f3)" stroke="var(--figure-accent,#174bc5)"/><text x="611" y="102" font-size="26" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="400" style="font-family:var(--font-display,'Newsreader',Georgia,serif);letter-spacing:0">Ground test<tspan x="611" dy="27">evidence</tspan><tspan x="611" dy="27">people</tspan><tspan x="611" dy="27">authority</tspan></text><text x="611" y="204" font-size="13" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">not just a speech</text></g><g class="vs-motion hc-reveal" style="animation-delay:1.05s"><rect x="92" y="260" width="178" height="86" rx="14" fill="var(--surface,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="181" y="296" font-size="21" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Records</text><text x="181" y="324" font-size="13" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">what can be traced</text></g><g class="vs-motion hc-reveal" style="animation-delay:1.3s"><rect x="306" y="260" width="178" height="86" rx="14" fill="var(--surface,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="395" y="296" font-size="21" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">People</text><text x="395" y="324" font-size="13" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">who carries judgment</text></g><path d="M270 303 H300" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:1.3s" marker-end="url(#hc-ground-w-arrow)"/><g class="vs-motion hc-reveal" style="animation-delay:1.55s"><rect x="520" y="260" width="178" height="86" rx="14" fill="var(--surface,#f5f3ed)" stroke="var(--line,#d4d9d7)"/><text x="609" y="296" font-size="21" fill="var(--text,#092b3e)" text-anchor="middle" font-weight="700" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">Decision</text><text x="609" y="324" font-size="13" fill="var(--text-dim,#52616a)" text-anchor="middle" font-weight="400" style="font-family:var(--font-body,'Inter',Arial,sans-serif);letter-spacing:0">what someone owns</text></g><path d="M484 303 H514" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:1.55s" marker-end="url(#hc-ground-w-arrow)"/><path d="M611 224 C610 240 623 252 645 260" fill="none" stroke="var(--figure-accent,#174bc5)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="vs-motion hc-draw" style="animation-delay:0.9s" marker-end="url(#hc-ground-w-arrow)"/></svg>
